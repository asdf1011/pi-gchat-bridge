document.getElementById('comment-reply-send').onclick = () => void replyInThread();
document.getElementById('comment-resolve').onclick = () => void resolveComment();


// --- The index: recent conversations, paged, plus a new chat. ---

const PAGE_SIZE = 30;
let indexOffset = 0;

async function loadIndex(offset) {
  indexOffset = Math.max(0, offset || 0);
  let page = { items: [], more: false };
  try {
    page = await (await apiFetch(rel('api/conversations?limit=' + PAGE_SIZE + '&offset=' + indexOffset))).json();
  } catch {
    page = { items: [], more: false };
  }
  const list = document.getElementById('index-list');
  list.innerHTML = '';
  if (!Array.isArray(page.items) || page.items.length === 0) {
    const li = document.createElement('li');
    li.textContent = indexOffset === 0 ? 'No conversations yet — start one with ＋.' : 'Nothing older.';
    li.style.cursor = 'default';
    list.append(li);
  }
  for (const row of page.items || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="who"></span><span class="when"></span>';
    li.firstChild.textContent = row.name || row.chatKey;
    const at = row.lastActivityAt || row.createdAt;
    li.lastChild.textContent = formatWhen(at, true);
    li.title = '#' + row.conversationId + ' · ' + row.model + (at ? ' · ' + formatWhen(at) : '');
    li.onclick = () => {
      location.href = mountRoot() + row.conversationId + '/';
    };
    list.append(li);
  }

  const pager = document.getElementById('index-pager');
  const count = (page.items || []).length;
  pager.hidden = !(indexOffset > 0 || page.more);
  document.getElementById('index-newer').disabled = indexOffset === 0;
  document.getElementById('index-older').disabled = !page.more;
  document.getElementById('index-range').textContent =
    count === 0 ? '' : `${indexOffset + 1}–${indexOffset + count}`;
}

document.getElementById('index-newer').onclick = () => void loadIndex(indexOffset - PAGE_SIZE);
document.getElementById('index-older').onclick = () => void loadIndex(indexOffset + PAGE_SIZE);

// --- Search ---
//
// Searching the archive is not an endpoint: it is a **conversation**, opened with the
// query as its first message and told to use the `transcript-search` skill. The answer
// then arrives the ordinary way — a turn, a stream, a transcript — so there is nothing
// here to render and nothing to keep in step with the pane. `/api/conversations` takes
// the query and starts it, and this page only has to navigate to the conversation it made.
//
// Named functions rather than inline handlers, because the same search is offered from
// two places: the header of a conversation, and the index (which has no header to put a
// magnifier in, and so opens the box *through* a conversation page's own control).

/** True between submitting and arriving at the new conversation, so a second tap cannot
 *  open a second one. Cleared when the request comes back without navigating. */
let searching = false;

function searchBar_() {
  return document.getElementById('search-bar');
}

/** Open the search box and put the caret in it, so a tap is enough to start typing. */
function openSearch_() {
  const bar = searchBar_();
  const box = document.getElementById('search-text');
  const toggle = document.getElementById('search-toggle');
  if (!bar || !box) return;
  bar.hidden = false;
  if (toggle) toggle.setAttribute('aria-expanded', 'true');
  box.focus();
}

function closeSearch_() {
  const bar = searchBar_();
  const toggle = document.getElementById('search-toggle');
  if (!bar) return;
  bar.hidden = true;
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
}

/**
 * Start a search conversation, and go to it.
 *
 * The conversation is created by the host, which also submits the query as its first
 * message (see `searchPrompt` in `routes.ts` for what the agent is told). This side
 * never composes a prompt: that is the protocol's business, and a second copy of it
 * here would be a second thing to keep in step with the skill.
 */
async function startSearch_(query) {
  const searched = String(query || '').trim();
  if (searched === '' || searching) return;
  searching = true;
  const go = document.getElementById('search-go');
  if (go) go.disabled = true;
  try {
    const response = await apiFetch(rel('api/conversations'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: searched }),
    });
    const created = await response.json().catch(() => null);
    if (created && created.conversationId) {
      // The query stays in the box deliberately: a reader who comes back with the back
      // button should not have to retype it, and the navigation replaces the document
      // anyway.
      location.href = mountRoot() + created.conversationId + '/';
      return;
    }
    // No conversation came back, so say so instead of navigating nowhere. The host's
    // message is used when there is one — "no such model" is more use than "failed".
    attachNotice_(created && created.error ? String(created.error) : 'Search could not be started.');
  } catch {
    attachNotice_('Search could not be started — the connection failed.');
  }
  // Only reached when nothing navigated: the navigation path leaves the document, so
  // there is no timer to clear. Here the button has to come back, or one failure would
  // leave the box looking permanently busy.
  searching = false;
  if (go) go.disabled = false;
}

document.getElementById('search-toggle').onclick = () => {
  if (searchBar_().hidden) openSearch_();
  else closeSearch_();
};
document.getElementById('search-close').onclick = () => {
  closeSearch_();
  document.getElementById('search-toggle').focus();
};

// The index has no search bar of its own: it creates a conversation and opens *that*
// page with the box already showing. One search box in one document, rather than a
// second copy of the form here that would have to be kept identical to it.
document.getElementById('index-search').onclick = async () => {
  if (searching) return;
  searching = true;
  try {
    const created = await (await apiFetch(rel('api/conversations'), { method: 'POST' })).json();
    if (created && created.conversationId) {
      location.href = mountRoot() + created.conversationId + '/?search=1';
      return;
    }
    attachNotice_('Could not open a conversation to search in.');
  } catch {
    attachNotice_('Could not open a conversation to search in — the connection failed.');
  }
  searching = false;
};

// Escape closes the box, but only when the caret is in it: a key pressed elsewhere keeps
// meaning whatever it already meant.
document.getElementById('search-text').addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  event.preventDefault();
  closeSearch_();
  document.getElementById('search-toggle').focus();
});

document.getElementById('search-bar').onsubmit = (event) => {
  event.preventDefault();
  void startSearch_(document.getElementById('search-text').value);
};

document.getElementById('new-chat').onclick = async () => {
  try {
    const response = await apiFetch(rel('api/conversations'), { method: 'POST' });
    const created = await response.json();
    if (created && created.conversationId) location.href = mountRoot() + created.conversationId + '/';
  } catch {
    // Nothing sensible to say in the index; the click simply did not work.
  }
};

// --- Boot ---

const openId = conversationIdFromPath();
if (openId === undefined) {
  // The index is a document: the window scrolls it, so the rows past the fold
  // are reachable with the scrollbar the browser draws for the page.
  document.body.classList.add('indexing');
  document.getElementById('index').hidden = false;
  document.getElementById('app').hidden = true;
  document.getElementById('new-chat').hidden = false;
  setDocumentTitle('');
  void loadIndex(0);
} else {
  document.getElementById('index').hidden = true;
  document.getElementById('app').hidden = false;
  // No floating ＋ on a conversation page: it sat exactly where Send is.
  document.getElementById('new-chat').hidden = true;
  document.getElementById('back').href = mountRoot();
  current = openId;
  void loadTitle();
  // Fetched alongside the title, not when the picker first opens: the pill should
  // say "DeepSeek V4.1 Flash" rather than "deepseek-flash" from the first frame,
  // and a list this size costs nothing to have ready.
  void loadModels();
  open(openId);
  // The index's magnifier arrives here with `?search=1`: the search box belongs to this
  // page, so the gesture that started on the index is finished on it.
  if (new URLSearchParams(location.search).get('search') === '1') {
    openSearch_();
    // The query is transient, and leaving it in the address bar would make a reload
    // reopen the box for no reason.
    history.replaceState({}, '', location.pathname);
  }
  // A reload lands here with the fragment still naming something: a document that was open
  // (`#key`), or a message a link points at (`#e1234`). `followHash` tells them apart.
  void followHash();
}
</script>
</body>
</html>

 *     while the phone was off leaves the live block empty and the transcript a page behind, so the
 *     pane looks caught up and is not.
 *   - **the live turn**, which the stream's first frame normally carries — except that a frame is
 *     only sent when it *differs* from the last one, so a stream opened mid-turn can sit there
 *     drawing nothing until the model happens to say something new.
 *
 * Order matters: history first, then the live snapshot applied on top. The reverse loses the turn,
 * because `loadHistory` clears the live block when it paints the answer it now holds.
 */
async function catchUp(id, generation) {
  await loadHistory();
  // The conversation changed, or the stream was replaced, while this was in flight: the answer
  // describes a connection nobody is looking at.
  if (id !== current || generation !== streamGeneration) return;
  try {
    const response = await apiFetch(rel('api/c/' + id + '/events/state'));
    if (!response.ok) return;
    const resumed = await response.json();
    if (id !== current || generation !== streamGeneration) return;
    applyView(resumed);
    // Painted unconditionally: an idle conversation is the case this exists for, and there the
    // snapshot is empty, which is exactly what the stale live block has to be replaced with.
    paint();
    followEnd();
  } catch {
    // The catch-up failed. The stream is still up and the next frame or reconnect tries again; a
    // transient failure must not blank a pane that history has already made correct.
  }
}

/**
 * Take a view snapshot — the shape `attach` seeds a stream with — and make it the live state.
 *
 * One function for two callers: the `text` frames during a turn, and the snapshot asked for on
 * reconnect. The frames used to be read field by field at their call site, which is how the same
 * facts came to be assigned in two places and drift.
 */
function applyView(view) {
  const d = view && typeof view === 'object' ? view : {};
  liveText = typeof d.text === 'string' ? d.text : '';
  turnText = typeof d.turn === 'string' ? d.turn : '';
  turnHtml = typeof d.turnHtml === 'string' ? d.turnHtml : '';
  liveHtml = typeof d.html === 'string' ? d.html : '';
  busy = Boolean(d.busy);
  // The fix for a zombie status line. A turn's end arrives as a `text` frame with
  // `busy: false` and its tool clearing arrives as a separate `tool` frame with
  // `null`. The status used to be cleared only when the *next* turn began, so if the
  // completion repaint landed before the `tool` frame — or that frame never came —
  // the row survived on `statusLine` alone: a "Running: …" under an answer that had
  // already finished, which only a new turn painted over.
  turnEnded = !d.busy;
  statusLine = '';
}

/**
 * Try again, backing off.
 *
 * A fixed one-second retry is right for a bridge that is restarting and wrong for
 * one that is down for an hour: the pane would issue 3,600 requests and give the
 * restarter no room to breathe. The delay doubles from 1s to 30s, so the first
 * retry is still instant but a long outage settles into something polite.
 *
 * The footer says which it is, because "reconnecting…" that never resolves is
 * indistinguishable from a page that has quietly died.
 */
function scheduleReconnect(id) {
  if (reconnectTimer) return;
  const delay = Math.min(1000 * 2 ** reconnectAttempts, 30_000);
  reconnectAttempts += 1;
  if (reconnectAttempts > 2) {
    const secs = Math.round(delay / 1000);
    tool.textContent = `reconnecting… (${secs}s)`;
  }
  reconnectTimer = setTimeout(() => {
    reconnectTimer = undefined;
    connectStream(id);
  }, delay);
}

/**
 * Notice a stream that has stopped delivering, without ever erroring.
 *
 * The failure this exists for: a half-open connection. A dead NAT entry, a laptop
 * that slept, a proxy that dropped the stream while both ends still believe it is
 * up. Nothing fires — no `error`, no `close`, `readyState` stays OPEN — so the pane
 * sits there looking healthy and simply never updates again. That is precisely what
 * coming back to the tab after a while looked like.
 *
 * The server writes a `: keepalive` comment every 15s, so silence for well over
 * twice that means the connection is dead whatever the socket says. Reconnecting is
 * cheap and safe: the first frame after a reconnect is the whole current state, so
 * nothing is missed by starting over.
 */
function startLivenessWatch(id) {
  if (livenessTimer) clearInterval(livenessTimer);
  // 40s: two missed keepalives and a margin, so an ordinary hiccup or a slow
  // scheduler tick does not churn the connection.
  const SILENCE_MS = 40_000;
  livenessTimer = setInterval(() => {
    if (!source || source.readyState !== 1) {
      // A stream that is not open is the `error` handler's business, not this one's.
      return;
    }
    if (Date.now() - lastFrameAt < SILENCE_MS) return;
    // Deliberately silent in the footer: from the reader's point of view nothing
    // happened, and if the reconnect works nothing will have. Announcing a blip that
    // fixes itself is worse than the blip.
    connectStream(id);
  }, 10_000);
}

/**
 * The conversation's own name, for the header.
 *
 * A title if it has one, else its opening words — the same rule the index uses, so
 * a conversation is called the same thing wherever it appears.
 */
async function loadTitle() {
  const heading = document.getElementById('conv-title');
  heading.textContent = '#' + current;
  try {
    const conversation = await (await apiFetch(rel('api/c/' + current))).json();
    if (conversation && (conversation.name || conversation.chatKey)) {
      heading.textContent = conversation.name || conversation.chatKey;
    }
    // The same string in the window title as in the header, from the same response,
    // so an installed app's task switcher cannot disagree with the pane.
    setDocumentTitle(heading.textContent);
    // The same response carries the format, so the model and thinking pills can
    // say what will answer before anything is typed — one fetch, not two.
    adoptFormat(conversation);
  } catch {
    // The id is a fine fallback: the pane below is the thing being read.
  }
}

// Grow the box to fit what has been typed, so the whole message is visible
// instead of scrolling inside a fixed 3.5rem window that hides its first
// lines. `height: auto` first, otherwise scrollHeight still answers with the
// height the box already has and it can only ever grow, never shrink back.
// offsetHeight - clientHeight is the border, which scrollHeight excludes and
// border-box height includes.
function fitBox() {
  textBox.style.height = 'auto';
  const border = textBox.offsetHeight - textBox.clientHeight;
  // Never below the row's control height. `scrollHeight` measures content and
  // padding, so an empty box would otherwise resolve shorter than the buttons
  // beside it and the composer would sit ragged; the CSS `min-height` cannot help
  // once an inline height is set, which is exactly what this function does.
  const floor = parseFloat(getComputedStyle(textBox).minHeight) || 0;
  const wanted = Math.max(textBox.scrollHeight + border, floor);
  textBox.style.height = wanted + 'px';
  // Publish the resting height for the buttons to match. Only the *empty* box sets
  // it: once a message is being typed the box grows, and the buttons should stay a
  // button's height rather than stretching with it.
  if (textBox.value === '') matchControlHeight(wanted);
}

/** Make `--control-h` the box's own height, so the row lines up without guessing. */
function matchControlHeight(height) {
  document.documentElement.style.setProperty('--control-h', Math.round(height) + 'px');
}

textBox.addEventListener('input', fitBox);
// First paint: the box has its resting height once the font has loaded, which is
// when the buttons can be matched to it. `document.fonts` is optional; a browser
// without it gets the same result from the timeout.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitBox()).catch(() => {});
}
setTimeout(fitBox, 0);

// Paste can land a wall of text in one go, which fires `input` before the
// layout has the new content in some browsers; re-fit after it has settled.
textBox.addEventListener('paste', () => setTimeout(fitBox, 0));

const draftBox = document.getElementById('text');
draftBox.addEventListener('input', () => {
  saveDraft();
});

// --- Attached images ---
//
// Three ways in, one place to land: paste a screenshot, pick a file, or drop one
// on the pane. A screenshot on the clipboard is still the common case, so paste
// stays first-class, but "attach this picture from my phone" is the same request
// wearing a different hat — and a phone has no clipboard-to-paste for a photo
// that was never on it.
//
// The bytes stay in this page until send, as data URLs, and go up with the
// message. Nothing is uploaded on arrival: a message is one payload, and a file
// that sits on the server waiting for a message nobody sends is a temp file whose
// lifetime nobody owns.

/** Attached images waiting to be sent: `{dataUrl, mimeType, data}`. */
let pendingImages = [];
const attachmentsBox = document.getElementById('attachments');
const attachInput = document.getElementById('attach-input');
const attachNotice = document.getElementById('attach-notice');
const pane = document.getElementById('pane');

/**
 * The same limits the route enforces, so a file is refused here with a sentence
 * instead of failing the whole message at the server with a status code.
 *
 * They are repeated rather than fetched because the page must be able to answer
 * before it sends anything — a round trip to learn "that photo is too big" is a
 * worse way to find out. If they drift, the server still wins; this only decides
 * what is worth trying.
 */
const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGES = 10;

/**
 * Say why something was refused, in the place the thumbnails would have appeared.
 *
 * Silently ignoring a dropped file is the failure that makes people think the UI
 * is broken: the file is dragged, nothing happens, and there is nothing to read.
 */
let noticeTimer;
function attachNotice_(text) {
  attachNotice.textContent = text;
  attachNotice.hidden = !text;
  clearTimeout(noticeTimer);
  // Transient, but not instant: it has to be readable, and it should not sit
  // there for the rest of the conversation claiming a file was refused.
  if (text) noticeTimer = setTimeout(() => { attachNotice.hidden = true; attachNotice.textContent = ''; }, 6000);
}

/** `1.4 MB`, so a refusal names a size a person can compare with their file. */
function formatBytes(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function renderAttachments() {
  attachmentsBox.innerHTML = '';
  attachmentsBox.hidden = pendingImages.length === 0;
  pendingImages.forEach((image, index) => {
    const figure = document.createElement('figure');
    const img = document.createElement('img');
    img.src = image.dataUrl;
    img.alt = image.name || image.mimeType || 'attached image';
    img.title = image.name || image.mimeType || '';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.title = 'Remove';
    remove.onclick = () => {
      pendingImages.splice(index, 1);
      renderAttachments();
    };
    figure.append(img, remove);
    attachmentsBox.append(figure);
  });
  fitBox();
}

/**
 * Take files from any of the three ways in: keep the ones that are images within
 * the limits, and say what happened to the rest.
 *
 * One function rather than three copies, because the rules — which types, how
 * big, how many — are the part that must agree between paste, picker and drop.
 */
async function addImages(files) {
  const list = Array.from(files || []);
  if (list.length === 0) return;
  const refused = [];
  const accepted = [];
  for (const file of list) {
    if (!file || !String(file.type || '').startsWith('image/')) {
      refused.push('“' + (file && file.name ? file.name : 'that file') + '” is not an image');
    } else if (file.size > MAX_IMAGE_BYTES) {
      refused.push('“' + (file.name || 'that image') + '” is ' + formatBytes(file.size) +
        ', over the ' + formatBytes(MAX_IMAGE_BYTES) + ' limit');
    } else if (pendingImages.length + accepted.length >= MAX_IMAGES) {
      // Needed only for a drop of a whole folder: the route's body cap would
      // otherwise refuse the send itself, with no way to tell which file did it.
      refused.push('only ' + MAX_IMAGES + ' images fit in one message');
    } else {
      accepted.push(file);
    }
  }
  await Promise.all(accepted.map((file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const comma = dataUrl.indexOf(',');
      if (comma < 0) return resolve();
      pendingImages.push({
        dataUrl: dataUrl,
        data: dataUrl.slice(comma + 1),
        mimeType: file.type,
        name: file.name || '',
      });
      renderAttachments();
      resolve();
    };
    // A file that cannot be read is refused like any other: an unreadable image
    // would otherwise vanish between the picker and the strip.
    reader.onerror = () => {
      refused.push('“' + (file.name || 'that image') + '” could not be read');
      resolve();
    };
    reader.readAsDataURL(file);
  })));
  // Deduplicated and joined: dropping five text files should not say the same
  // thing five times, and the first reason is the one to act on.
  if (refused.length) attachNotice_([...new Set(refused)].join('; '));
  else attachNotice_('');
}

// Paste: clipboard files only, so an ordinary text paste is untouched.
draftBox.addEventListener('paste', (event) => {
  const items = event.clipboardData ? Array.from(event.clipboardData.items) : [];
  const files = items
    .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
    .map((item) => item.getAsFile())
    .filter((file) => file);
  if (files.length === 0) return; // ordinary text paste: leave it alone
  event.preventDefault();
  addImages(files);
});

// Picker: the attach button opens it, and the input is cleared afterwards so
// picking the same file twice in a row still fires `change`.
const attachButton = document.getElementById('attach');
attachButton.addEventListener('click', () => attachInput.click());
attachInput.addEventListener('change', () => {
  addImages(attachInput.files);
  attachInput.value = '';
});

// Drop: onto the pane, which includes the composer and the conversation above it.
// Counted rather than toggled, because dragging over a child fires `dragleave` on
// the parent: an unmatched leave would clear the highlight mid-drag and leave it
// stuck off after the drop.
let dragDepth = 0;
function carriesFiles(event) {
  const types = event.dataTransfer ? Array.from(event.dataTransfer.types || []) : [];
  return types.indexOf('Files') >= 0;
}
pane.addEventListener('dragenter', (event) => {
  if (!carriesFiles(event)) return;
  event.preventDefault();
  dragDepth += 1;
  pane.classList.add('dropping');
});
pane.addEventListener('dragover', (event) => {
  if (!carriesFiles(event)) return;
  // Without this the browser navigates to the file and the conversation is gone.
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});
pane.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) pane.classList.remove('dropping');
});
pane.addEventListener('drop', (event) => {
  dragDepth = 0;
  pane.classList.remove('dropping');
  if (!event.dataTransfer) return;
  // Only a file drop is ours: dropping selected text into the box is the
  // browser's own behaviour and must keep working.
  const files = Array.from(event.dataTransfer.files || []);
  if (files.length === 0) return;
  event.preventDefault();
  addImages(files);
  textBox.focus();
});

// Enter sends, because this is a chat box and that is what a chat box does.
// Shift-Enter and Ctrl-Enter (and Cmd-Enter) insert a newline instead, so a
// multi-line message is still possible without reaching for the mouse. IME
// composition is left alone: pressing Enter to commit a candidate must not send
// half a word.
draftBox.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  if (event.shiftKey || event.ctrlKey || event.metaKey) return;
  if (event.isComposing) return;
  event.preventDefault();
  document.getElementById('send').requestSubmit();
});

document.getElementById('send').onsubmit = async (e) => {
  e.preventDefault();
  const box = textBox;
  const text = box.value.trim();
  if ((!text && pendingImages.length === 0) || !current) return;
  const sending = pendingImages;
  // The box is cleared **after** the request is accepted, not before. Clearing first meant a send
  // that failed — an expired session is the case that made this visible — took the message with it,
  // and the reader watched their words disappear with no reply and no error.
  fitBox();
  // A line beginning with `/` is a command, not a message: it asks the application something rather
  // than telling the agent something. Images win, because dropping them silently is worse than
  // sending a message beginning with a slash.
  if (text.startsWith('/') && sending.length === 0) {
    // A command's text is the command, and its answer is the panel: nothing is lost by clearing it,
    // and leaving it there invites sending `/status` twice.
    box.value = '';
    saveDraft();
    await runCommandLine(text);
    return;
  }
  let response;
  try {
    response = await apiFetch(rel('api/c/' + current + '/message'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        images: sending.map((image) => ({ data: image.data, mimeType: image.mimeType })),
      }),
    });
  } catch {
    // The request never got an answer — a dropped connection, not an expired session (that one is a
    // redirect, which `apiFetch` classifies). Either way the message stays in the box.
    pendingImages = sending;
    renderAttachments();
    attachNotice_('Could not send — the connection failed. Your message is still here.');
    return;
  }
  // Show it immediately, the way Chat echoes your message: waiting for the
  // transcript refetch at the end of the turn made it look lost.
  try {
    const result = await response.json();
    if (result && result.ok) {
      transcript.push({
        role: 'user',
        text: text,
        html: result.html,
        at: Date.now(),
        // The pasted image is shown from its data URL: it has no entry id until
        // the transcript comes back, and re-reading it from disk mid-send would
        // be slower than the copy already in hand.
        images: sending.map((image) => ({ mimeType: image.mimeType, dataUrl: image.dataUrl })),
      });
      paint();
      // Accepted: now the box can go, and the draft with it. Clearing programmatically fires no
      // `input` event and `saveDraft()` is only wired to that, so it is called explicitly — the
      // draft previously outlived the send and refilled the box on the next open.
      box.value = '';
      pendingImages = [];
      renderAttachments();
      saveDraft();
      fitBox();
    } else {
      // Refused: keep the text and the images, and say so once. The turn's own error, if any,
      // arrives on the stream; this is about the *send*.
      pendingImages = sending;
      renderAttachments();
      if (result && result.error) attachNotice_(String(result.error));
    }
  } catch {
    // Unreadable answer: keep the draft, because the alternative is losing it.
  }
};

// --- Commands -----------------------------------------------------------------
//
// A line beginning with `/` is not a message. It goes to `api/c/<id>/commands` and comes back as one
// of four *shapes* — text, a list, a choice, a form — which this page renders and knows nothing
// further about. That is the trade the vocabulary makes: four renderers here instead of eleven
// commands, and a command added on the server appears in every surface at once.
//
// The answer is drawn in its own panel above the composer rather than in the transcript, for a dull
// and decisive reason: `paint()` rebuilds the log from `transcript` on every stream frame, so a
// message-shaped thing that is not a message would disappear at the next one.

const commandPanel = document.getElementById('command-panel');
const commandBody = document.getElementById('command-body');
const commandTitle = document.getElementById('command-title');
document.getElementById('command-close').onclick = () => {
  commandPanel.hidden = true;
  commandBody.innerHTML = '';
};

/** One text node, so a command's output can never be markup. */
function commandText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

/**
 * Ask the server what a command means, then draw the answer.
 *
 * `values` is a form's or a choice's answer, keyed by field id. The command text stays the same —
 * what was asked and what was chosen are different things, and the second one is untrusted.
 */
async function runCommandLine(text, values, preview) {
  if (!current) return;
  let shape;
  try {
    const response = await apiFetch(rel('api/c/' + current + '/commands'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, ...(values ? { values } : {}), ...(preview ? { preview: true } : {}) }),
    });
    shape = await response.json();
  } catch {
    shape = { kind: 'text', text: 'The command did not answer. Is the bridge still running?' };
  }
  if (!shape || typeof shape.kind !== 'string') shape = { kind: 'text', text: 'The command answered with nothing.' };
  renderCommand(shape);
}

function renderCommand(shape) {
  commandBody.innerHTML = '';
  commandPanel.hidden = false;
  if (shape.kind === 'text') {
    commandTitle.textContent = 'Command';
    commandBody.append(commandText('p', shape.text));
    // A command that made a conversation says where it is; going there is the point of `/new` and
    // `/resume`, and a link the reader has to find in a list would be worse than a redirect.
    if (typeof shape.goto === 'number') {
      window.location.href = mountRoot() + shape.goto + '/';
      return;
    }
    return;
  }
  if (shape.kind === 'list') {
    commandTitle.textContent = shape.title || 'Results';
    const rows = Array.isArray(shape.rows) ? shape.rows : [];
    if (rows.length === 0) {
      commandBody.append(commandText('p', shape.empty || 'Nothing.'));
      return;
    }
    const list = document.createElement('ul');
    for (const row of rows) {
      const item = document.createElement('li');
      const sends = typeof row.command === 'string' && row.command !== '';
      const navigates = !sends && Number.isInteger(row.conversationId);
      const button = document.createElement(sends || navigates ? 'button' : 'div');
      if (sends || navigates) button.type = 'button';
      button.className = 'row' + (sends || navigates ? ' clickable' : '') + (row.current ? ' current' : '');
      button.append(commandText('span', row.label));
      if (row.detail) button.append(commandText('span', row.detail, 'detail'));
      // A row about a conversation is a link, because this page can open any conversation. On a
      // surface that cannot — a Chat thread is bound to one conversation — the same row carries a
      // command instead, and this page never sees it.
      if (sends) button.onclick = () => void runCommandLine(row.command);
      else if (navigates) button.onclick = () => { window.location.href = mountRoot() + row.conversationId + '/'; };
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'choice') {
    commandTitle.textContent = shape.prompt || 'Choose';
    const list = document.createElement('ul');
    for (const option of Array.isArray(shape.options) ? shape.options : []) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'row clickable' + (option.selected ? ' current' : '');
      button.append(commandText('span', option.label));
      if (option.detail) button.append(commandText('span', option.detail, 'detail'));
      // Choosing is sending the command with this option as the answer, so a choice and a form
      // submit are the same wire shape and the server sees one mechanism, not two.
      button.onclick = () => void runCommandLine(shape.command, option.values ?? {});
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'form') {
    commandTitle.textContent = shape.prompt || 'Fill this in';
    const form = document.createElement('form');
    const fields = Array.isArray(shape.fields) ? shape.fields : [];
    const controls = new Map();
    for (const field of fields) {
      const label = document.createElement('label');
      label.append(commandText('span', field.label));
      let control;
      if (field.kind === 'select') {
        control = document.createElement('select');
        for (const option of Array.isArray(field.options) ? field.options : []) {
          const choice = document.createElement('option');
          choice.value = option.id;
          choice.textContent = option.detail && option.detail !== option.label
            ? option.label + ' — ' + option.detail
            : option.label;
          if (option.selected || option.id === field.value) choice.selected = true;
          control.append(choice);
        }
      } else if (field.kind === 'secret') {
        // Masked, never prefilled, and never re-rendered from a previous answer: the value exists
        // between the keystroke and the POST and nowhere else on this page.
        control = document.createElement('input');
        control.type = 'password';
        control.autocomplete = 'new-password';
        control.value = '';
      } else {
        control = document.createElement('input');
        control.type = 'text';
        if (field.value) control.value = field.value;
      }
      control.id = 'field-' + field.id;
      if (field.hint) label.append(commandText('span', field.hint, 'hint'));
      label.append(control);
      controls.set(field.id, control);
      form.append(label);
      // A field whose value another field's options depend on — the model, whose levels the thinking
      // select lists. Changing it re-asks the command with a preview, so the command decides what the
      // change means instead of this page knowing.
      if (field.requery && field.kind === 'select') {
        control.onchange = () => {
          const values = {};
          for (const [id, each] of controls) values[id] = each.value;
          void runCommandLine(shape.command, values, true);
        };
      }
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = shape.submit || 'Apply';
    actions.append(submit);
    form.append(actions);
    form.onsubmit = (event) => {
      event.preventDefault();
      const values = {};
      for (const [id, control] of controls) values[id] = control.value;
      void runCommandLine(shape.command, values);
    };
    commandBody.append(form);
    return;
  }
  // An unknown shape is not a crash: a newer server talking to an older page says something, and the
  // page says what it can.
  commandTitle.textContent = 'Command';
  commandBody.append(commandText('p', 'This page does not know how to show that answer.'));
}

// --- Send, split: which model answers, and how hard it thinks --------------
//
// The caret on the Send button opens one menu holding both things that decide how
// the next message is answered: the model, and that model's thinking level. It is
// a *split button* rather than a pill standing beside Send because sending is the
// action and the format is a property of it — two equal buttons made a setting look
// like a verb. It exists at all because the only way to change the model used to be
// typing `/model` into the box, which needs both the command and the model's key;
// when the provider ran out of credit there was no visible way off that model.
//
// The menu is one popup containing two lists, model first: "what will answer" and
// "how hard it thinks about it" are one question asked in two parts. One popup also
// means there is never a second one to keep in sync.
//
// State comes with the conversation (`GET /api/c/<id>` returns `format`), so the
// menu opens already knowing what is in use, and the list of choices comes from
// `GET /api/models`, which carries each model's levels — so a level is never
// offered for a model that does not have it.
//
// Applying goes through `/model` like any other surface's would. The page does not
// decide what a valid combination is; the command does, and a refusal is shown in
// the command panel where this page has always put an answer.

const picker = document.getElementById('picker');
const pickerList = document.getElementById('picker-list');
const pickerLevels = document.getElementById('picker-levels');
const pickerNow = document.getElementById('picker-now');
const pickerModelHeading = document.getElementById('picker-model-heading');
const pickerThinkingHeading = document.getElementById('picker-thinking-heading');
const pickerSearch = document.getElementById('picker-search');
/** The row the search box sits in: hidden as a unit, so the border goes with it. */
const pickerSearchRow = pickerSearch.parentElement;
const pickerScrim = document.getElementById('picker-scrim');
const sendMenuButton = document.getElementById('send-menu');
/** The footer: what is staged, and the button that sends it. */
const pickerStaged = document.getElementById('picker-staged');
const pickerApply = document.getElementById('picker-apply');

/** The conversation's format, as last reported by the server. */
let formatState = null;
/** Whether the menu is open. One menu now, so this is a flag, not a name. */
let pickerOpen = false;
/** Every model, with its levels, fetched once and filtered locally. */
let modelChoices = null;
/**
 * What the reader has chosen but not yet applied.
 *
 * The popup answers one question in two parts — which model, and how hard it thinks
 * — and it used to answer it by closing on the first part. Tapping a model applied
 * it and shut the menu, so the thinking level was unreachable: gone before it could
 * be picked, and picking a model was the only way to see a new model's levels. So a
 * tap stages instead. `null` when nothing is staged, and `staged.levels` is the list
 * *that model* offers, which is why it travels with the model rather than being read
 * back off `formatState` (that still describes the model in use, not the one chosen).
 */
let staged = null;

/** Take the format from a conversation payload, when it carries one. */
function adoptFormat(conversation) {
  const format = conversation && conversation.format;
  if (!format || typeof format.model !== 'string') {
    // An older payload, or a host that could not answer. The caret still opens (it
    // can still change the model), but it cannot claim to know the current one.
    formatState = null;
    return;
  }
  formatState = {
    model: format.model,
    thinking: typeof format.thinking === 'string' ? format.thinking : undefined,
    levels: Array.isArray(format.levels) ? format.levels : [],
  };
}

/** The model id from a key, for when the labels have not arrived yet. */
function shortModelName(key) {
  const slash = key.indexOf('/');
  return slash > 0 ? key.slice(slash + 1) : (key || 'Model');
}

/** The label for a key, once the list has arrived. */
function modelLabelOf(key) {
  const chosen = (modelChoices || []).find((model) => model.key === key);
  return chosen ? chosen.label : shortModelName(key);
}

/** The level a staged choice would actually apply, given the levels it offers. */
function stagedLevelOf(choice) {
  if (!choice) return undefined;
  // Keep the level in use when the new model has it — switching between reasoning
  // models should not silently reset how hard they think — and otherwise take the
  // model's first level. A model with no levels takes none: sending a level to a
  // model that does not think is a refusal, not a preference.
  const keep = choice.thinking;
  if (keep !== undefined && choice.levels.includes(keep)) return keep;
  return choice.levels[0];
}

/** Whether the staged choice is already what is in use. */
function stagedIsCurrent() {
  if (!formatState || !staged) return false;
  return staged.model === formatState.model
    && stagedLevelOf(staged) === formatState.thinking;
}

/** Load the model list, once. Filtering then costs nothing. */
async function loadModels() {
  if (modelChoices) return modelChoices;
  try {
    const response = await apiFetch(rel('api/models'));
    const body = await response.json();
    modelChoices = Array.isArray(body && body.models) ? body.models : [];
  } catch {
    modelChoices = [];
  }
  return modelChoices;
}

/** Close the menu, restoring focus to the caret that opened it. */
function closePicker() {
  pickerOpen = false;
  picker.hidden = true;
  pickerScrim.hidden = true;
  pickerSearchRow.hidden = true;
  pickerList.innerHTML = '';
  pickerLevels.innerHTML = '';
  // A choice that was never applied does not outlive the popup. Closing is how a
  // reader says "never mind", and reopening with somebody else's earlier pick still
  // selected would be the popup talking to itself rather than to them.
  staged = null;
  sendMenuButton.setAttribute('aria-expanded', 'false');
  // Focus goes back to the caret, so Escape is not a dead end for a keyboard.
  if (document.activeElement && picker.contains(document.activeElement)) sendMenuButton.focus();
}

/** Whether the layout is the phone sheet. */
function isNarrow() {
  // The same breakpoint the CSS uses, asked in JS so the popup can be positioned
  // only when it is one. Guarded because a missing `matchMedia` must not take the
  // menu down with it: an unpositioned list is still a usable one.
  try {
    return window.matchMedia('(max-width: 40rem)').matches;
  } catch {
    return window.innerWidth <= 640;
  }
}

/**
 * Put the menu next to the caret, or up from the bottom on a phone.
 *
 * The sheet is entirely CSS (see the media query): both are the same element, so
 * there is one list, one search box and one close path. This only computes the
 * desktop anchor, and only when the layout is a popup — a sheet pinned to the
 * viewport must not be given coordinates.
 */
function placePicker(searchable) {
  const sheet = isNarrow();
  // Search for finding a model in a long list, on a screen with no keyboard. On a
  // desktop the popup is small and scrollable, and a search field inside it is
  // mostly chrome. Same input either way, so there is one filter.
  pickerSearchRow.hidden = !(sheet && searchable);
  const rect = sendMenuButton.getBoundingClientRect();
  // How tall the popup may be: the space between the top of the window and six
  // pixels above the caret, less a margin. Measured rather than guessed, because
  // the guess (`34rem`) was short by a couple of rows — enough that the thinking
  // list scrolled to show its last level, which looks like a clipped list rather
  // than a scrollable one.
  picker.style.setProperty(
    '--picker-room',
    // The sheet is pinned to the bottom, so the caret's position says nothing about
    // how much room there is; the window does. Leave the composer visible under it:
    // a sheet that covers the box you were typing in is a page you have to dismiss
    // to see what you wrote.
    (sheet ? window.innerHeight * 0.78 : Math.max(12 * 16, rect.top - 6 - 12)) + 'px',
  );
  if (sheet) {
    picker.style.left = '';
    picker.style.top = '';
    picker.style.bottom = '';
    return;
  }
  const width = picker.offsetWidth || 320;
  // Above the button: the composer is at the bottom, so a list below it would be
  // off-screen. Right-aligned to the caret's trailing edge, so the popup grows
  // leftwards from the button that opened it rather than off the right edge.
  const left = Math.min(Math.max(12, rect.right - width), window.innerWidth - width - 12);
  picker.style.left = left + 'px';
  picker.style.top = '';
  picker.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
}

/**
 * One row: a label, an optional subtitle, a tick when it is the current value and a
 * dot when it is the staged one.
 *
 * Two marks rather than one because there are now two questions a row answers: is
 * this in use, and is this what I just picked. They can both be true (staging the
 * current model at a new level) and they can both be false, so neither can stand in
 * for the other. `staging` dulls the current-row tint while a choice is pending, so
 * "chosen" and "in use" never wear the same border at the same time.
 */
function pickerItem(label, detail, isCurrent, apply, isStaged, staging) {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'item'
    + (isCurrent ? ' current' : '')
    + (isStaged ? ' staged' : '')
    + (staging ? ' staging' : '');
  button.setAttribute('role', 'option');
  button.setAttribute('aria-selected', isStaged ? 'true' : 'false');
  const name = document.createElement('span');
  name.className = 'name';
  const text = document.createElement('span');
  text.textContent = label;
  name.append(text);
  if (isCurrent) {
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    tick.setAttribute('aria-hidden', 'true');
    name.append(tick);
  }
  if (isStaged) {
    // A filled dot, not a second tick: a staged row is chosen, not in use yet.
    const dot = document.createElement('span');
    dot.className = 'tick staged-dot';
    dot.textContent = '●';
    dot.setAttribute('aria-hidden', 'true');
    name.append(dot);
  }
  button.append(name);
  if (detail) {
    const sub = document.createElement('span');
    sub.className = 'detail';
    sub.textContent = detail;
    button.append(sub);
  }
  button.onclick = () => apply();
  item.append(button);
  return item;
}

/** Open the menu: the current format, then every model, then this model's levels. */
async function openPicker() {
  pickerOpen = true;
  sendMenuButton.setAttribute('aria-expanded', 'true');
  picker.hidden = false;
  pickerScrim.hidden = false;
  pickerSearch.value = '';
  renderPickerNow();
  renderPickerActions();
  placePicker(true);
  drawModels('');
  // No focus on the search box. Focusing it raised the on-screen keyboard over a
  // list that is usually answered by tapping: most visits pick a model, and a
  // keyboard covering the first rows costs more than typing would save. The box is
  // still there for the long list, one tap away.
  await loadModels();
  if (!pickerOpen) return; // closed while loading
  renderPickerNow();
  drawModels('');
  renderPickerActions();
  placePicker(true);
}

/**
 * The menu's header: what the *next* message will use, in words.
 *
 * It follows the staged choice, not the last applied one, because the first
 * question every reader has when a popup is open is "what have I got selected?".
 * With nothing staged it says what is in use, which is the same question answered
 * about the conversation rather than about the popup.
 */
function renderPickerNow() {
  if (!staged && !formatState) {
    pickerNow.textContent = 'Choose the model and thinking level for this conversation.';
    return;
  }
  // A staged choice is resolved to the level it *would* apply; the format already
  // knows the level it *did*. Reading them through one variable would mean trusting
  // a field that means something different on each side of the staging flag.
  const key = staged ? staged.model : formatState.model;
  const level = staged ? stagedLevelOf(staged) : formatState.thinking;
  pickerNow.innerHTML = '';
  const model = document.createElement('b');
  model.textContent = modelLabelOf(key);
  pickerNow.append(staged ? 'Selected: ' : 'Next message: ', model);
  if (level) {
    pickerNow.append(' · thinking ');
    const b = document.createElement('b');
    b.textContent = level;
    pickerNow.append(b);
  }
}

/** The footer: what is staged, and whether Apply has anything to do. */
function renderPickerActions() {
  if (!pickerOpen) return;
  pickerApply.disabled = staged === null || stagedIsCurrent();
  if (!staged) {
    // Not "nothing selected" — the useful thing to say is that what is in use
    // stays in use until Apply, because the popup no longer changes anything by
    // being tapped.
    pickerStaged.textContent = formatState ? '' : 'Pick a model, then Apply.';
    return;
  }
  const level = stagedLevelOf(staged);
  const what = modelLabelOf(staged.model) + (level ? ' · ' + level : '');
  if (stagedIsCurrent()) pickerStaged.textContent = 'That is already in use.';
  else pickerStaged.textContent = 'Apply: ' + what;
}

function drawModels(query) {
  if (!pickerOpen) return;
  pickerList.innerHTML = '';
  const needle = (query || '').trim().toLowerCase();
  const matching = (modelChoices || []).filter((model) => {
    if (!needle) return true;
    // Label and key both: searching "flash" means the name, "deepseek" means the
    // provider in the key.
    return (model.label || '').toLowerCase().includes(needle)
      || (model.key || '').toLowerCase().includes(needle);
  });
  if (modelChoices && modelChoices.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'No models are configured.';
    pickerList.append(empty);
  } else if (matching.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'No model matches “' + query + '”.';
    pickerList.append(empty);
  } else {
    for (const model of matching) {
      pickerList.append(pickerItem(
        model.label || shortModelName(model.key),
        // No key under the name. `deepseek/deepseek-flash` is the wire format, not
        // something a person reads, and the label already says which model it is:
        // "DeepSeek V4.1 Flash". The key is still what gets applied — it just does
        // not need to be on screen to be understood.
        '',
        formatState !== null && model.key === formatState.model,
        // A tap stages, it does not apply: the thinking list below this one is
        // the other half of the same answer, and it has to survive the tap to be
        // reachable at all.
        () => stageModel(model.key, model.levels),
        staged !== null && model.key === staged.model,
        staged !== null,
      ));
    }
  }
  drawLevels();
}

/**
 * The thinking levels of the model that will answer.
 *
 * That is the staged model when there is one, so tapping a model shows *its*
 * levels in the same popup — the whole point of staging. `formatState.levels` is
 * the fallback, and describes the model in use.
 *
 * Hidden entirely when the model has none (a small local model does not think at a
 * level), rather than shown empty: an empty section reads as a broken page, while
 * its absence reads as "not applicable".
 */
function drawLevels() {
  pickerThinkingHeading.hidden = true;
  pickerLevels.hidden = true;
  pickerLevels.innerHTML = '';
  if (!pickerOpen) return;
  if (modelChoices === null || pickerSearch.value.trim()) {
    // Filtering or still loading: the section would describe a model the list is
    // busy hiding, so it steps out of the way rather than showing stale rows.
    return;
  }
  const model = staged ? staged.model : formatState && formatState.model;
  if (!model) return;
  const levels = staged ? staged.levels : (formatState ? formatState.levels : []);
  if (levels.length === 0) return;
  const current = staged ? stagedLevelOf(staged) : (formatState && formatState.thinking);
  pickerThinkingHeading.hidden = false;
  pickerLevels.hidden = false;
  for (const level of levels) {
    pickerLevels.append(pickerItem(
      level,
      '',
      level === current,
      () => stageLevel(level),
      staged !== null && level === stagedLevelOf(staged),
      staged !== null,
    ));
  }
}

/**
 * Stage a model, keeping the level in use when the new model offers it.
 *
 * Nothing is sent. The level is resolved from the *new* model's own levels, so
 * switching to a small local model stages "no level" rather than a level the new
 * model would refuse — and switching back keeps what was chosen where it fits.
 */
function stageModel(key, levels) {
  const kept = staged ? stagedLevelOf(staged) : (formatState && formatState.thinking);
  staged = { model: key, thinking: kept, levels: Array.isArray(levels) ? levels : [] };
  renderPickerNow();
  drawModels(pickerSearch.value);
  renderPickerActions();
  // The rows are rebuilt by `drawModels`, so the tap's own row is gone and the
  // browser's scroll-into-view with it: a long list left the chosen model half
  // behind the THINKING heading, looking selected and cut off at once. Put it back
  // in sight, and only just — `nearest` does not re-centre a list nobody scrolled.
  const chosen = [...pickerList.querySelectorAll('.item')]
    .find((row) => row.classList.contains('staged'));
  // Guarded: `scrollIntoView` is absent in a DOM without layout (the jsdom tests),
  // and a missing convenience must not be able to throw out of a click handler and
  // take the staging with it.
  if (chosen && typeof chosen.scrollIntoView === 'function') chosen.scrollIntoView({ block: 'nearest' });
}

/**
 * Stage a thinking level.
 *
 * The model is the staged one, or — when only the level was touched — the model in
 * use, at the levels it in fact offers. Picking a level without touching the model is
 * the common case ("think harder about this one"), and it should not need the model
 * tapped first to become a real choice.
 */
function stageLevel(level) {
  if (!staged) {
    if (!formatState) return;
    staged = { model: formatState.model, thinking: level, levels: formatState.levels };
  } else {
    staged = { ...staged, thinking: level };
  }
  renderPickerNow();
  drawModels(pickerSearch.value);
  renderPickerActions();
}

/**
 * Apply the staged choice, then re-read the format.
 *
 * The whole format is sent, not just the field that changed: `/model` takes a model
 * and a level together, and sending one alone would leave the other to a guess. The
 * level comes from `stagedLevelOf`, so one the new model does not have is replaced
 * by one it does *before* the request, rather than sent to be refused.
 *
 * This is the only thing in the popup that changes the conversation. Staging is why:
 * the model and the thinking level are one answer in two parts, and applying each
 * part as it was tapped shut the popup between them.
 */
async function applyFormat() {
  if (!staged) return;
  const wanted = stagedLevelOf(staged);
  const body = JSON.stringify({
    text: '/model',
    values: { model: staged.model, ...(wanted === undefined ? {} : { thinking: wanted }) },
  });
  // Shut before the round trip: the choice is made, and a popup that lingers while
  // a local model is switched would look like the tap did nothing. A refusal still
  // reaches the reader, in the command panel.
  closePicker();
  let shape;
  try {
    const response = await apiFetch(rel('api/c/' + current + '/commands'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    shape = await response.json();
  } catch {
    renderCommand({ kind: 'text', text: 'The model change did not go through. Is the bridge still running?' });
    return;
  }
  if (shape && shape.kind !== 'form') {
    // The command refused. Say so where this page has always put an answer, and
    // name what was asked for: the popup is gone, so the answer has to carry it.
    renderCommand(shape);
    return;
  }
  commandPanel.hidden = true;
  commandBody.innerHTML = '';
  await refreshFormat();
}

/**
 * Re-read the format from the server after a change.
 *
 * Re-reading rather than assuming the change landed: `/model` validates (a level
 * the model does not have is refused), and the caret showing the choice before it
 * was accepted would be lying for exactly as long as it took the server to disagree.
 */
async function refreshFormat() {
  try {
    adoptFormat(await (await apiFetch(rel('api/c/' + current))).json());
  } catch {
    // Keep what we have: it is still the last thing the server said.
  }
}

sendMenuButton.onclick = () => {
  if (pickerOpen) closePicker();
  else void openPicker();
};
pickerApply.onclick = () => void applyFormat();
pickerScrim.onclick = () => closePicker();
pickerSearch.addEventListener('input', () => {
  drawModels(pickerSearch.value);
  renderPickerActions();
});
// The popup's two keys, in one listener so Escape is never the only thing that
// reaches the picker.
//
// Escape closes: the menu is a popup, and a popup that traps Escape is a dialog
// nobody asked for. Enter applies, which is the keyboard's version of the one tap
// a thumb makes — without it staging would have made switching models *slower* for
// anyone who typed a name, and that is the trade this whole change is about.
document.addEventListener('keydown', (event) => {
  if (!pickerOpen) return;
  if (event.key === 'Escape') {
    event.stopPropagation();
    closePicker();
    return;
  }
  if (event.key !== 'Enter' || pickerApply.disabled) return;
  // A press on the Apply button is its own click; letting it through twice would
  // send the same `/model` twice.
  if (event.target === pickerApply || event.target === sendMenuButton) return;
  event.preventDefault();
  event.stopPropagation();
  pickerApply.click();
}, true);
/**
 * Re-place the picker when the window changes, rather than closing it.
 *
 * This used to close on any resize, which broke the picker on a phone outright:
 * tapping the caret is enough to fire `resize` there — browser chrome collapsing
 * as the page scrolls, the address bar reflowing, an on-screen keyboard settling.
 * The sheet opened and was shut again within a frame, so the caret looked like it
 * did nothing at all.
 *
 * Closing was only ever a shortcut for "the anchor moved". On the sheet there is
 * no anchor to move, and on desktop re-placing is one function call, so the honest
 * response to a resize is to re-place.
 */
window.addEventListener('resize', () => {
  if (!pickerOpen) return;
  // The menu always holds the model list — the thinking levels ride below it — so it
  // is searchable wherever it is shown. `placePicker` still gates on `isNarrow()`:
  // the search box only appears on the sheet.
  placePicker(true);
});

// The artifact drawer lives in its own file (`artifacts.js`) and is inlined here
// when the page is read, so the browser still gets one document. It is kept apart
// because it is the largest single feature on this page and the one with the most
// behaviour of its own: a pool of frames, a drag gesture, and the comment layer
// riding on top of it.
/* @@include:artifacts.js@@ */

// --- Review comments ---------------------------------------------------------
//
// The framed document cannot submit anything, by design: it is a different origin,
// sandboxed, and its own bytes are agent-written. So it *reports* — a selection, a
// click on a highlight — and this page, which owns the session and the API, turns
// that into a message. Nothing crosses except numbers and text, and the frame is
// identified by `event.source`, not by an origin string (a sandboxed frame's
// origin is the string "null", which no check can distinguish).

const commentBar = document.getElementById('comment-bar');
const commentAddr = document.getElementById('comment-addr');
const commentQuote = document.getElementById('comment-quote');
/* The selected part of a picture, as the comment will attach it. */
const commentPreview = document.getElementById('comment-preview');
const commentText = document.getElementById('comment-text');
const commentError = document.getElementById('comment-error');
const commentSheet = document.getElementById('comment-sheet');
const commentSheetAddr = document.getElementById('comment-sheet-addr');
const commentSheetQuote = document.getElementById('comment-sheet-quote');
/* The part of a picture a thread is about, when it is about one. */
const commentSheetPreview = document.getElementById('comment-sheet-preview');
const commentThread = document.getElementById('comment-thread');
const commentReply = document.getElementById('comment-reply');

/** The selection the comment bar is currently about. */
let pendingSelection = null;
/** The comment whose thread is open. */
let openCommentId = null;
/** Every comment this conversation has, keyed by id, from the last load. */
let commentsById = new Map();

/**
 * What to show above the composer.
 *
 * A source view reports lines, so the address is the real one. A rendered view
 * reports text, and the address is only decided once the host has found it — so
 * the bar shows the quotation instead of inventing a line number.
 */
function commentAddress(selection) {
  // A rectangle has no line, and a `#L…` address would be a lie about a picture: it is
  // four numbers naming the part of the picture that was dragged over.
  if (selection.region) {
    const region = selection.region;
    // A page comes first, because it is the first thing that tells a reader *where*
    // this is: `p3 x120,y64 320×180`.
    const page = region.page === undefined ? '' : 'p' + region.page + ' ';
    return page + 'x' + region.x + ',y' + region.y + ' ' + region.width + '×' + region.height;
  }
  const line = selection.line;
  if (line === undefined) {
    const quote = (selection.quote || '').replace(/\s+/g, ' ').trim();
    return quote.length > 60 ? quote.slice(0, 60) + '…' : quote;
  }
  const endLine = selection.endLine || line;
  if (selection.charStart && selection.charEnd && line === endLine) {
    return 'L' + line + 'C' + selection.charStart + '-L' + line + 'C' + selection.charEnd;
  }
  return endLine === line ? 'L' + line : 'L' + line + '-L' + endLine;
}

/**
 * Show the composer for a selection — **without taking focus**.
 *
 * Focus is the whole problem on a touch screen: focusing the textarea raises the
 * keyboard, and raising the keyboard ends the document's selection, so the
 * native grabbers vanish the instant you start dragging one. The reader can then
 * never extend the selection they were making. So the bar appears, follows the
 * selection while it is still being adjusted, and only takes focus when the
 * reader taps it — which is the gesture that means "I am done selecting, now I am
 * typing".
 *
 * A selection that arrives while the bar is already open only updates what the
 * bar is about: the words already typed stay, because the reader may be nudging a
 * handle mid-sentence.
 */
/**
 * Focus a field without letting the browser scroll the page to reach it.
 *
 * **This is an iOS Safari problem, and `preventScroll` does not solve it.** On iOS, tapping an
 * input always scrolls the page so the input is centred in the *visual* viewport — and that
 * movement can carry even fixed-position elements off screen. `preventScroll` addresses the
 * normal scroll-into-view path, which is not the one iOS uses here.
 *
 * The composer sits at the foot of the document pane, and that pane is what holds the framed
 * document — so the scroll went to the pane, which moved the picture under the reader. It also
 * *stayed* moved when the keyboard was dismissed, because the pane keeps its new position.
 *
 * The technique is the one Adobe's `usePreventScroll` documents: move the field far above the
 * top of the page *before* focusing, so Safari has nothing to scroll to; focus it; then take the
 * transform off two frames later, once the decision has been made. Their comment on the cause is
 * the clearest statement of it: "When tapping on an input, the page always scrolls so that the
 * input is centered in the visual viewport. This may cause even fixed position elements to
 * scroll off the screen."
 *
 * The field is left visible — the transform is removed after focus, so nothing flickers. Only
 * the browser's *decision* is made while it is off screen.
 */
function focusWithoutScrolling(field) {
  const was = field.style.transform;
  field.style.transform = 'translateY(-2000px)';
  try {
    // `preventScroll` as well, for the browsers that honour it: it costs nothing and spares
    // the transform entirely on Chrome and Firefox.
    field.focus({ preventScroll: true });
  } finally {
    // Two frames: iOS needs the focus to have settled before the element comes back, or it
    // reconsiders and scrolls anyway.
    requestAnimationFrame(() =>
      requestAnimationFrame(() => {
        field.style.transform = was;
      }),
    );
  }
}

function showCommentBar(selection) {
  const opening = commentBar.hidden || !pendingSelection;
  pendingSelection = selection;
  closeThread();
  const where = commentAddress(selection);
  // A rectangle is written bare rather than after a `#`: `shot.png#x120,y64 320×180`
  // reads like a line address and is not one. Everything else keeps the hash, because
  // a line address is what a reader already knows.
  // A file-level comment has no position at all, so the address is just the file and
  // says so in words — `notes.md — the whole file` — rather than a trailing separator
  // over nothing.
  const wholeFile =
    selection.region === undefined && selection.line === undefined && !selection.quote;
  const separator = wholeFile
    ? ' — '
    : selection.region
      ? ' '
      : selection.line === undefined
        ? ' — '
        : '#';
  commentAddr.textContent = wholeFile
    ? (selection.file || '') + ' — the whole file'
    : (selection.file || '') + separator + where;
  commentQuote.hidden = !selection.quote;
  commentQuote.textContent = selection.quote || '';
  // The selected part of the picture, shown here so the reader can see what is about to
  // be attached without having to remember what they dragged. It is the same URL the
  // comment will carry, so a wrong rectangle is visible *before* it is sent.
  const preview = regionPreviewUrl(selection);
  commentPreview.hidden = preview === '';
  if (preview !== '') commentPreview.src = preview;
  if (opening) {
    commentText.value = '';
    commentError.hidden = true;
  }
  commentBar.hidden = false;
  // One action at a time in the same corner: the composer *is* the comment button
  // continued, so two of them would compete for the space and for the tap.
  setFabVisible(false);
  // Focus follows intent: only the comment button opens this, and pressing it means "I want to
  // write", so the keyboard opening is what was asked for. Throttled through
  // `focusWithoutScrolling`, which is what keeps iOS from scrolling the document away.
  if (selection.intent === 'comment') {
    focusWithoutScrolling(commentText);
  }
}

/**
 * Show the touch affordance for a selection.
 *
 * The document reports the selection and draws nothing, because on a phone the space
 * around selected text belongs to the system menu and its handles. This bar is where
 * the action goes instead: at the *top* of the drawer, out of reach of anything the
 * platform draws. The foot was where it started and the wrong end — a selection's drag
 * handles hang below the last selected line, which in a document top-to-bottom is the
 * bottom of the screen, so the one action a selection offers lived where the system's
 * own chrome reliably goes.
 *
 * It only offers to *start* a comment. Once the composer is open the bar gets out of
 * the way — two boxes competing for the same strip would be worse than either alone.
 */
/**
 * The comment button: the one way to start a comment, on every artifact.
 *
 * It replaced a bar that *appeared* when text was selected, and the reasons are worth
 * keeping because they are not obvious from the code that replaced them:
 *
 *   - Appearing-on-selection makes the selection do two jobs. Selecting text to *read*
 *     it summoned a comment prompt, which is not what selecting means.
 *   - On a phone the only place such a bar could go was the strip the platform's own
 *     selection menu and drag handles occupy, so it was covered or had to move to a
 *     place unrelated to what had been selected.
 *   - A persistent button can be *pressed with nothing selected*, which is the only way
 *     to say "a comment about this file" — a position the viewer previously could not
 *     express at all.
 *
 * What it does depends on the kind of document:
 *
 *   - nothing selected, any file → a comment on the file itself.
 *   - text selected → a comment on that text, exactly as before.
 *   - a picture or a PDF page → the composer opens *and* the picture is armed, so a
 *     drag drawn after pressing is the rectangle the comment carries. Arming is what
 *     lets `touch-action` go back to the browser's: panning and pinching work until
 *     somebody says they are commenting, which is the whole reason the mode exists.
 */
const commentFab = document.getElementById('comment-fab');

/** Whether the picture in the drawer is armed to take a rectangle. */
let regionArmed = false;

/**
 * Whether the comment button is on offer at all.
 *
 * Only with a document open: there is nothing to comment on in the list. It is shown
 * for every kind of artifact, including ones the viewer shows as source — a comment on
 * a whole file needs no position and no viewer support.
 */
function setFabVisible(visible) {
  commentFab.hidden = !visible;
}

/** Reflect the armed state, and tell the document so it can take gestures or not. */
function setRegionArmed(armed) {
  regionArmed = armed;
  commentFab.setAttribute('aria-pressed', armed ? 'true' : 'false');
  commentFab.title = armed
    ? 'Drag across the document to select the part to comment on'
    : 'Add a comment';
  // The document owns its own `touch-action` and cursor, because it is a different
  // frame with its own stylesheet: this page cannot reach in to change them, and the
  // message is how the arming reaches the thing that has to act on it.
  const frame = currentFrame;
  if (frame && frame.contentWindow) {
    try {
      frame.contentWindow.postMessage({ t: 'pi-artifact-arm', armed }, '*');
    } catch {
      // A frame mid-navigation has no window to talk to yet; the arming is re-sent when
      // the composer opens, which is the next thing that needs it.
    }
  }
}

/**
 * Start a comment about whatever is currently selected — or about the file.
 *
 * `pendingSelection` is kept up to date by the document's own messages: a source view
 * reports lines, a rendered document reports text, a picture reports nothing (there is
 * no text selection in a picture — its selection is a rectangle, drawn *after* arming).
 */
function startComment() {
  const selection = pendingSelection;
  // A document that can take a rectangle arms itself, so the drag that follows is the
  // selection — *whether or not something was already selected*. On a picture there is no
  // text to select, so pressing the button is always the start of a drag, and a
  // whole-file comment on a picture is made by pressing and not dragging.
  //
  // Everything else composes immediately: its selection already exists as text.
  if (isRegionCapable(currentKey())) setRegionArmed(true);

  if (!selection) {
    // Nothing selected: a comment on the file. `file` is the only position it has, and
    // the host records it with no anchors — see `addComment`. A drag after this replaces
    // it with a rectangle, which is the more specific thing the reader then chose.
    showCommentBar({ file: currentKey(), intent: 'comment' });
    return;
  }
  showCommentBar({ ...selection, intent: 'comment' });
}

/** Whether this artifact is commented on by drawing a rectangle over it. */
function isRegionCapable(key) {
  const frame = framesByKey.get(key) || currentFrame;
  if (!frame) return false;
  // Set by the drawer when it made the frame: a picture or a rendered PDF page.
  return frame.dataset.image === '1' || frame.dataset.pdf === '1';
}

commentFab.onclick = () => {
  // Pressed while composing: put it down. A second press on an armed picture disarms it
  // and closes the composer, which is the one way out on a device with no Escape key.
  if (!commentBar.hidden) {
    setRegionArmed(false);
    closeCommentBar();
    return;
  }
  startComment();
};

function closeCommentBar() {
  // Disarming is part of closing: the composer is what the arming was for, so a picture
  // left armed with no composer would keep eating gestures for a comment nobody is
  // writing.
  setRegionArmed(false);
  pendingSelection = null;
  commentBar.hidden = true;
  commentText.value = '';
  // The preview is the picture's crop, not the picture: leaving its src set keeps the
  // bytes alive in memory and shows a stale rectangle the next time the bar opens.
  commentPreview.hidden = true;
  commentPreview.removeAttribute('src');
  // Back on offer, if a document is open. Nothing is being written any more, so the
  // action that starts writing belongs here again.
  setFabVisible(Boolean(currentKey()));
}

function closeThread() {
  openCommentId = null;
  commentSheet.hidden = true;
  commentThread.innerHTML = '';
  commentReply.value = '';
  commentSheetPreview.hidden = true;
  commentSheetPreview.removeAttribute('src');
}

/** Post one comment, then redraw the frame so the new highlight appears. */
async function sendComment() {
  if (!pendingSelection) return;
  const text = commentText.value.trim();
  if (!text) {
    commentError.hidden = false;
    commentError.textContent = 'A comment needs words.';
    return;
  }
  const selection = pendingSelection;
  commentError.hidden = true;
  try {
    const response = await apiFetch(rel('api/c/' + current + '/comments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file: selection.file,
        ...(selection.region === undefined ? {} : { region: selection.region }),
        ...(selection.line === undefined ? {} : { line: selection.line }),
        ...(selection.endLine === undefined ? {} : { endLine: selection.endLine }),
        ...(selection.charStart === undefined ? {} : { charStart: selection.charStart }),
        ...(selection.charEnd === undefined ? {} : { charEnd: selection.charEnd }),
        ...(selection.quote === undefined ? {} : { quote: selection.quote }),
        ...(selection.occurrence === undefined ? {} : { occurrence: selection.occurrence }),
        text,
      }),
    });
    const result = await response.json().catch(() => ({ ok: false, error: 'unreadable response' }));
    if (!response.ok || result.ok === false) {
      commentError.hidden = false;
      // The host's refusal is the useful message ("artifacts are not version
      // controlled in this deployment"), so it is shown verbatim.
      commentError.textContent = result.error || 'comment failed';
      return;
    }
    closeCommentBar();
    await loadComments();
    reloadFrame();
  } catch (error) {
    commentError.hidden = false;
    commentError.textContent = String(error && error.message ? error.message : error);
  }
}

/** Re-fetch a document so its highlights match the comments that exist now. */
function reloadFrame() {
  // The one place a *visible* frame is reloaded, and it is deliberate: the document's
  // highlights must match the comments that exist now, and the only way to re-run the
  // document's own script is to load it again. It is not on a gesture path, so the
  // blink it costs is the comment being acknowledged.
  const src = currentFrame ? currentFrame.getAttribute('src') : '';
  if (src && src !== 'about:blank') loadFrameIn(currentFrame, src);
}

async function loadComments() {
  if (!current) return;
  try {
    const rows = await (await apiFetch(rel('api/c/' + current + '/comments'))).json();
    commentsById = new Map((Array.isArray(rows) ? rows : []).map((row) => [row.id, row]));
  } catch {
    commentsById = new Map();
  }
}

/** One told exchange in a thread: who said it, and what they said. */
function threadTurn(who, said, kind) {
  const wrap = document.createElement('div');
  wrap.className = 'comment-turn' + (kind ? ' ' + kind : '');
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who;
  const body = document.createElement('p');
  body.className = 'said';
  body.textContent = said;   // textContent, not innerHTML: this is untrusted text
  wrap.append(label, body);
  return wrap;
}

/** Open one comment's thread, loading its answers from the conversation. */
async function openThread(id) {
  const comment = commentsById.get(id);
  if (!comment) return;
  closeCommentBar();
  openCommentId = id;
  commentSheetAddr.textContent = comment.address || id;
  commentSheetQuote.hidden = !comment.quote;
  commentSheetQuote.textContent = comment.quote || '';
  // A region comment has no quote: what it selected is a rectangle, and the crop is the
  // honest way to show it. Same URL as the composer previews, so the thread and the
  // comment show the same pixels — and a picture that has since been replaced is
  // visibly not the one the comment was written against.
  const selected = comment.region === undefined ? '' : regionPreviewUrl(comment);
  commentSheetPreview.hidden = selected === '';
  if (selected === '') commentSheetPreview.removeAttribute('src');
  else commentSheetPreview.src = selected;
  commentThread.innerHTML = '';
  commentThread.append(threadTurn(comment.author || 'you', comment.text, 'question'));
  if (comment.replies > 0) commentThread.append(threadTurn('agent', '…', 'answer-pending'));
  commentSheet.hidden = false;
  document.getElementById('comment-resolve').textContent = comment.resolved ? 'Reopen' : 'Resolve';
  try {
    const replies = await (await apiFetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(id) + '/thread'))).json();
    if (openCommentId !== id) return;
    for (const node of commentThread.querySelectorAll('.comment-turn.answer-pending')) node.remove();
    for (const reply of Array.isArray(replies) ? replies : []) {
      // A `note` is the agent replying inside the thread through its tool — kept
      // out of the conversation on purpose, so it is shown plainly and not as a
      // turn. An `answer` is what the turn said in Chat, already worded for it.
      commentThread.append(
        threadTurn(reply.kind === 'note' ? 'agent (thread)' : 'agent', reply.text || '(no answer yet)', reply.kind === 'note' ? 'note' : 'answer'),
      );
    }
  } catch {
    // A thread that cannot be read still shows what was asked.
  }
}

async function replyInThread() {
  if (!openCommentId) return;
  const text = commentReply.value.trim();
  if (!text) return;
  commentReply.value = '';
  try {
    const response = await apiFetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/reply'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!response.ok) return;
    await openThread(openCommentId);
  } catch {
    // The reply is lost; the thread is still there to try again.
  }
}

async function resolveComment() {
  if (!openCommentId) return;
  const comment = commentsById.get(openCommentId);
  const next = !(comment && comment.resolved);
  try {
    await apiFetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/resolve'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolved: next }),
    });
    await loadComments();
    closeThread();
    reloadFrame();
  } catch {
    // Leave the thread open: the button is the whole interaction.
  }
}

/**
 * Bring the review pane up to date without being asked.
 *
 * Three things can change it: a turn that wrote files, a turn that replied in a
 * thread, and a comment made on another device. The first two arrive here when a
 * turn settles (the stream already says so); the third is caught by the focus
 * handler below, because nothing in this page hears about it otherwise.
 *
 * What is *not* refreshed blindly is the framed document: a reload throws away
 * the selection the composer is about. So the frame is only reloaded when no
 * comment is being written, which is also the case where the reader is just
 * looking and a stale file would mislead them.
 */
async function refreshReview() {
  if (!artifactsOpen || !current) return;
  await loadComments();
  if (openCommentId) void openThread(openCommentId);
  await loadArtifacts(true);
  if (!pendingSelection) reloadFrame();
}

window.addEventListener('message', (event) => {
  // Identity, not origin: the frame is sandboxed without `allow-same-origin`, so
  // its origin is "null" and an origin check would have to accept everything.
  if (!currentFrame || !currentFrame.contentWindow || event.source !== currentFrame.contentWindow) return;
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  if (data.t === 'pi-artifact-select' && typeof data.file === 'string') {
    // A text selection, on any device. Remembered, never acted on: the comment button is
    // what starts a comment, and it takes whatever is selected when it is pressed. The
    // desktop build used to open the composer here directly, which is the behaviour that
    // made selecting text to read it feel like being interrupted.
    pendingSelection = data;
  } else if (data.t === 'pi-artifact-region') {
    // A rectangle dragged over a picture. Only the frame on screen counts: a parked
    // frame's document is not what the reader is pointing at.
    if (imageFrameFor(event.source)) commentOnRegion(data);
  } else if (data.t === 'pi-artifact-image') {
    // The picture finished loading, or was tapped. Either way the drawer knows it is
    // looking at a document that can take a rectangle, which is what decides whether
    // pressing the comment button arms it.
    if (imageFrameFor(event.source)) setFabVisible(true);
  } else if (data.t === 'pi-artifact-select-touch') {
    // A document reporting a selection from a touch device. It is remembered, not acted
    // on: the comment button is what starts the comment, and it takes whatever is
    // selected when it is pressed. Nothing appearing here is the point — selecting text
    // to read it must not summon anything.
    const picked = data.message && typeof data.message.file === 'string' ? data.message : null;
    if (picked) pendingSelection = picked;
  } else if (data.t === 'pi-artifact-page-locked') {
    // The document in the middle says whether a horizontal drag is its own. Set before the
    // drag messages that follow it, so the strip never starts moving for a gesture the
    // document is already consuming.
    pageLockedByDocument = data.locked === true;
  } else if (data.t === 'pi-artifact-drag') {
    // The finger is still down: move the pane with it.
    dragArtifactPane(typeof data.dx === 'number' ? data.dx : 0);
  } else if (data.t === 'pi-artifact-drag-end') {
    // It came up somewhere that is not a page turn. Let the pane go home.
    releaseArtifactPane();
  } else if (data.t === 'pi-artifact-swipe') {
    // A horizontal swipe across the document: `direction` is which way the finger
    // travelled, so "left" means the next artifact arrives from the right. The pane
    // is already part-way there from the drag, so the step continues from that
    // offset rather than starting the slide from rest.
    stepFromFrame(
      data.direction === 'left' ? 'next' : data.direction === 'right' ? 'previous' : '',
      data.commit === true,
    );
  } else if (data.t === 'pi-artifact-open' && typeof data.id === 'string') {
    void openThread(data.id);
  } else if (data.t === 'pi-artifact-clear') {
    // The selection is gone, so there is nothing for the comment button to attach to —
    // the comment is now about the file. Sent by the document whenever it has no
    // selection, on every device, so it is the one place a stale selection is forgotten.
    //
    // Deliberately *not* a reason to close the composer: the reader may have tapped
    // into the text field, which collapses the document's selection and means "I am
    // typing now". What was already chosen stays chosen — its address is in the bar.
    pendingSelection = null;
  }
});

// A comment made on a phone while this page sat idle is only visible when the
// tab is looked at again. Cheaper and more predictable than a poll.
document.addEventListener('visibilitychange', () => {
  // Back to the tab: a stream that died while we were away is not going to notice by itself, and
  // waiting for a backoff that may already have elapsed is how "inactive then returning" looks
  // broken. Only reconnect when nothing is open, so a healthy stream is left alone.
  if (document.visibilityState === 'visible' && current) {
    // Two different kinds of "not open". `readyState !== 1` is a stream the browser
    // has closed and will never reopen by itself. The second is subtler: a stream
    // that still claims to be OPEN but has been silent since before the tab was
    // hidden, which is what a slept laptop leaves behind. Both are worth replacing,
    // and the reconnect is free because the next frame is the whole current state.
    const stale = Date.now() - lastFrameAt > 40_000;
    if (!source || source.readyState !== 1 || stale) {
      // The replacement catches up on its own `open` — doing it here as well would read history
      // twice for one return to the tab.
      connectStream(current);
      return;
    }
    // The stream is open and healthy, and still says nothing about the transcript. A turn that
    // finished while the tab was hidden leaves it a page behind with an empty live block: the pane
    // looks current and is not. So coming back to the tab always re-reads history, whether or not
    // the stream needed replacing — and it is the same `catchUp` a reconnect uses, so there is one
    // definition of "caught up" rather than two that can drift.
    void catchUp(current, streamGeneration);
  }
  if (!document.hidden) void refreshReview();
});

// The bar is the only thing that may focus the field, and only when tapped:
// `pointerdown` on the chrome, never an automatic focus.
commentBar.addEventListener('pointerdown', (event) => {
  const target = event.target;
  if (!target || target === commentText || target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
  // Defer, so the tap does not land inside the newly focused field and move the
  // caret to wherever the finger was.
  setTimeout(() => focusWithoutScrolling(commentText), 0);
});

document.getElementById('comment-send').onclick = () => void sendComment();
document.getElementById('comment-cancel').onclick = () => closeCommentBar();
document.getElementById('comment-sheet-close').onclick = () => closeThread();

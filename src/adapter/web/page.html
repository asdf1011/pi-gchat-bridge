  if ((!text && pendingImages.length === 0) || !current) return;
  const sending = pendingImages;
  pendingImages = [];
  renderAttachments();
  box.value = '';
  // Clearing the box programmatically fires no `input` event, and `saveDraft()`
  // is only wired to `input`. Without this explicit call the draft outlived the
  // send, and `open()` refilled the box with the message already sent the next
  // time the conversation was opened. Save after clearing rather than removing
  // the key directly, so the empty-box rule stays in one place.
  saveDraft();
  fitBox();
  // A line beginning with `/` is a command, not a message: it asks the application something rather
  // than telling the agent something. Images win, because dropping them silently is worse than
  // sending a message beginning with a slash.
  if (text.startsWith('/') && sending.length === 0) {
    await runCommandLine(text);
    return;
  }
  const response = await fetch(rel('api/c/' + current + '/message'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      images: sending.map((image) => ({ data: image.data, mimeType: image.mimeType })),
    }),
  });
  // Show it immediately, the way Chat echoes your message: waiting for the
  // transcript refetch at the end of the turn made it look lost.
  try {
    const result = await response.json();
    if (result && result.ok) {
      transcript.push({
        role: 'user',
        text: text,
        html: result.html,
        at: Date.now(),
        // The pasted image is shown from its data URL: it has no entry id until
        // the transcript comes back, and re-reading it from disk mid-send would
        // be slower than the copy already in hand.
        images: sending.map((image) => ({ mimeType: image.mimeType, dataUrl: image.dataUrl })),
      });
      paint();
    }
  } catch {
    // A failed submit is already visible as a missing message; the turn's own
    // error, if any, arrives on the stream.
  }
};

// --- Commands -----------------------------------------------------------------
//
// A line beginning with `/` is not a message. It goes to `api/c/<id>/commands` and comes back as one
// of four *shapes* — text, a list, a choice, a form — which this page renders and knows nothing
// further about. That is the trade the vocabulary makes: four renderers here instead of eleven
// commands, and a command added on the server appears in every surface at once.
//
// The answer is drawn in its own panel above the composer rather than in the transcript, for a dull
// and decisive reason: `paint()` rebuilds the log from `transcript` on every stream frame, so a
// message-shaped thing that is not a message would disappear at the next one.

const commandPanel = document.getElementById('command-panel');
const commandBody = document.getElementById('command-body');
const commandTitle = document.getElementById('command-title');
document.getElementById('command-close').onclick = () => {
  commandPanel.hidden = true;
  commandBody.innerHTML = '';
};

/** One text node, so a command's output can never be markup. */
function commandText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

/**
 * Ask the server what a command means, then draw the answer.
 *
 * `values` is a form's or a choice's answer, keyed by field id. The command text stays the same —
 * what was asked and what was chosen are different things, and the second one is untrusted.
 */
async function runCommandLine(text, values, preview) {
  if (!current) return;
  let shape;
  try {
    const response = await fetch(rel('api/c/' + current + '/commands'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, ...(values ? { values } : {}), ...(preview ? { preview: true } : {}) }),
    });
    shape = await response.json();
  } catch {
    shape = { kind: 'text', text: 'The command did not answer. Is the bridge still running?' };
  }
  if (!shape || typeof shape.kind !== 'string') shape = { kind: 'text', text: 'The command answered with nothing.' };
  renderCommand(shape);
}

function renderCommand(shape) {
  commandBody.innerHTML = '';
  commandPanel.hidden = false;
  if (shape.kind === 'text') {
    commandTitle.textContent = 'Command';
    commandBody.append(commandText('p', shape.text));
    // A command that made a conversation says where it is; going there is the point of `/new` and
    // `/resume`, and a link the reader has to find in a list would be worse than a redirect.
    if (typeof shape.goto === 'number') {
      window.location.href = mountRoot() + shape.goto + '/';
      return;
    }
    return;
  }
  if (shape.kind === 'list') {
    commandTitle.textContent = shape.title || 'Results';
    const rows = Array.isArray(shape.rows) ? shape.rows : [];
    if (rows.length === 0) {
      commandBody.append(commandText('p', shape.empty || 'Nothing.'));
      return;
    }
    const list = document.createElement('ul');
    for (const row of rows) {
      const item = document.createElement('li');
      const sends = typeof row.command === 'string' && row.command !== '';
      const navigates = !sends && Number.isInteger(row.conversationId);
      const button = document.createElement(sends || navigates ? 'button' : 'div');
      if (sends || navigates) button.type = 'button';
      button.className = 'row' + (sends || navigates ? ' clickable' : '') + (row.current ? ' current' : '');
      button.append(commandText('span', row.label));
      if (row.detail) button.append(commandText('span', row.detail, 'detail'));
      // A row about a conversation is a link, because this page can open any conversation. On a
      // surface that cannot — a Chat thread is bound to one conversation — the same row carries a
      // command instead, and this page never sees it.
      if (sends) button.onclick = () => void runCommandLine(row.command);
      else if (navigates) button.onclick = () => { window.location.href = mountRoot() + row.conversationId + '/'; };
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'choice') {
    commandTitle.textContent = shape.prompt || 'Choose';
    const list = document.createElement('ul');
    for (const option of Array.isArray(shape.options) ? shape.options : []) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'row clickable' + (option.selected ? ' current' : '');
      button.append(commandText('span', option.label));
      if (option.detail) button.append(commandText('span', option.detail, 'detail'));
      // Choosing is sending the command with this option as the answer, so a choice and a form
      // submit are the same wire shape and the server sees one mechanism, not two.
      button.onclick = () => void runCommandLine(shape.command, option.values ?? {});
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'form') {
    commandTitle.textContent = shape.prompt || 'Fill this in';
    const form = document.createElement('form');
    const fields = Array.isArray(shape.fields) ? shape.fields : [];
    const controls = new Map();
    for (const field of fields) {
      const label = document.createElement('label');
      label.append(commandText('span', field.label));
      let control;
      if (field.kind === 'select') {
        control = document.createElement('select');
        for (const option of Array.isArray(field.options) ? field.options : []) {
          const choice = document.createElement('option');
          choice.value = option.id;
          choice.textContent = option.detail && option.detail !== option.label
            ? option.label + ' — ' + option.detail
            : option.label;
          if (option.selected || option.id === field.value) choice.selected = true;
          control.append(choice);
        }
      } else if (field.kind === 'secret') {
        // Masked, never prefilled, and never re-rendered from a previous answer: the value exists
        // between the keystroke and the POST and nowhere else on this page.
        control = document.createElement('input');
        control.type = 'password';
        control.autocomplete = 'new-password';
        control.value = '';
      } else {
        control = document.createElement('input');
        control.type = 'text';
        if (field.value) control.value = field.value;
      }
      control.id = 'field-' + field.id;
      if (field.hint) label.append(commandText('span', field.hint, 'hint'));
      label.append(control);
      controls.set(field.id, control);
      form.append(label);
      // A field whose value another field's options depend on — the model, whose levels the thinking
      // select lists. Changing it re-asks the command with a preview, so the command decides what the
      // change means instead of this page knowing.
      if (field.requery && field.kind === 'select') {
        control.onchange = () => {
          const values = {};
          for (const [id, each] of controls) values[id] = each.value;
          void runCommandLine(shape.command, values, true);
        };
      }
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = shape.submit || 'Apply';
    actions.append(submit);
    form.append(actions);
    form.onsubmit = (event) => {
      event.preventDefault();
      const values = {};
      for (const [id, control] of controls) values[id] = control.value;
      void runCommandLine(shape.command, values);
    };
    commandBody.append(form);
    return;
  }
  // An unknown shape is not a crash: a newer server talking to an older page says something, and the
  // page says what it can.
  commandTitle.textContent = 'Command';
  commandBody.append(commandText('p', 'This page does not know how to show that answer.'));
}

// --- Send, split: which model answers, and how hard it thinks --------------
//
// The caret on the Send button opens one menu holding both things that decide how
// the next message is answered: the model, and that model's thinking level. It is
// a *split button* rather than a pill standing beside Send because sending is the
// action and the format is a property of it — two equal buttons made a setting look
// like a verb. It exists at all because the only way to change the model used to be
// typing `/model` into the box, which needs both the command and the model's key;
// when the provider ran out of credit there was no visible way off that model.
//
// The menu is one popup containing two lists, model first: "what will answer" and
// "how hard it thinks about it" are one question asked in two parts. One popup also
// means there is never a second one to keep in sync.
//
// State comes with the conversation (`GET /api/c/<id>` returns `format`), so the
// menu opens already knowing what is in use, and the list of choices comes from
// `GET /api/models`, which carries each model's levels — so a level is never
// offered for a model that does not have it.
//
// Applying goes through `/model` like any other surface's would. The page does not
// decide what a valid combination is; the command does, and a refusal is shown in
// the command panel where this page has always put an answer.

const picker = document.getElementById('picker');
const pickerList = document.getElementById('picker-list');
const pickerLevels = document.getElementById('picker-levels');
const pickerNow = document.getElementById('picker-now');
const pickerModelHeading = document.getElementById('picker-model-heading');
const pickerThinkingHeading = document.getElementById('picker-thinking-heading');
const pickerSearch = document.getElementById('picker-search');
/** The row the search box sits in: hidden as a unit, so the border goes with it. */
const pickerSearchRow = pickerSearch.parentElement;
const pickerScrim = document.getElementById('picker-scrim');
const sendMenuButton = document.getElementById('send-menu');

/** The conversation's format, as last reported by the server. */
let formatState = null;
/** Whether the menu is open. One menu now, so this is a flag, not a name. */
let pickerOpen = false;
/** Every model, with its levels, fetched once and filtered locally. */
let modelChoices = null;

/** Take the format from a conversation payload, when it carries one. */
function adoptFormat(conversation) {
  const format = conversation && conversation.format;
  if (!format || typeof format.model !== 'string') {
    // An older payload, or a host that could not answer. The caret still opens (it
    // can still change the model), but it cannot claim to know the current one.
    formatState = null;
    return;
  }
  formatState = {
    model: format.model,
    thinking: typeof format.thinking === 'string' ? format.thinking : undefined,
    levels: Array.isArray(format.levels) ? format.levels : [],
  };
}

/** The model id from a key, for when the labels have not arrived yet. */
function shortModelName(key) {
  const slash = key.indexOf('/');
  return slash > 0 ? key.slice(slash + 1) : (key || 'Model');
}

/** The label for a key, once the list has arrived. */
function modelLabelOf(key) {
  const chosen = (modelChoices || []).find((model) => model.key === key);
  return chosen ? chosen.label : shortModelName(key);
}

/** Load the model list, once. Filtering then costs nothing. */
async function loadModels() {
  if (modelChoices) return modelChoices;
  try {
    const response = await fetch(rel('api/models'));
    const body = await response.json();
    modelChoices = Array.isArray(body && body.models) ? body.models : [];
  } catch {
    modelChoices = [];
  }
  return modelChoices;
}

/** Close the menu, restoring focus to the caret that opened it. */
function closePicker() {
  pickerOpen = false;
  picker.hidden = true;
  pickerScrim.hidden = true;
  pickerSearchRow.hidden = true;
  pickerList.innerHTML = '';
  pickerLevels.innerHTML = '';
  sendMenuButton.setAttribute('aria-expanded', 'false');
  // Focus goes back to the caret, so Escape is not a dead end for a keyboard.
  if (document.activeElement && picker.contains(document.activeElement)) sendMenuButton.focus();
}

/** Whether the layout is the phone sheet. */
function isNarrow() {
  // The same breakpoint the CSS uses, asked in JS so the popup can be positioned
  // only when it is one. Guarded because a missing `matchMedia` must not take the
  // menu down with it: an unpositioned list is still a usable one.
  try {
    return window.matchMedia('(max-width: 40rem)').matches;
  } catch {
    return window.innerWidth <= 640;
  }
}

/**
 * Put the menu next to the caret, or up from the bottom on a phone.
 *
 * The sheet is entirely CSS (see the media query): both are the same element, so
 * there is one list, one search box and one close path. This only computes the
 * desktop anchor, and only when the layout is a popup — a sheet pinned to the
 * viewport must not be given coordinates.
 */
function placePicker(searchable) {
  const sheet = isNarrow();
  // Search for finding a model in a long list, on a screen with no keyboard. On a
  // desktop the popup is small and scrollable, and a search field inside it is
  // mostly chrome. Same input either way, so there is one filter.
  pickerSearchRow.hidden = !(sheet && searchable);
  if (sheet) {
    picker.style.left = '';
    picker.style.top = '';
    picker.style.bottom = '';
    return;
  }
  const rect = sendMenuButton.getBoundingClientRect();
  const width = picker.offsetWidth || 320;
  // Above the button: the composer is at the bottom, so a list below it would be
  // off-screen. Right-aligned to the caret's trailing edge, so the popup grows
  // leftwards from the button that opened it rather than off the right edge.
  const left = Math.min(Math.max(12, rect.right - width), window.innerWidth - width - 12);
  picker.style.left = left + 'px';
  picker.style.top = '';
  picker.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
}

/** One row: a label, an optional subtitle, a tick when it is the current value. */
function pickerItem(label, detail, isCurrent, apply) {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'item' + (isCurrent ? ' current' : '');
  button.setAttribute('role', 'option');
  button.setAttribute('aria-selected', isCurrent ? 'true' : 'false');
  const name = document.createElement('span');
  name.className = 'name';
  const text = document.createElement('span');
  text.textContent = label;
  name.append(text);
  if (isCurrent) {
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    tick.setAttribute('aria-hidden', 'true');
    name.append(tick);
  }
  button.append(name);
  if (detail) {
    const sub = document.createElement('span');
    sub.className = 'detail';
    sub.textContent = detail;
    button.append(sub);
  }
  button.onclick = () => apply();
  item.append(button);
  return item;
}

/** Open the menu: the current format, then every model, then this model's levels. */
async function openPicker() {
  pickerOpen = true;
  sendMenuButton.setAttribute('aria-expanded', 'true');
  picker.hidden = false;
  pickerScrim.hidden = false;
  pickerSearch.value = '';
  renderPickerNow();
  placePicker(true);
  drawModels('');
  if (!pickerSearchRow.hidden) pickerSearch.focus();
  await loadModels();
  if (!pickerOpen) return; // closed while loading
  renderPickerNow();
  drawModels('');
  if (pickerSearchRow.hidden) drawLevels();
}

/** The menu's header: the format the next message will use, in words. */
function renderPickerNow() {
  if (!formatState) {
    pickerNow.textContent = 'Choose the model and thinking level for this conversation.';
    return;
  }
  pickerNow.innerHTML = '';
  const model = document.createElement('b');
  model.textContent = modelLabelOf(formatState.model);
  pickerNow.append('Next message: ', model);
  if (formatState.thinking) pickerNow.append(' · thinking ');
  if (formatState.thinking) {
    const level = document.createElement('b');
    level.textContent = formatState.thinking;
    pickerNow.append(level);
  }
}

function drawModels(query) {
  if (!pickerOpen) return;
  pickerList.innerHTML = '';
  const needle = (query || '').trim().toLowerCase();
  const matching = (modelChoices || []).filter((model) => {
    if (!needle) return true;
    // Label and key both: searching "flash" means the name, "deepseek" means the
    // provider in the key.
    return (model.label || '').toLowerCase().includes(needle)
      || (model.key || '').toLowerCase().includes(needle);
  });
  if (modelChoices && modelChoices.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'No models are configured.';
    pickerList.append(empty);
  } else if (matching.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'No model matches “' + query + '”.';
    pickerList.append(empty);
  } else {
    for (const model of matching) {
      pickerList.append(pickerItem(
        model.label || shortModelName(model.key),
        // No key under the name. `deepseek/deepseek-flash` is the wire format, not
        // something a person reads, and the label already says which model it is:
        // "DeepSeek V4.1 Flash". The key is still what gets applied — it just does
        // not need to be on screen to be understood.
        '',
        formatState !== null && model.key === formatState.model,
        () => void applyFormat(model.key, formatState && formatState.thinking, model.levels),
      ));
    }
  }
  drawLevels();
}

/**
 * The thinking levels of the model in use.
 *
 * Hidden entirely when the model has none (a small local model does not think at a
 * level), rather than shown empty: an empty section reads as a broken page, while
 * its absence reads as "not applicable".
 */
function drawLevels() {
  if (!pickerOpen || !formatState) {
    pickerThinkingHeading.hidden = true;
    pickerLevels.hidden = true;
    return;
  }
  const levels = formatState.levels;
  const show = levels.length > 0 && (modelChoices === null || !pickerSearch.value.trim());
  pickerThinkingHeading.hidden = !show;
  pickerLevels.hidden = !show;
  pickerLevels.innerHTML = '';
  if (!show) return;
  for (const level of levels) {
    pickerLevels.append(pickerItem(
      level,
      '',
      level === formatState.thinking,
      () => void applyFormat(formatState.model, level, levels),
    ));
  }
}

/**
 * Apply a choice, then re-read the format.
 *
 * The whole format is sent, not just the field that changed: `/model` takes a model
 * and a level together, and sending one alone would leave the other to a guess.
 * A level the new model does not have is replaced by one it does, chosen here, so
 * switching to a small local model does not mean switching twice.
 */
async function applyFormat(modelKey, thinking, levels) {
  closePicker();
  // Keep the level by default — switching between reasoning models should not
  // silently reset how hard they think — but only when the new model has it. A
  // model with no levels takes none: sending a level to a model that does not think
  // is a refusal, not a preference.
  const wanted = thinking !== undefined && levels.includes(thinking) ? thinking : levels[0];
  try {
    const response = await fetch(rel('api/c/' + current + '/commands'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: '/model',
        values: { model: modelKey, ...(wanted === undefined ? {} : { thinking: wanted }) },
      }),
    });
    const shape = await response.json();
    if (shape && shape.kind !== 'form') {
      // The command refused. Say so where this page has always put an answer.
      renderCommand(shape);
      return;
    }
    commandPanel.hidden = true;
    commandBody.innerHTML = '';
  } catch {
    renderCommand({ kind: 'text', text: 'The model change did not go through. Is the bridge still running?' });
    return;
  }
  await refreshFormat();
}

/**
 * Re-read the format from the server after a change.
 *
 * Re-reading rather than assuming the change landed: `/model` validates (a level
 * the model does not have is refused), and the caret showing the choice before it
 * was accepted would be lying for exactly as long as it took the server to disagree.
 */
async function refreshFormat() {
  try {
    adoptFormat(await (await fetch(rel('api/c/' + current))).json());
  } catch {
    // Keep what we have: it is still the last thing the server said.
  }
}

sendMenuButton.onclick = () => {
  if (pickerOpen) closePicker();
  else void openPicker();
};
pickerScrim.onclick = () => closePicker();
pickerSearch.addEventListener('input', () => drawModels(pickerSearch.value));
// Escape closes: the menu is a popup, and a popup that traps Escape is a dialog
// nobody asked for.
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape' || !pickerOpen) return;
  event.stopPropagation();
  closePicker();
});
// A resize can move the caret out from under a desktop popup, and turning a phone
// sideways crosses the sheet breakpoint. Closing is simpler than re-anchoring.
window.addEventListener('resize', () => {
  if (pickerOpen) closePicker();
});

// --- Artifacts: a drawer over the conversation, hidden until asked for. ---// --- Artifacts: a drawer over the conversation, hidden until asked for. ---
//
// The list comes from this origin (`api/c/<id>/artifacts`), so no CORS. The file
// itself is framed from the artifact host, which is a *different* origin: it is
// sandboxed there and cannot read this page's DOM, cookies or storage.

let artifactsBase = '';
let artifactsOpen = false;
/** Whether this page pushed the history entry the open document lives in. */
let artifactsEntryPushed = false;

const artifactsButton = document.getElementById('artifacts-toggle');
const artifactsPanel = document.getElementById('artifacts');
const artifactsList = document.getElementById('artifact-list');
const artifactsFrame = document.getElementById('artifact-frame');
const artifactsHint = document.getElementById('artifact-hint');
const artifactsNewTab = document.getElementById('artifacts-newtab');
const artifactsBack = document.getElementById('artifacts-back');
const artifactsTitle = document.getElementById('artifacts-title');

/**
 * Where the framed document is fetched from.
 *
 * The drawer always asks for the *source* view, which is the one with numbered
 * lines and the selection script — a rendered Markdown page has no lines to
 * anchor a comment to, and a bare `text/plain` response cannot carry a script at
 * all. `?view=source` is still inert HTML: every byte of the file is escaped into
 * it, and the only script is the one the artifact origin writes with a per-response
 * nonce.
 */
/**
 * Which view a file opens in.
 *
 * Markdown opens *rendered*, because that is what a person wants to read — and
 * the rendered document is commentable too: it reports the selected text and the
 * session host finds the source lines it came from, so neither side has to know
 * how the other numbered anything. Everything else opens as the source view,
 * where a line number is the obvious unit.
 */
function artifactUrl(key, markdown) {
  const path = key.split('/').map(encodeURIComponent).join('/');
  return artifactsBase + '/c/' + current + '/' + path + (markdown ? '?render' : '?view=source');
}

/** The last path segment: what the file is actually called. */
function baseName(key) {
  const parts = key.split('/');
  return parts[parts.length - 1] || key;
}

/** The directory part, which may be empty at the root. */
function dirName(key) {
  const parts = key.split('/');
  parts.pop();
  return parts.join('/');
}

/**
 * Frame loads we caused, and loads we have seen.
 *
 * A back gesture can be delivered to the *frame's* own transcript rather than the
 * page's, in which case no `popstate` fires here and the frame simply walks back
 * to `about:blank` — the drawer then showed a file's name over an empty page. A
 * load nobody asked for is that navigation, and the honest response is to treat it
 * as "back to the list", which is what the gesture meant.
 */
let frameLoadsCaused = 0;
let frameLoadsSeen = 0;

function loadFrame(url) {
  frameLoadsCaused += 1;
  artifactsFrame.src = url;
}

artifactsFrame.addEventListener('load', () => {
  frameLoadsSeen += 1;
  if (frameLoadsSeen <= frameLoadsCaused) return; // one of ours
  frameLoadsCaused = frameLoadsSeen;
  if (artifactsOpen && artifactsPanel.classList.contains('showing-doc')) applyListState();
});

/**
 * Show one document in the drawer.
 *
 * `push` is false when this is a *restore* — the page just loaded with the fragment already naming
 * this file, so the entry exists and pushing another would make one back gesture do nothing.
 */
function showArtifact(key, markdown, push = true) {
  for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === key);
  // The document slides over the list and takes the drawer's full width, so a
  // name-heavy list stops competing with the thing being read.
  artifactsPanel.classList.add('showing-doc');
  artifactsTitle.textContent = baseName(key);
  artifactsTitle.title = key;
  artifactsBack.hidden = false;
  artifactsNewTab.hidden = false;
  // A transcript entry per document, so the browser's own back gesture means what it
  // looks like it means: close the document, show the list.
  try {
    const state = { artifact: key };
    const address = '#' + encodeURIComponent(key);
    if (push) history.pushState(state, '', address);
    else history.replaceState(state, '', address);
  } catch {
    // A sandboxed or file: context can refuse either call; the drawer still works.
  }
  // Whether this page added the entry. After a reload it did not — the entry was restored from the
  // address — and one back gesture must not then leave the page entirely.
  artifactsEntryPushed = push;
  // Which document the frame holds, for the refresh that must not drop it.
  artifactsFrame.dataset.key = key;
  // Markdown is rendered by the artifact host inside its sandboxed document;
  // everything else is shown as plain text, never as HTML.
  loadFrame(artifactUrl(key, markdown));
  closeCommentBar();
  closeThread();
  artifactsNewTab.dataset.key = key;
  artifactsNewTab.dataset.markdown = markdown ? '1' : '';
}

/** The list state, without touching transcript. */
function applyListState() {
  artifactsPanel.classList.remove('showing-doc');
  artifactsTitle.textContent = 'Artifacts';
  artifactsTitle.removeAttribute('title');
  artifactsBack.hidden = true;
  artifactsNewTab.hidden = true;
  delete artifactsFrame.dataset.key;
  artifactsEntryPushed = false;
  if (artifactsFrame.getAttribute('src') !== 'about:blank') loadFrame('about:blank');
}

/**
 * Back to the list.
 *
 * Goes through transcript when we own an entry, so the drawer's ← and the browser's
 * back gesture end in the same place.
 */
function showArtifactList() {
  // A back gesture only means "close the document" when this page made the entry it would undo.
  // Otherwise — a reload, a pasted link — going back would leave the conversation.
  if (artifactsEntryPushed && history.state && history.state.artifact) {
    history.back();
    return;
  }
  applyListState();
  try {
    history.replaceState({}, '', location.pathname);
  } catch {
    // Refused in a sandboxed context; the drawer is already showing the list.
  }
}

// A back gesture after opening a document lands here.
window.addEventListener('popstate', () => {
  if (artifactsOpen) applyListState();
});

// The fragment is the address of a document, so a change to it is a request to show that document —
// whether it came from a pasted link, an edited address, or forward/back between two files.
window.addEventListener('hashchange', () => {
  const key = artifactKeyFromHash();
  if (!key) {
    if (artifactsOpen && artifactsPanel.classList.contains('showing-doc')) applyListState();
    return;
  }
  if (!artifactsOpen || artifactsFrame.dataset.key !== key) void restoreArtifact(key);
});

/**
 * The artifact the URL fragment names.
 *
 * The fragment is the artifact key — that is what opening a document writes there — so a reload or a
 * pasted link can put the reader back on the file they were reading. Keys contain slashes, so the
 * encode/decode pair is not decoration: `#conversation/1/notes.md` and `#conversation%2F1%2Fnotes.md`
 * are the same file, and only the encoded one survives being copied out of an address bar intact.
 */
function artifactKeyFromHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return '';
  try {
    return decodeURIComponent(raw);
  } catch {
    return raw; // not percent-encoded, but still names something
  }
}

/**
 * Open the document the URL names.
 *
 * Waits for the environment (the artifact host's address is fetched) and for the list, because a
 * document opens *from* the list: its row is what says whether it renders. A key that is no longer
 * one of this conversation's files leaves the list showing and drops the fragment, so the address bar
 * never claims something the page is not showing.
 */
async function restoreArtifact(key) {
  if (!key) return;
  await artifactsReady;
  if (artifactsBase === '' || !current) return;
  await setArtifactsOpen(true);
  const row = [...artifactsList.children].find((li) => li.dataset.key === key);
  if (!row) {
    try {
      history.replaceState({}, '', location.pathname);
    } catch {
      // Same as everywhere else: a refusal costs the address, not the drawer.
    }
    return;
  }
  showArtifact(key, row.dataset.markdown === '1', false);
}

/**
 * Rebuild the list.
 *
 * `preserve` is for a refresh the reader did not ask for: it keeps the document
 * they are reading open and restores the highlight, instead of dropping them back
 * to the list every time a turn ends.
 */
async function loadArtifacts(preserve) {
  const framed = preserve ? artifactsFrame.dataset.key || '' : '';
  artifactsList.innerHTML = '';
  if (!current) return;
  let rows;
  try {
    rows = await (await fetch(rel('api/c/' + current + '/artifacts'))).json();
  } catch {
    rows = [];
  }
  if (!Array.isArray(rows) || rows.length === 0) {
    artifactsHint.hidden = false;
    artifactsHint.textContent = 'No files were written or edited in this conversation.';
    return;
  }
  artifactsHint.hidden = rows.length > 0;
  for (const row of rows) {
    const li = document.createElement('li');
    li.dataset.key = row.key;
    li.dataset.markdown = row.markdown ? '1' : '';
    li.innerHTML = '<span class="col"><span class="name"></span><span class="dir"></span></span><span class="counts"></span>';
    // The name first and the directory underneath: a list of full paths is mostly
    // directory, and the drawer only needs enough to tell two files apart.
    li.querySelector('.name').textContent = baseName(row.key);
    li.querySelector('.dir').textContent = dirName(row.key);
    const counts = [];
    if (row.wrote) counts.push(row.wrote + (row.wrote === 1 ? ' write' : ' writes'));
    if (row.edited) counts.push(row.edited + (row.edited === 1 ? ' edit' : ' edits'));
    li.querySelector('.counts').textContent = counts.join(', ');
    li.title = row.key;
    li.onclick = () => showArtifact(row.key, Boolean(row.markdown));
    artifactsList.append(li);
  }
  if (preserve && framed !== '') {
    // Same document, same place: only the rows are new.
    for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === framed);
    return;
  }
  // Open on the list: choosing is the first act, and the document takes the screen
  // once chosen.
  showArtifactList();
}

async function setArtifactsOpen(open) {
  artifactsOpen = open;
  artifactsPanel.hidden = !open;
  if (open) {
    void loadComments();
    await loadArtifacts();
  } else {
    applyListState();
    if (history.state && history.state.artifact) history.replaceState({}, '', location.pathname);
  }
}

// --- Review comments ---------------------------------------------------------
//
// The framed document cannot submit anything, by design: it is a different origin,
// sandboxed, and its own bytes are agent-written. So it *reports* — a selection, a
// click on a highlight — and this page, which owns the session and the API, turns
// that into a message. Nothing crosses except numbers and text, and the frame is
// identified by `event.source`, not by an origin string (a sandboxed frame's
// origin is the string "null", which no check can distinguish).

const commentBar = document.getElementById('comment-bar');
const commentAddr = document.getElementById('comment-addr');
const commentQuote = document.getElementById('comment-quote');
const commentText = document.getElementById('comment-text');
const commentError = document.getElementById('comment-error');
const commentSheet = document.getElementById('comment-sheet');
const commentSheetAddr = document.getElementById('comment-sheet-addr');
const commentSheetQuote = document.getElementById('comment-sheet-quote');
const commentThread = document.getElementById('comment-thread');
const commentReply = document.getElementById('comment-reply');

/** The selection the comment bar is currently about. */
let pendingSelection = null;
/** The comment whose thread is open. */
let openCommentId = null;
/** Every comment this conversation has, keyed by id, from the last load. */
let commentsById = new Map();

/**
 * What to show above the composer.
 *
 * A source view reports lines, so the address is the real one. A rendered view
 * reports text, and the address is only decided once the host has found it — so
 * the bar shows the quotation instead of inventing a line number.
 */
function commentAddress(selection) {
  const line = selection.line;
  if (line === undefined) {
    const quote = (selection.quote || '').replace(/\s+/g, ' ').trim();
    return quote.length > 60 ? quote.slice(0, 60) + '…' : quote;
  }
  const endLine = selection.endLine || line;
  if (selection.charStart && selection.charEnd && line === endLine) {
    return 'L' + line + 'C' + selection.charStart + '-L' + line + 'C' + selection.charEnd;
  }
  return endLine === line ? 'L' + line : 'L' + line + '-L' + endLine;
}

/**
 * Show the composer for a selection — **without taking focus**.
 *
 * Focus is the whole problem on a touch screen: focusing the textarea raises the
 * keyboard, and raising the keyboard ends the document's selection, so the
 * native grabbers vanish the instant you start dragging one. The reader can then
 * never extend the selection they were making. So the bar appears, follows the
 * selection while it is still being adjusted, and only takes focus when the
 * reader taps it — which is the gesture that means "I am done selecting, now I am
 * typing".
 *
 * A selection that arrives while the bar is already open only updates what the
 * bar is about: the words already typed stay, because the reader may be nudging a
 * handle mid-sentence.
 */
function showCommentBar(selection) {
  const opening = commentBar.hidden || !pendingSelection;
  pendingSelection = selection;
  closeThread();
  const where = commentAddress(selection);
  commentAddr.textContent = (selection.file || '') + (selection.line === undefined ? ' — ' : '#') + where;
  commentQuote.hidden = !selection.quote;
  commentQuote.textContent = selection.quote || '';
  if (opening) {
    commentText.value = '';
    commentError.hidden = true;
  }
  commentBar.hidden = false;
  // Focus follows intent. The document only sends `intent: "comment"` when somebody clicked the
  // affordance beside their selection — an explicit "I want to write something" — and focusing then
  // is right: it opens the keyboard, which is what they asked for. Selection alone never focuses,
  // because that raises the keyboard mid-read and collapses the very selection being commented on.
  if (selection.intent === 'comment') {
    commentText.focus();
  }
}

function closeCommentBar() {
  pendingSelection = null;
  commentBar.hidden = true;
  commentText.value = '';
}

function closeThread() {
  openCommentId = null;
  commentSheet.hidden = true;
  commentThread.innerHTML = '';
  commentReply.value = '';
}

/** Post one comment, then redraw the frame so the new highlight appears. */
async function sendComment() {
  if (!pendingSelection) return;
  const text = commentText.value.trim();
  if (!text) {
    commentError.hidden = false;
    commentError.textContent = 'A comment needs words.';
    return;
  }
  const selection = pendingSelection;
  commentError.hidden = true;
  try {
    const response = await fetch(rel('api/c/' + current + '/comments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file: selection.file,
        ...(selection.line === undefined ? {} : { line: selection.line }),
        ...(selection.endLine === undefined ? {} : { endLine: selection.endLine }),
        ...(selection.charStart === undefined ? {} : { charStart: selection.charStart }),
        ...(selection.charEnd === undefined ? {} : { charEnd: selection.charEnd }),
        ...(selection.quote === undefined ? {} : { quote: selection.quote }),
        ...(selection.occurrence === undefined ? {} : { occurrence: selection.occurrence }),
        text,
      }),
    });
    const result = await response.json().catch(() => ({ ok: false, error: 'unreadable response' }));
    if (!response.ok || result.ok === false) {
      commentError.hidden = false;
      // The host's refusal is the useful message ("artifacts are not version
      // controlled in this deployment"), so it is shown verbatim.
      commentError.textContent = result.error || 'comment failed';
      return;
    }
    closeCommentBar();
    await loadComments();
    reloadFrame();
  } catch (error) {
    commentError.hidden = false;
    commentError.textContent = String(error && error.message ? error.message : error);
  }
}

/** Re-fetch a document so its highlights match the comments that exist now. */
function reloadFrame() {
  const src = artifactsFrame.getAttribute('src');
  if (src && src !== 'about:blank') loadFrame(src);
}

async function loadComments() {
  if (!current) return;
  try {
    const rows = await (await fetch(rel('api/c/' + current + '/comments'))).json();
    commentsById = new Map((Array.isArray(rows) ? rows : []).map((row) => [row.id, row]));
  } catch {
    commentsById = new Map();
  }
}

/** One told exchange in a thread: who said it, and what they said. */
function threadTurn(who, said, kind) {
  const wrap = document.createElement('div');
  wrap.className = 'comment-turn' + (kind ? ' ' + kind : '');
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who;
  const body = document.createElement('p');
  body.className = 'said';
  body.textContent = said;   // textContent, not innerHTML: this is untrusted text
  wrap.append(label, body);
  return wrap;
}

/** Open one comment's thread, loading its answers from the conversation. */
async function openThread(id) {
  const comment = commentsById.get(id);
  if (!comment) return;
  closeCommentBar();
  openCommentId = id;
  commentSheetAddr.textContent = comment.address || id;
  commentSheetQuote.hidden = !comment.quote;
  commentSheetQuote.textContent = comment.quote || '';
  commentThread.innerHTML = '';
  commentThread.append(threadTurn(comment.author || 'you', comment.text, 'question'));
  if (comment.replies > 0) commentThread.append(threadTurn('agent', '…', 'answer-pending'));
  commentSheet.hidden = false;
  document.getElementById('comment-resolve').textContent = comment.resolved ? 'Reopen' : 'Resolve';
  try {
    const replies = await (await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(id) + '/thread'))).json();
    if (openCommentId !== id) return;
    for (const node of commentThread.querySelectorAll('.comment-turn.answer-pending')) node.remove();
    for (const reply of Array.isArray(replies) ? replies : []) {
      // A `note` is the agent replying inside the thread through its tool — kept
      // out of the conversation on purpose, so it is shown plainly and not as a
      // turn. An `answer` is what the turn said in Chat, already worded for it.
      commentThread.append(
        threadTurn(reply.kind === 'note' ? 'agent (thread)' : 'agent', reply.text || '(no answer yet)', reply.kind === 'note' ? 'note' : 'answer'),
      );
    }
  } catch {
    // A thread that cannot be read still shows what was asked.
  }
}

async function replyInThread() {
  if (!openCommentId) return;
  const text = commentReply.value.trim();
  if (!text) return;
  commentReply.value = '';
  try {
    const response = await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/reply'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!response.ok) return;
    await openThread(openCommentId);
  } catch {
    // The reply is lost; the thread is still there to try again.
  }
}

async function resolveComment() {
  if (!openCommentId) return;
  const comment = commentsById.get(openCommentId);
  const next = !(comment && comment.resolved);
  try {
    await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/resolve'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolved: next }),
    });
    await loadComments();
    closeThread();
    reloadFrame();
  } catch {
    // Leave the thread open: the button is the whole interaction.
  }
}

/**
 * Bring the review pane up to date without being asked.
 *
 * Three things can change it: a turn that wrote files, a turn that replied in a
 * thread, and a comment made on another device. The first two arrive here when a
 * turn settles (the stream already says so); the third is caught by the focus
 * handler below, because nothing in this page hears about it otherwise.
 *
 * What is *not* refreshed blindly is the framed document: a reload throws away
 * the selection the composer is about. So the frame is only reloaded when no
 * comment is being written, which is also the case where the reader is just
 * looking and a stale file would mislead them.
 */
async function refreshReview() {
  if (!artifactsOpen || !current) return;
  await loadComments();
  if (openCommentId) void openThread(openCommentId);
  await loadArtifacts(true);
  if (!pendingSelection) reloadFrame();
}

window.addEventListener('message', (event) => {
  // Identity, not origin: the frame is sandboxed without `allow-same-origin`, so
  // its origin is "null" and an origin check would have to accept everything.
  if (!artifactsFrame.contentWindow || event.source !== artifactsFrame.contentWindow) return;
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  if (data.t === 'pi-artifact-select' && typeof data.file === 'string') {
    showCommentBar(data);
  } else if (data.t === 'pi-artifact-open' && typeof data.id === 'string') {
    void openThread(data.id);
  } else if (data.t === 'pi-artifact-clear') {
    // The reader dismissed the selection. Close the composer, but never over a
    // draft, and never while the field has focus — tapping the field itself can
    // collapse the document's selection on some browsers, and that tap means
    // "I am typing now", not "forget this".
    if (commentBar.hidden) return;
    if (document.activeElement === commentText) return;
    if (commentText.value.trim() !== '') return;
    closeCommentBar();
  }
});

// A comment made on a phone while this page sat idle is only visible when the
// tab is looked at again. Cheaper and more predictable than a poll.
document.addEventListener('visibilitychange', () => {
  // Back to the tab: a stream that died while we were away is not going to notice by itself, and
  // waiting for a backoff that may already have elapsed is how "inactive then returning" looks
  // broken. Only reconnect when nothing is open, so a healthy stream is left alone.
  if (document.visibilityState === 'visible' && current) {
    // Two different kinds of "not open". `readyState !== 1` is a stream the browser
    // has closed and will never reopen by itself. The second is subtler: a stream
    // that still claims to be OPEN but has been silent since before the tab was
    // hidden, which is what a slept laptop leaves behind. Both are worth replacing,
    // and the reconnect is free because the next frame is the whole current state.
    const stale = Date.now() - lastFrameAt > 40_000;
    if (!source || source.readyState !== 1 || stale) connectStream(current);
  }
  if (!document.hidden) void refreshReview();
});

// The bar is the only thing that may focus the field, and only when tapped:
// `pointerdown` on the chrome, never an automatic focus.
commentBar.addEventListener('pointerdown', (event) => {
  const target = event.target;
  if (!target || target === commentText || target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
  // Defer, so the tap does not land inside the newly focused field and move the
  // caret to wherever the finger was.
  setTimeout(() => commentText.focus(), 0);
});

document.getElementById('comment-send').onclick = () => void sendComment();
document.getElementById('comment-cancel').onclick = () => closeCommentBar();
document.getElementById('comment-sheet-close').onclick = () => closeThread();
document.getElementById('comment-reply-send').onclick = () => void replyInThread();
document.getElementById('comment-resolve').onclick = () => void resolveComment();

/* How wide the drawer is: a choice, remembered, in pixels. `min(38rem, 45%)` is
   the starting point until you drag it — a percentage so a narrow window gets a
   proportional slice rather than a panel wider than the conversation. */
const ARTIFACTS_WIDTH_KEY = 'pi-artifacts-width';
const ARTIFACTS_MIN_W = 16 * 16;
const CONVERSATION_MIN_W = 15 * 16;
const artifactsResize = document.getElementById('artifacts-resize');
const workspace = document.getElementById('workspace');

try {
  const saved = Number(localStorage.getItem(ARTIFACTS_WIDTH_KEY));
  if (saved > 0) artifactsPanel.style.width = saved + 'px';
} catch {
  // Private mode: the default width is fine.
}

artifactsResize.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  event.preventDefault();
  artifactsResize.setPointerCapture(event.pointerId);
  artifactsPanel.classList.add('resizing');
  document.body.classList.add('resizing');
  const startX = event.clientX;
  const startWidth = artifactsPanel.getBoundingClientRect().width;
  // Leave the conversation something to live in: on a small window a panel that
  // can eat the whole width is the overlay problem again, by hand.
  const widest = Math.max(ARTIFACTS_MIN_W, workspace.clientWidth - CONVERSATION_MIN_W);
  const move = (moveEvent) => {
    const width = Math.min(widest, Math.max(ARTIFACTS_MIN_W, startWidth - (moveEvent.clientX - startX)));
    artifactsPanel.style.width = width + 'px';
  };
  const end = () => {
    artifactsPanel.classList.remove('resizing');
    document.body.classList.remove('resizing');
    artifactsResize.removeEventListener('pointermove', move);
    artifactsResize.removeEventListener('pointerup', end);
    artifactsResize.removeEventListener('pointercancel', end);
    try {
      localStorage.setItem(ARTIFACTS_WIDTH_KEY, String(Math.round(artifactsPanel.getBoundingClientRect().width)));
    } catch {
      // The width is a convenience; not worth failing over.
    }
  };
  artifactsResize.addEventListener('pointermove', move);
  artifactsResize.addEventListener('pointerup', end);
  artifactsResize.addEventListener('pointercancel', end);
});

artifactsButton.onclick = () => setArtifactsOpen(!artifactsOpen);
document.getElementById('artifacts-close').onclick = () => setArtifactsOpen(false);
artifactsBack.onclick = () => showArtifactList();
artifactsNewTab.onclick = () => {
  const key = artifactsNewTab.dataset.key;
  if (key) window.open(artifactUrl(key, artifactsNewTab.dataset.markdown === '1'), '_blank', 'noopener');
};
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape' || !artifactsOpen) return;
  // Escape steps back one screen: document → list → closed.
  if (artifactsPanel.classList.contains('showing-doc')) showArtifactList();
  else setArtifactsOpen(false);
});

// The panel is pointless without an artifact host to point at, so it stays
// hidden unless the deployment says where that is.
const artifactsReady = (async () => {
  try {
    const environment = await (await fetch(rel('api/environment'))).json();
    artifactsBase = String(environment.artifactsBaseUrl || '').replace(/\/$/, '');
    artifactsButton.hidden = artifactsBase === '';
    pageVersion = String(environment.pageVersion || '');
  } catch {
    artifactsButton.hidden = true;
  }
})();

// --- The index: recent conversations, paged, plus a new chat. ---

const PAGE_SIZE = 30;
let indexOffset = 0;

async function loadIndex(offset) {
  indexOffset = Math.max(0, offset || 0);
  let page = { items: [], more: false };
  try {
    page = await (await fetch(rel('api/conversations?limit=' + PAGE_SIZE + '&offset=' + indexOffset))).json();
  } catch {
    page = { items: [], more: false };
  }
  const list = document.getElementById('index-list');
  list.innerHTML = '';
  if (!Array.isArray(page.items) || page.items.length === 0) {
    const li = document.createElement('li');
    li.textContent = indexOffset === 0 ? 'No conversations yet — start one with ＋.' : 'Nothing older.';
    li.style.cursor = 'default';
    list.append(li);
  }
  for (const row of page.items || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="who"></span><span class="when"></span>';
    li.firstChild.textContent = row.name || row.chatKey;
    const at = row.lastActivityAt || row.createdAt;
    li.lastChild.textContent = formatWhen(at, true);
    li.title = '#' + row.conversationId + ' · ' + row.model + (at ? ' · ' + formatWhen(at) : '');
    li.onclick = () => {
      location.href = mountRoot() + row.conversationId + '/';
    };
    list.append(li);
  }

  const pager = document.getElementById('index-pager');
  const count = (page.items || []).length;
  pager.hidden = !(indexOffset > 0 || page.more);
  document.getElementById('index-newer').disabled = indexOffset === 0;
  document.getElementById('index-older').disabled = !page.more;
  document.getElementById('index-range').textContent =
    count === 0 ? '' : `${indexOffset + 1}–${indexOffset + count}`;
}

document.getElementById('index-newer').onclick = () => void loadIndex(indexOffset - PAGE_SIZE);
document.getElementById('index-older').onclick = () => void loadIndex(indexOffset + PAGE_SIZE);

document.getElementById('new-chat').onclick = async () => {
  try {
    const response = await fetch(rel('api/conversations'), { method: 'POST' });
    const created = await response.json();
    if (created && created.conversationId) location.href = mountRoot() + created.conversationId + '/';
  } catch {
    // Nothing sensible to say in the index; the click simply did not work.
  }
};

// --- Boot ---

const openId = conversationIdFromPath();
if (openId === undefined) {
  // The index is a document: the window scrolls it, so the rows past the fold
  // are reachable with the scrollbar the browser draws for the page.
  document.body.classList.add('indexing');
  document.getElementById('index').hidden = false;
  document.getElementById('app').hidden = true;
  document.getElementById('new-chat').hidden = false;
  void loadIndex(0);
} else {
  document.getElementById('index').hidden = true;
  document.getElementById('app').hidden = false;
  // No floating ＋ on a conversation page: it sat exactly where Send is.
  document.getElementById('new-chat').hidden = true;
  document.getElementById('back').href = mountRoot();
  current = openId;
  void loadTitle();
  // Fetched alongside the title, not when the picker first opens: the pill should
  // say "DeepSeek V4.1 Flash" rather than "deepseek-flash" from the first frame,
  // and a list this size costs nothing to have ready.
  void loadModels();
  open(openId);
  // A reload lands here with the fragment still naming the file that was open.
  void restoreArtifact(artifactKeyFromHash());
}
</script>
</body>
</html>

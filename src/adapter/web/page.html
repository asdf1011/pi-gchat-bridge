</div>
<script>
/**
 * A URL relative to wherever this page was served from.
 *
 * The base tag handles the normal case, but it resolves against the full URL,
 * so at "/pi" (no trailing slash) a relative path becomes "/api/x" -- the
 * proxy's root, not the app's. Appending the slash first makes both "/pi" and
 * "/pi/" work.
 */
/**
 * Resolve an API path against this page's own directory.
 *
 * The page may be served at /web, /pi/web or /pi/web/, depending on the reverse
 * proxy, so no URL here is absolute. 'api/...' from a page at /pi/web resolves
 * to /pi/api/... which is wrong -- hence the explicit base of the directory the
 * page was served *from*, normalised to end in '/'.
 */
/**
 * The mount root: "/" here, "/pi/" behind a proxy that keeps its prefix.
 *
 * A conversation page lives at `/<id>/`, so the document's own directory is one
 * level too deep for API paths — `rel()` has to resolve against the mount, not
 * against where this document happens to sit.
 */
function mountRoot() {
  const path = location.pathname;
  const conversation = /^(.*?)(?:\d+)\/?$/.exec(path);
  if (conversation) return conversation[1];
  const web = /^(.*?)\/web\/?$/.exec(path);
  if (web) return web[1];
  return path.endsWith('/') ? path : path + '/';
}

function rel(path) {
  return mountRoot() + path;
}

/** The conversation id this page is showing, from the URL. */
function conversationIdFromPath() {
  const match = /(\d+)\/?$/.exec(location.pathname);
  return match ? Number(match[1]) : undefined;
}

// State for the single open conversation. Declared here because the functions
// below assign them: without these the first click threw
// "ReferenceError: source is not defined" and the pane stayed blank.
let current;
let source;
/** Pending reconnect for a stream the browser has given up on. */
let reconnectTimer;
const log = document.getElementById('log');
const tool = document.getElementById('tool');
const textBox = document.getElementById('text');

// The transcript so far, as the host bounded it, and the answer in flight.
// Both are painted into #log: transcript first, then the live text, so a reload
// mid-turn shows the conversation *and* the half-finished reply.
let transcript = [];
let liveText = '';
let liveHtml = '';
let busy = false;
let statusLine = '';
// The page version this document was rendered from; compared on every (re)connect.
let pageVersion = '';
// One reload per page life: if the version somehow keeps changing, reloading in a
// loop would be worse than a stale page.
let reloadedForVersion = false;

/**
 * Draft text, kept per conversation.
 *
 * Saved on every keystroke so a reload — ours, or the browser's, or the device's —
 * does not lose what you were typing. Cleared when the message is actually sent.
 */
function draftKey(id) {
  return 'pi-draft:' + id;
}

function saveDraft() {
  if (!current) return;
  const box = document.getElementById('text');
  const text = box.value;
  try {
    if (text.trim() === '') localStorage.removeItem(draftKey(current));
    else localStorage.setItem(draftKey(current), text);
  } catch {
    // Private mode or a full quota: drafts are a convenience, not a feature to
    // fail over.
  }
}

function restoreDraft(id) {
  const box = document.getElementById('text');
  if (!id) {
    box.value = '';
    return;
  }
  try {
    box.value = localStorage.getItem(draftKey(id)) || '';
  } catch {
    box.value = '';
  }
  fitBox();
}

/** Fallback when a frame arrives without rendered HTML (an older server). */
function escapeText(text) {
  const holder = document.createElement('div');
  holder.textContent = text;
  return holder.innerHTML;
}

/**
 * A time as a chat shows one: the clock for today, "yesterday 3:13pm" before
 * that, and a date once it is older than that. The full timestamp is in the
 * element's title, so nothing is lost by being brief.
 *
 * `short` drops the clock from the date forms, for the index: a phone row has
 * room for "Nov 2" or a title, not both. The time is still in the row's title.
 */
function formatWhen(ms, short) {
  const at = new Date(ms);
  if (Number.isNaN(at.getTime())) return '';
  const now = new Date();
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sameDay = at.toDateString() === now.toDateString();
  if (sameDay) return time;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (at.toDateString() === yesterday.toDateString()) return 'yesterday ' + time;
  const sameYear = at.getFullYear() === now.getFullYear();
  const date = at.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' });
  return short ? date : date + ' ' + time;
}

/** One chat row: a name for pi, just a time for you. */
function messageRow(role, html, at, live, images) {
  const me = role === 'user';
  const block = document.createElement('div');
  block.className = 'msg ' + (me ? 'me' : 'pi') + (live ? ' live' : '');

  const col = document.createElement('div');
  col.className = 'col';

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!me) {
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = 'pi';
    meta.append(name);
  }
  const when = document.createElement('time');
  when.className = 'at';
  when.textContent = at ? formatWhen(at) : '';
  if (at) when.title = new Date(at).toLocaleString();
  meta.append(when);

  const bubble = document.createElement('div');
  bubble.className = 'bubble body';
  // Server-rendered markdown: the renderer escapes source before emitting any
  // tag, so this HTML is ours and cannot carry a script.
  bubble.innerHTML = html;

  // Inline images the renderer allowed (`![alt](api/c/<id>/image/<e>/<i>)`).
  //
  // The server emits the source exactly as the Markdown gave it, relative — it
  // deliberately refuses anything absolute, because a root-absolute path would
  // escape the mount a proxied page lives under. That leaves the path relative
  // to whatever this document's directory is, which on a conversation page
  // (`/web/1/`) is one level too deep, so it has to be rebased onto the mount
  // here, exactly as `rel()` does for every other URL on the page. Done as a
  // rewrite rather than by relaxing the renderer: the source stays relative, so
  // the same markup is still safe to serve from any mount.
  if (html.includes('<img ')) {
    for (const img of bubble.querySelectorAll('img')) {
      const src = img.getAttribute('src');
      if (!src || src.startsWith('data:')) continue;
      img.src = rel(src);
    }
  }

  // Images someone sent: fetched from this origin by entry and index, so the
  // transcript payload stays text.
  if (images && images.length && current) {
    const strip = document.createElement('div');
    strip.className = 'images';
    images.forEach((image, index) => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = image.mimeType || 'image';
      img.src = image.dataUrl || rel('api/c/' + current + '/image/' + image.entryId + '/' + index);
      strip.append(img);
    });
    if (strip.childElementCount > 0) bubble.append(strip);
  }

  col.append(meta, bubble);
  block.append(col);
  return block;
}

/**
 * Whether the conversation is scrolled to its end.
 *
 * Only then should it follow new content: reading transcript further up must not be
 * yanked to the bottom because a frame arrived or the composer grew.
 */
let atBottom = true;
const BOTTOM_SLACK_PX = 24;
/** How close to the top counts as "about to scroll past the beginning". */
const EARLIER_SLACK_PX = 240;
/**
 * Whether the log has been painted since this conversation opened.
 *
 * Before the first paint there is no position to scroll *from*: `scrollTop` is 0
 * while `paint()` is still about to jump to the bottom, so a `scroll` event in that
 * window is the browser settling, not a person asking for older messages. Without
 * this the pane fetched a second page on every open.
 *
 * `painted` rather than "is the box short" is what makes this both testable and
 * correct: a conversation shorter than the pane genuinely is at its bottom, and
 * treats itself as complete anyway because its first page came back short.
 */
let painted = false;

log.addEventListener('scroll', () => {
  atBottom = log.scrollHeight - log.scrollTop - log.clientHeight <= BOTTOM_SLACK_PX;
  // Prefetch by a comfortable margin rather than waiting for the literal top: the
  // page then lands before it is needed, so scrolling up feels continuous instead
  // of stopping at a spinner every fifty messages.
  //
  // The only guard needed is `painted`: before the first paint `scrollTop` is 0
  // while `paint()` is still about to jump to the bottom, and that is the browser
  // settling rather than a person asking for older messages. `loadEarlier` already
  // refuses when the history is complete or a page is in flight, so "is it at the
  // bottom" does not need testing here — and testing it would be wrong anyway,
  // since jsdom reports zero heights and so calls every position the bottom.
  if (painted && log.scrollTop <= EARLIER_SLACK_PX) void loadEarlier();
});

// Growing the composer shrinks the log, and the browser keeps the scroll offset —
// which leaves the newest message cut in half at the boundary. Re-anchor when the
// log's box changes and we were already at the end, so the conversation slides up
// to stay whole instead of being clipped.
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(() => {
    if (atBottom) log.scrollTop = log.scrollHeight;
  }).observe(log);
}

// --- Paging backwards through the transcript ---
//
// The pane opens at the newest messages and pulls older ones in as you scroll
// up, the way a chat app does. A long conversation is a thousand entries; sending
// all of them on open is a megabyte of JSON for a pane you are looking at the
// bottom of.
//
// The awkward part of prepending is that it moves everything down, so the text
// under your eyes jumps the moment a page lands. The fix is to measure
// `scrollHeight` before and after and add the difference to `scrollTop`, which
// keeps the pixel you were looking at exactly where it was.

/** How many messages a page holds. Small enough to feel instant, big enough
 *  that scrolling rarely waits. */
const HISTORY_PAGE = 50;

/** Messages loaded so far, oldest first. `transcript` is the same array. */
let historyComplete = false;
/** A page is in the air: a scroll must not ask for a second copy. */
let loadingEarlier = false;
/** How many messages the server has already given us, counting back from the end. */
let historyOffset = 0;

const earlierButton = document.createElement('button');
earlierButton.type = 'button';
earlierButton.id = 'earlier';
earlierButton.hidden = true;
earlierButton.textContent = 'Earlier messages';
// The button is the accessible path; the scroll is the convenient one. Sending
// the same request from both is fine because `loadingEarlier` gates it.
earlierButton.addEventListener('click', () => void loadEarlier());
log.append(earlierButton);

/**
 * Mark the top of the log: another page to come, or the beginning.
 *
 * Three states, and the difference between them is what the reader can act on:
 *
 *   - **nothing loaded yet** — hidden. There is no conversation to page through.
 *   - **more to come** — a button, and the same request a scroll makes.
 *   - **at the beginning** — "Start of conversation", disabled. A disabled button
 *     rather than no button: a control that vanishes once used leaves the pane
 *     looking like it failed to load anything above.
 */
function paintEarlier() {
  if (transcript.length === 0) {
    earlierButton.hidden = true;
    return;
  }
  earlierButton.hidden = false;
  earlierButton.classList.toggle('settled', historyComplete);
  earlierButton.disabled = historyComplete || loadingEarlier;
  earlierButton.textContent = historyComplete
    ? 'Start of conversation'
    : loadingEarlier
      ? 'Loading earlier…'
      : 'Earlier messages';
}

/**
 * Insert older messages above what is already shown, without moving the reader.
 *
 * `scrollHeight` is read before the insert and again after it; the difference is
 * exactly how much taller the log became, and adding that to `scrollTop` puts the
 * same content back under the same pixel. Reading `scrollHeight` forces the
 * layout, which is why the two reads are on either side of one DOM write rather
 * than in a loop.
 */
function prependEarlier(older) {
  if (older.length === 0) return;
  const anchor = log.scrollHeight - log.scrollTop;
  transcript = [...older, ...transcript];
  // Built into a fragment and inserted after the button, so the header stays the
  // first child and the messages keep their order.
  const fragment = document.createDocumentFragment();
  for (const message of older) {
    fragment.append(
      messageRow(
        message.role,
        message.html || escapeText(message.text || ''),
        message.at,
        false,
        message.images ? message.images.map((image) => ({ ...image, entryId: message.entryId })) : undefined,
      ),
    );
  }
  earlierButton.after(fragment);
  log.scrollTop = log.scrollHeight - anchor;
}

/**
 * Fetch the page before the oldest one shown.
 *
 * Offset counts back from the *newest* message, so it grows by the number of
 * messages already held — not by pages:
 * a page can be short when the host drops entries with no text, and counting
 * pages would then re-request the same window forever.
 */
async function loadEarlier() {
  if (!current || loadingEarlier || historyComplete) return;
  loadingEarlier = true;
  paintEarlier();
  const id = current;
  try {
    const url = rel('api/c/' + id + '/history?limit=' + HISTORY_PAGE + '&offset=' + historyOffset);
    const rows = await (await fetch(url)).json();
    // The user may have switched conversations while this was in flight. Dropping
    // the page is right: its messages belong to a conversation that is no longer
    // on screen, and appending them would mix two transcripts.
    if (id !== current) return;
    const older = Array.isArray(rows) ? rows : [];
    historyOffset += older.length;
    // A short page is the beginning. Empty is the same signal, and stops the
    // button asking again forever.
    historyComplete = older.length < HISTORY_PAGE;
    prependEarlier(older);
  } catch {
    // Leave `historyComplete` alone so the next scroll tries again: a dropped
    // request should not look like the start of the conversation.
  } finally {
    if (id === current) {
      loadingEarlier = false;
      paintEarlier();
    }
  }
}

function paint() {
  log.innerHTML = '';
  log.append(earlierButton);
  for (const message of transcript) {
    log.append(
      messageRow(
        message.role,
        message.html || escapeText(message.text || ''),
        message.at,
        false,
        message.images ? message.images.map((image) => ({ ...image, entryId: message.entryId })) : undefined,
      ),
    );
  }
  // The live turn: the streaming answer, and the status of whatever is running.
  if (liveText || busy || statusLine) {
    const row = messageRow('assistant', liveText ? (liveHtml || escapeText(liveText)) : '', undefined, true);
    // The bubble exists from the moment the turn starts, so the reply has a home
    // before it has any text — and the tool line goes *inside* it, the way Chat
    // paints a status into the message it is editing.
    const bubble = row.querySelector('.bubble');
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = statusLine || (busy && !liveText ? 'thinking…' : '');
    if (status.textContent) bubble.append(status);
    log.append(row);
  }
  paintEarlier();
  if (atBottom) log.scrollTop = log.scrollHeight;
  else log.scrollTop = Math.min(log.scrollTop, log.scrollHeight);
  // From here on a `scroll` event is a person moving, not the browser settling.
  painted = true;
}

/**
 * The first page: the newest messages, painted at the bottom.
 *
 * `offset` restarts at zero on every open, because a new conversation means a new
 * transcript — carrying the previous one's counter over would ask for a window
 * measured against a different thread.
 */
async function loadHistory() {
  if (!current) return;
  historyOffset = 0;
  historyComplete = false;
  loadingEarlier = false;
  painted = false;
  const id = current;
  try {
    const rows = await (await fetch(rel('api/c/' + id + '/history?limit=' + HISTORY_PAGE))).json();
    if (id !== current) return;
    transcript = Array.isArray(rows) ? rows : [];
    historyOffset = transcript.length;
    historyComplete = transcript.length < HISTORY_PAGE;
  } catch {
    if (id !== current) return;
    transcript = [];
  }
  paint();
}

function open(id) {
  if (source) source.close();
  current = id;
  transcript = [];
  liveText = '';
  liveHtml = '';
  busy = false;
  statusLine = '';
  log.innerHTML = '';
  tool.textContent = '';
  restoreDraft(id);
  void loadHistory();
  connectStream(id);
}

/**
 * Open — or reopen — the event stream for a conversation.
 *
 * Not left to the browser's own retry, which gives up permanently in exactly the cases that
 * matter: a tab left in the background, a phone that locked, a server answering 5xx while it
 * restarts. In any of those `readyState` becomes CLOSED and an `EventSource` never tries again —
 * so the pane sat on "reconnecting…" for ever, which is what coming back to a frozen tab looked
 * like.
 *
 * The pane therefore owns the lifecycle: a closed stream is replaced on a short backoff, and
 * returning to the tab forces an attempt rather than waiting for a timer to come round.
 */
function connectStream(id) {
  if (source) {
    source.close();
    source = undefined;
  }
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = undefined;
  }

  source = new EventSource(rel('api/c/' + id + '/events'));
  source.addEventListener('text', (e) => {
    const d = JSON.parse(e.data);
    const wasBusy = liveText !== '';
    liveText = d.text;
    liveHtml = d.html || '';
    busy = Boolean(d.busy);
    if (busy) statusLine = '';
    paint();
    // A turn that just finished has become transcript: refetch so the answer is
    // shown as a completed message and the live block goes away.
    if (!d.busy && wasBusy) {
      setTimeout(() => {
        void loadHistory().then(() => {
          liveText = '';
          liveHtml = '';
          paint();
        });
        // The turn may have edited an artifact and replied in a thread; both are
        // this pane's business, and neither is in the transcript frames.
        void refreshReview();
      }, 300);
    }
  });
  // The stream reconnects by itself when the server goes away and comes back.
  // Comparing versions on each open is how an already-open page picks up a
  // rebuilt front end: the draft is already saved, so the reload costs nothing.
  source.addEventListener('open', async () => {
    // A stream that opens is no longer reconnecting, whatever the last error said. Without this
    // the footer keeps the message for ever on an idle conversation, because no frame arrives to
    // overwrite it.
    if (tool.textContent === 'reconnecting…') tool.textContent = '';
    if (!pageVersion || reloadedForVersion) return;
    try {
      const environment = await (await fetch(rel('api/environment'))).json();
      const latest = String(environment.pageVersion || '');
      if (latest && latest !== pageVersion) {
        reloadedForVersion = true;
        saveDraft();
        location.reload();
      }
    } catch {
      // A failed probe means the server is not answering yet; the next open tries
      // again.
    }
  });

  source.addEventListener('tool', (e) => {
    const d = JSON.parse(e.data);
    // The server words this exactly as Chat does; the page just shows it.
    statusLine = d ? String(d.line || '') : '';
    tool.textContent = '';
    paint();
  });
  source.addEventListener('error', () => {
    // Connection state is not conversation content, so it stays in the footer rather than in the
    // pane — but it must also be *true*. The browser stops retrying permanently once a stream
    // closes (a frozen tab, a phone that locked, a restart that answered 5xx), and then "reconnecting…"
    // would report an attempt nobody is making.
    tool.textContent = 'reconnecting…';
    const gone = !source || source.readyState === 2; // EventSource.CLOSED
    if (!gone || reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = undefined;
      connectStream(id);
    }, 1000);
  });
}

/**
 * The conversation's own name, for the header.
 *
 * A title if it has one, else its opening words — the same rule the index uses, so
 * a conversation is called the same thing wherever it appears.
 */
async function loadTitle() {
  const heading = document.getElementById('conv-title');
  heading.textContent = '#' + current;
  try {
    const conversation = await (await fetch(rel('api/c/' + current))).json();
    if (conversation && (conversation.name || conversation.chatKey)) {
      heading.textContent = conversation.name || conversation.chatKey;
    }
  } catch {
    // The id is a fine fallback: the pane below is the thing being read.
  }
}

// Grow the box to fit what has been typed, so the whole message is visible
// instead of scrolling inside a fixed 3.5rem window that hides its first
// lines. `height: auto` first, otherwise scrollHeight still answers with the
// height the box already has and it can only ever grow, never shrink back.
// offsetHeight - clientHeight is the border, which scrollHeight excludes and
// border-box height includes.
function fitBox() {
  textBox.style.height = 'auto';
  const border = textBox.offsetHeight - textBox.clientHeight;
  textBox.style.height = textBox.scrollHeight + border + 'px';
}

textBox.addEventListener('input', fitBox);

// Paste can land a wall of text in one go, which fires `input` before the
// layout has the new content in some browsers; re-fit after it has settled.
textBox.addEventListener('paste', () => setTimeout(fitBox, 0));

const draftBox = document.getElementById('text');
draftBox.addEventListener('input', () => {
  saveDraft();
});

// --- Attached images ---
//
// Three ways in, one place to land: paste a screenshot, pick a file, or drop one
// on the pane. A screenshot on the clipboard is still the common case, so paste
// stays first-class, but "attach this picture from my phone" is the same request
// wearing a different hat — and a phone has no clipboard-to-paste for a photo
// that was never on it.
//
// The bytes stay in this page until send, as data URLs, and go up with the
// message. Nothing is uploaded on arrival: a message is one payload, and a file
// that sits on the server waiting for a message nobody sends is a temp file whose
// lifetime nobody owns.

/** Attached images waiting to be sent: `{dataUrl, mimeType, data}`. */
let pendingImages = [];
const attachmentsBox = document.getElementById('attachments');
const attachInput = document.getElementById('attach-input');
const attachNotice = document.getElementById('attach-notice');
const pane = document.getElementById('pane');

/**
 * The same limits the route enforces, so a file is refused here with a sentence
 * instead of failing the whole message at the server with a status code.
 *
 * They are repeated rather than fetched because the page must be able to answer
 * before it sends anything — a round trip to learn "that photo is too big" is a
 * worse way to find out. If they drift, the server still wins; this only decides
 * what is worth trying.
 */
const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGES = 10;

/**
 * Say why something was refused, in the place the thumbnails would have appeared.
 *
 * Silently ignoring a dropped file is the failure that makes people think the UI
 * is broken: the file is dragged, nothing happens, and there is nothing to read.
 */
let noticeTimer;
function attachNotice_(text) {
  attachNotice.textContent = text;
  attachNotice.hidden = !text;
  clearTimeout(noticeTimer);
  // Transient, but not instant: it has to be readable, and it should not sit
  // there for the rest of the conversation claiming a file was refused.
  if (text) noticeTimer = setTimeout(() => { attachNotice.hidden = true; attachNotice.textContent = ''; }, 6000);
}

/** `1.4 MB`, so a refusal names a size a person can compare with their file. */
function formatBytes(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function renderAttachments() {
  attachmentsBox.innerHTML = '';
  attachmentsBox.hidden = pendingImages.length === 0;
  pendingImages.forEach((image, index) => {
    const figure = document.createElement('figure');
    const img = document.createElement('img');
    img.src = image.dataUrl;
    img.alt = image.name || image.mimeType || 'attached image';
    img.title = image.name || image.mimeType || '';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.title = 'Remove';
    remove.onclick = () => {
      pendingImages.splice(index, 1);
      renderAttachments();
    };
    figure.append(img, remove);
    attachmentsBox.append(figure);
  });
  fitBox();
}

/**
 * Take files from any of the three ways in: keep the ones that are images within
 * the limits, and say what happened to the rest.
 *
 * One function rather than three copies, because the rules — which types, how
 * big, how many — are the part that must agree between paste, picker and drop.
 */
async function addImages(files) {
  const list = Array.from(files || []);
  if (list.length === 0) return;
  const refused = [];
  const accepted = [];
  for (const file of list) {
    if (!file || !String(file.type || '').startsWith('image/')) {
      refused.push('“' + (file && file.name ? file.name : 'that file') + '” is not an image');
    } else if (file.size > MAX_IMAGE_BYTES) {
      refused.push('“' + (file.name || 'that image') + '” is ' + formatBytes(file.size) +
        ', over the ' + formatBytes(MAX_IMAGE_BYTES) + ' limit');
    } else if (pendingImages.length + accepted.length >= MAX_IMAGES) {
      // Needed only for a drop of a whole folder: the route's body cap would
      // otherwise refuse the send itself, with no way to tell which file did it.
      refused.push('only ' + MAX_IMAGES + ' images fit in one message');
    } else {
      accepted.push(file);
    }
  }
  await Promise.all(accepted.map((file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const comma = dataUrl.indexOf(',');
      if (comma < 0) return resolve();
      pendingImages.push({
        dataUrl: dataUrl,
        data: dataUrl.slice(comma + 1),
        mimeType: file.type,
        name: file.name || '',
      });
      renderAttachments();
      resolve();
    };
    // A file that cannot be read is refused like any other: an unreadable image
    // would otherwise vanish between the picker and the strip.
    reader.onerror = () => {
      refused.push('“' + (file.name || 'that image') + '” could not be read');
      resolve();
    };
    reader.readAsDataURL(file);
  })));
  // Deduplicated and joined: dropping five text files should not say the same
  // thing five times, and the first reason is the one to act on.
  if (refused.length) attachNotice_([...new Set(refused)].join('; '));
  else attachNotice_('');
}

// Paste: clipboard files only, so an ordinary text paste is untouched.
draftBox.addEventListener('paste', (event) => {
  const items = event.clipboardData ? Array.from(event.clipboardData.items) : [];
  const files = items
    .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
    .map((item) => item.getAsFile())
    .filter((file) => file);
  if (files.length === 0) return; // ordinary text paste: leave it alone
  event.preventDefault();
  addImages(files);
});

// Picker: the attach button opens it, and the input is cleared afterwards so
// picking the same file twice in a row still fires `change`.
const attachButton = document.getElementById('attach');
attachButton.addEventListener('click', () => attachInput.click());
attachInput.addEventListener('change', () => {
  addImages(attachInput.files);
  attachInput.value = '';
});

// Drop: onto the pane, which includes the composer and the conversation above it.
// Counted rather than toggled, because dragging over a child fires `dragleave` on
// the parent: an unmatched leave would clear the highlight mid-drag and leave it
// stuck off after the drop.
let dragDepth = 0;
function carriesFiles(event) {
  const types = event.dataTransfer ? Array.from(event.dataTransfer.types || []) : [];
  return types.indexOf('Files') >= 0;
}
pane.addEventListener('dragenter', (event) => {
  if (!carriesFiles(event)) return;
  event.preventDefault();
  dragDepth += 1;
  pane.classList.add('dropping');
});
pane.addEventListener('dragover', (event) => {
  if (!carriesFiles(event)) return;
  // Without this the browser navigates to the file and the conversation is gone.
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});
pane.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) pane.classList.remove('dropping');
});
pane.addEventListener('drop', (event) => {
  dragDepth = 0;
  pane.classList.remove('dropping');
  if (!event.dataTransfer) return;
  // Only a file drop is ours: dropping selected text into the box is the
  // browser's own behaviour and must keep working.
  const files = Array.from(event.dataTransfer.files || []);
  if (files.length === 0) return;
  event.preventDefault();
  addImages(files);
  textBox.focus();
});

// Enter sends, because this is a chat box and that is what a chat box does.
// Shift-Enter and Ctrl-Enter (and Cmd-Enter) insert a newline instead, so a
// multi-line message is still possible without reaching for the mouse. IME
// composition is left alone: pressing Enter to commit a candidate must not send
// half a word.
draftBox.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  if (event.shiftKey || event.ctrlKey || event.metaKey) return;
  if (event.isComposing) return;
  event.preventDefault();
  document.getElementById('send').requestSubmit();
});

document.getElementById('send').onsubmit = async (e) => {
  e.preventDefault();
  const box = textBox;
  const text = box.value.trim();
  if ((!text && pendingImages.length === 0) || !current) return;
  const sending = pendingImages;
  pendingImages = [];
  renderAttachments();
  box.value = '';
  // Clearing the box programmatically fires no `input` event, and `saveDraft()`
  // is only wired to `input`. Without this explicit call the draft outlived the
  // send, and `open()` refilled the box with the message already sent the next
  // time the conversation was opened. Save after clearing rather than removing
  // the key directly, so the empty-box rule stays in one place.
  saveDraft();
  fitBox();
  // A line beginning with `/` is a command, not a message: it asks the application something rather
  // than telling the agent something. Images win, because dropping them silently is worse than
  // sending a message beginning with a slash.
  if (text.startsWith('/') && sending.length === 0) {
    await runCommandLine(text);
    return;
  }
  const response = await fetch(rel('api/c/' + current + '/message'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      images: sending.map((image) => ({ data: image.data, mimeType: image.mimeType })),
    }),
  });
  // Show it immediately, the way Chat echoes your message: waiting for the
  // transcript refetch at the end of the turn made it look lost.
  try {
    const result = await response.json();
    if (result && result.ok) {
      transcript.push({
        role: 'user',
        text: text,
        html: result.html,
        at: Date.now(),
        // The pasted image is shown from its data URL: it has no entry id until
        // the transcript comes back, and re-reading it from disk mid-send would
        // be slower than the copy already in hand.
        images: sending.map((image) => ({ mimeType: image.mimeType, dataUrl: image.dataUrl })),
      });
      paint();
    }
  } catch {
    // A failed submit is already visible as a missing message; the turn's own
    // error, if any, arrives on the stream.
  }
};

// --- Commands -----------------------------------------------------------------
//
// A line beginning with `/` is not a message. It goes to `api/c/<id>/commands` and comes back as one
// of four *shapes* — text, a list, a choice, a form — which this page renders and knows nothing
// further about. That is the trade the vocabulary makes: four renderers here instead of eleven
// commands, and a command added on the server appears in every surface at once.
//
// The answer is drawn in its own panel above the composer rather than in the transcript, for a dull
// and decisive reason: `paint()` rebuilds the log from `transcript` on every stream frame, so a
// message-shaped thing that is not a message would disappear at the next one.

const commandPanel = document.getElementById('command-panel');
const commandBody = document.getElementById('command-body');
const commandTitle = document.getElementById('command-title');
document.getElementById('command-close').onclick = () => {
  commandPanel.hidden = true;
  commandBody.innerHTML = '';
};

/** One text node, so a command's output can never be markup. */
function commandText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

/**
 * Ask the server what a command means, then draw the answer.
 *
 * `values` is a form's or a choice's answer, keyed by field id. The command text stays the same —
 * what was asked and what was chosen are different things, and the second one is untrusted.
 */
async function runCommandLine(text, values, preview) {
  if (!current) return;
  let shape;
  try {
    const response = await fetch(rel('api/c/' + current + '/commands'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, ...(values ? { values } : {}), ...(preview ? { preview: true } : {}) }),
    });
    shape = await response.json();
  } catch {
    shape = { kind: 'text', text: 'The command did not answer. Is the bridge still running?' };
  }
  if (!shape || typeof shape.kind !== 'string') shape = { kind: 'text', text: 'The command answered with nothing.' };
  renderCommand(shape);
}

function renderCommand(shape) {
  commandBody.innerHTML = '';
  commandPanel.hidden = false;
  if (shape.kind === 'text') {
    commandTitle.textContent = 'Command';
    commandBody.append(commandText('p', shape.text));
    // A command that made a conversation says where it is; going there is the point of `/new` and
    // `/resume`, and a link the reader has to find in a list would be worse than a redirect.
    if (typeof shape.goto === 'number') {
      window.location.href = mountRoot() + shape.goto + '/';
      return;
    }
    return;
  }
  if (shape.kind === 'list') {
    commandTitle.textContent = shape.title || 'Results';
    const rows = Array.isArray(shape.rows) ? shape.rows : [];
    if (rows.length === 0) {
      commandBody.append(commandText('p', shape.empty || 'Nothing.'));
      return;
    }
    const list = document.createElement('ul');
    for (const row of rows) {
      const item = document.createElement('li');
      const clickable = typeof row.command === 'string' && row.command !== '';
      const button = document.createElement(clickable ? 'button' : 'div');
      if (clickable) button.type = 'button';
      button.className = 'row' + (clickable ? ' clickable' : '') + (row.current ? ' current' : '');
      button.append(commandText('span', row.label));
      if (row.detail) button.append(commandText('span', row.detail, 'detail'));
      if (clickable) button.onclick = () => void runCommandLine(row.command);
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'choice') {
    commandTitle.textContent = shape.prompt || 'Choose';
    const list = document.createElement('ul');
    for (const option of Array.isArray(shape.options) ? shape.options : []) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'row clickable' + (option.selected ? ' current' : '');
      button.append(commandText('span', option.label));
      if (option.detail) button.append(commandText('span', option.detail, 'detail'));
      // Choosing is sending the command with this option as the answer, so a choice and a form
      // submit are the same wire shape and the server sees one mechanism, not two.
      button.onclick = () => void runCommandLine(shape.command, option.values ?? {});
      item.append(button);
      list.append(item);
    }
    commandBody.append(list);
    return;
  }
  if (shape.kind === 'form') {
    commandTitle.textContent = shape.prompt || 'Fill this in';
    const form = document.createElement('form');
    const fields = Array.isArray(shape.fields) ? shape.fields : [];
    const controls = new Map();
    for (const field of fields) {
      const label = document.createElement('label');
      label.append(commandText('span', field.label));
      let control;
      if (field.kind === 'select') {
        control = document.createElement('select');
        for (const option of Array.isArray(field.options) ? field.options : []) {
          const choice = document.createElement('option');
          choice.value = option.id;
          choice.textContent = option.detail && option.detail !== option.label
            ? option.label + ' — ' + option.detail
            : option.label;
          if (option.selected || option.id === field.value) choice.selected = true;
          control.append(choice);
        }
      } else {
        control = document.createElement('input');
        control.type = 'text';
        if (field.value) control.value = field.value;
      }
      control.id = 'field-' + field.id;
      if (field.hint) label.append(commandText('span', field.hint, 'hint'));
      label.append(control);
      controls.set(field.id, control);
      form.append(label);
      // A field whose value another field's options depend on — the model, whose levels the thinking
      // select lists. Changing it re-asks the command with a preview, so the command decides what the
      // change means instead of this page knowing.
      if (field.requery && field.kind === 'select') {
        control.onchange = () => {
          const values = {};
          for (const [id, each] of controls) values[id] = each.value;
          void runCommandLine(shape.command, values, true);
        };
      }
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = shape.submit || 'Apply';
    actions.append(submit);
    form.append(actions);
    form.onsubmit = (event) => {
      event.preventDefault();
      const values = {};
      for (const [id, control] of controls) values[id] = control.value;
      void runCommandLine(shape.command, values);
    };
    commandBody.append(form);
    return;
  }
  // An unknown shape is not a crash: a newer server talking to an older page says something, and the
  // page says what it can.
  commandTitle.textContent = 'Command';
  commandBody.append(commandText('p', 'This page does not know how to show that answer.'));
}

// --- Artifacts: a drawer over the conversation, hidden until asked for. ---
//
// The list comes from this origin (`api/c/<id>/artifacts`), so no CORS. The file
// itself is framed from the artifact host, which is a *different* origin: it is
// sandboxed there and cannot read this page's DOM, cookies or storage.

let artifactsBase = '';
let artifactsOpen = false;
/** Whether this page pushed the history entry the open document lives in. */
let artifactsEntryPushed = false;

const artifactsButton = document.getElementById('artifacts-toggle');
const artifactsPanel = document.getElementById('artifacts');
const artifactsList = document.getElementById('artifact-list');
const artifactsFrame = document.getElementById('artifact-frame');
const artifactsHint = document.getElementById('artifact-hint');
const artifactsNewTab = document.getElementById('artifacts-newtab');
const artifactsBack = document.getElementById('artifacts-back');
const artifactsTitle = document.getElementById('artifacts-title');

/**
 * Where the framed document is fetched from.
 *
 * The drawer always asks for the *source* view, which is the one with numbered
 * lines and the selection script — a rendered Markdown page has no lines to
 * anchor a comment to, and a bare `text/plain` response cannot carry a script at
 * all. `?view=source` is still inert HTML: every byte of the file is escaped into
 * it, and the only script is the one the artifact origin writes with a per-response
 * nonce.
 */
/**
 * Which view a file opens in.
 *
 * Markdown opens *rendered*, because that is what a person wants to read — and
 * the rendered document is commentable too: it reports the selected text and the
 * session host finds the source lines it came from, so neither side has to know
 * how the other numbered anything. Everything else opens as the source view,
 * where a line number is the obvious unit.
 */
function artifactUrl(key, markdown) {
  const path = key.split('/').map(encodeURIComponent).join('/');
  return artifactsBase + '/c/' + current + '/' + path + (markdown ? '?render' : '?view=source');
}

/** The last path segment: what the file is actually called. */
function baseName(key) {
  const parts = key.split('/');
  return parts[parts.length - 1] || key;
}

/** The directory part, which may be empty at the root. */
function dirName(key) {
  const parts = key.split('/');
  parts.pop();
  return parts.join('/');
}

/**
 * Frame loads we caused, and loads we have seen.
 *
 * A back gesture can be delivered to the *frame's* own transcript rather than the
 * page's, in which case no `popstate` fires here and the frame simply walks back
 * to `about:blank` — the drawer then showed a file's name over an empty page. A
 * load nobody asked for is that navigation, and the honest response is to treat it
 * as "back to the list", which is what the gesture meant.
 */
let frameLoadsCaused = 0;
let frameLoadsSeen = 0;

function loadFrame(url) {
  frameLoadsCaused += 1;
  artifactsFrame.src = url;
}

artifactsFrame.addEventListener('load', () => {
  frameLoadsSeen += 1;
  if (frameLoadsSeen <= frameLoadsCaused) return; // one of ours
  frameLoadsCaused = frameLoadsSeen;
  if (artifactsOpen && artifactsPanel.classList.contains('showing-doc')) applyListState();
});

/**
 * Show one document in the drawer.
 *
 * `push` is false when this is a *restore* — the page just loaded with the fragment already naming
 * this file, so the entry exists and pushing another would make one back gesture do nothing.
 */
function showArtifact(key, markdown, push = true) {
  for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === key);
  // The document slides over the list and takes the drawer's full width, so a
  // name-heavy list stops competing with the thing being read.
  artifactsPanel.classList.add('showing-doc');
  artifactsTitle.textContent = baseName(key);
  artifactsTitle.title = key;
  artifactsBack.hidden = false;
  artifactsNewTab.hidden = false;
  // A transcript entry per document, so the browser's own back gesture means what it
  // looks like it means: close the document, show the list.
  try {
    const state = { artifact: key };
    const address = '#' + encodeURIComponent(key);
    if (push) history.pushState(state, '', address);
    else history.replaceState(state, '', address);
  } catch {
    // A sandboxed or file: context can refuse either call; the drawer still works.
  }
  // Whether this page added the entry. After a reload it did not — the entry was restored from the
  // address — and one back gesture must not then leave the page entirely.
  artifactsEntryPushed = push;
  // Which document the frame holds, for the refresh that must not drop it.
  artifactsFrame.dataset.key = key;
  // Markdown is rendered by the artifact host inside its sandboxed document;
  // everything else is shown as plain text, never as HTML.
  loadFrame(artifactUrl(key, markdown));
  closeCommentBar();
  closeThread();
  artifactsNewTab.dataset.key = key;
  artifactsNewTab.dataset.markdown = markdown ? '1' : '';
}

/** The list state, without touching transcript. */
function applyListState() {
  artifactsPanel.classList.remove('showing-doc');
  artifactsTitle.textContent = 'Artifacts';
  artifactsTitle.removeAttribute('title');
  artifactsBack.hidden = true;
  artifactsNewTab.hidden = true;
  delete artifactsFrame.dataset.key;
  artifactsEntryPushed = false;
  if (artifactsFrame.getAttribute('src') !== 'about:blank') loadFrame('about:blank');
}

/**
 * Back to the list.
 *
 * Goes through transcript when we own an entry, so the drawer's ← and the browser's
 * back gesture end in the same place.
 */
function showArtifactList() {
  // A back gesture only means "close the document" when this page made the entry it would undo.
  // Otherwise — a reload, a pasted link — going back would leave the conversation.
  if (artifactsEntryPushed && history.state && history.state.artifact) {
    history.back();
    return;
  }
  applyListState();
  try {
    history.replaceState({}, '', location.pathname);
  } catch {
    // Refused in a sandboxed context; the drawer is already showing the list.
  }
}

// A back gesture after opening a document lands here.
window.addEventListener('popstate', () => {
  if (artifactsOpen) applyListState();
});

// The fragment is the address of a document, so a change to it is a request to show that document —
// whether it came from a pasted link, an edited address, or forward/back between two files.
window.addEventListener('hashchange', () => {
  const key = artifactKeyFromHash();
  if (!key) {
    if (artifactsOpen && artifactsPanel.classList.contains('showing-doc')) applyListState();
    return;
  }
  if (!artifactsOpen || artifactsFrame.dataset.key !== key) void restoreArtifact(key);
});

/**
 * The artifact the URL fragment names.
 *
 * The fragment is the artifact key — that is what opening a document writes there — so a reload or a
 * pasted link can put the reader back on the file they were reading. Keys contain slashes, so the
 * encode/decode pair is not decoration: `#conversation/1/notes.md` and `#conversation%2F1%2Fnotes.md`
 * are the same file, and only the encoded one survives being copied out of an address bar intact.
 */
function artifactKeyFromHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return '';
  try {
    return decodeURIComponent(raw);
  } catch {
    return raw; // not percent-encoded, but still names something
  }
}

/**
 * Open the document the URL names.
 *
 * Waits for the environment (the artifact host's address is fetched) and for the list, because a
 * document opens *from* the list: its row is what says whether it renders. A key that is no longer
 * one of this conversation's files leaves the list showing and drops the fragment, so the address bar
 * never claims something the page is not showing.
 */
async function restoreArtifact(key) {
  if (!key) return;
  await artifactsReady;
  if (artifactsBase === '' || !current) return;
  await setArtifactsOpen(true);
  const row = [...artifactsList.children].find((li) => li.dataset.key === key);
  if (!row) {
    try {
      history.replaceState({}, '', location.pathname);
    } catch {
      // Same as everywhere else: a refusal costs the address, not the drawer.
    }
    return;
  }
  showArtifact(key, row.dataset.markdown === '1', false);
}

/**
 * Rebuild the list.
 *
 * `preserve` is for a refresh the reader did not ask for: it keeps the document
 * they are reading open and restores the highlight, instead of dropping them back
 * to the list every time a turn ends.
 */
async function loadArtifacts(preserve) {
  const framed = preserve ? artifactsFrame.dataset.key || '' : '';
  artifactsList.innerHTML = '';
  if (!current) return;
  let rows;
  try {
    rows = await (await fetch(rel('api/c/' + current + '/artifacts'))).json();
  } catch {
    rows = [];
  }
  if (!Array.isArray(rows) || rows.length === 0) {
    artifactsHint.hidden = false;
    artifactsHint.textContent = 'No files were written or edited in this conversation.';
    return;
  }
  artifactsHint.hidden = rows.length > 0;
  for (const row of rows) {
    const li = document.createElement('li');
    li.dataset.key = row.key;
    li.dataset.markdown = row.markdown ? '1' : '';
    li.innerHTML = '<span class="col"><span class="name"></span><span class="dir"></span></span><span class="counts"></span>';
    // The name first and the directory underneath: a list of full paths is mostly
    // directory, and the drawer only needs enough to tell two files apart.
    li.querySelector('.name').textContent = baseName(row.key);
    li.querySelector('.dir').textContent = dirName(row.key);
    const counts = [];
    if (row.wrote) counts.push(row.wrote + (row.wrote === 1 ? ' write' : ' writes'));
    if (row.edited) counts.push(row.edited + (row.edited === 1 ? ' edit' : ' edits'));
    li.querySelector('.counts').textContent = counts.join(', ');
    li.title = row.key;
    li.onclick = () => showArtifact(row.key, Boolean(row.markdown));
    artifactsList.append(li);
  }
  if (preserve && framed !== '') {
    // Same document, same place: only the rows are new.
    for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === framed);
    return;
  }
  // Open on the list: choosing is the first act, and the document takes the screen
  // once chosen.
  showArtifactList();
}

async function setArtifactsOpen(open) {
  artifactsOpen = open;
  artifactsPanel.hidden = !open;
  if (open) {
    void loadComments();
    await loadArtifacts();
  } else {
    applyListState();
    if (history.state && history.state.artifact) history.replaceState({}, '', location.pathname);
  }
}

// --- Review comments ---------------------------------------------------------
//
// The framed document cannot submit anything, by design: it is a different origin,
// sandboxed, and its own bytes are agent-written. So it *reports* — a selection, a
// click on a highlight — and this page, which owns the session and the API, turns
// that into a message. Nothing crosses except numbers and text, and the frame is
// identified by `event.source`, not by an origin string (a sandboxed frame's
// origin is the string "null", which no check can distinguish).

const commentBar = document.getElementById('comment-bar');
const commentAddr = document.getElementById('comment-addr');
const commentQuote = document.getElementById('comment-quote');
const commentText = document.getElementById('comment-text');
const commentError = document.getElementById('comment-error');
const commentSheet = document.getElementById('comment-sheet');
const commentSheetAddr = document.getElementById('comment-sheet-addr');
const commentSheetQuote = document.getElementById('comment-sheet-quote');
const commentThread = document.getElementById('comment-thread');
const commentReply = document.getElementById('comment-reply');

/** The selection the comment bar is currently about. */
let pendingSelection = null;
/** The comment whose thread is open. */
let openCommentId = null;
/** Every comment this conversation has, keyed by id, from the last load. */
let commentsById = new Map();

/**
 * What to show above the composer.
 *
 * A source view reports lines, so the address is the real one. A rendered view
 * reports text, and the address is only decided once the host has found it — so
 * the bar shows the quotation instead of inventing a line number.
 */
function commentAddress(selection) {
  const line = selection.line;
  if (line === undefined) {
    const quote = (selection.quote || '').replace(/\s+/g, ' ').trim();
    return quote.length > 60 ? quote.slice(0, 60) + '…' : quote;
  }
  const endLine = selection.endLine || line;
  if (selection.charStart && selection.charEnd && line === endLine) {
    return 'L' + line + 'C' + selection.charStart + '-L' + line + 'C' + selection.charEnd;
  }
  return endLine === line ? 'L' + line : 'L' + line + '-L' + endLine;
}

/**
 * Show the composer for a selection — **without taking focus**.
 *
 * Focus is the whole problem on a touch screen: focusing the textarea raises the
 * keyboard, and raising the keyboard ends the document's selection, so the
 * native grabbers vanish the instant you start dragging one. The reader can then
 * never extend the selection they were making. So the bar appears, follows the
 * selection while it is still being adjusted, and only takes focus when the
 * reader taps it — which is the gesture that means "I am done selecting, now I am
 * typing".
 *
 * A selection that arrives while the bar is already open only updates what the
 * bar is about: the words already typed stay, because the reader may be nudging a
 * handle mid-sentence.
 */
function showCommentBar(selection) {
  const opening = commentBar.hidden || !pendingSelection;
  pendingSelection = selection;
  closeThread();
  const where = commentAddress(selection);
  commentAddr.textContent = (selection.file || '') + (selection.line === undefined ? ' — ' : '#') + where;
  commentQuote.hidden = !selection.quote;
  commentQuote.textContent = selection.quote || '';
  if (opening) {
    commentText.value = '';
    commentError.hidden = true;
  }
  commentBar.hidden = false;
  // Focus follows intent. The document only sends `intent: "comment"` when somebody clicked the
  // affordance beside their selection — an explicit "I want to write something" — and focusing then
  // is right: it opens the keyboard, which is what they asked for. Selection alone never focuses,
  // because that raises the keyboard mid-read and collapses the very selection being commented on.
  if (selection.intent === 'comment') {
    commentText.focus();
  }
}

function closeCommentBar() {
  pendingSelection = null;
  commentBar.hidden = true;
  commentText.value = '';
}

function closeThread() {
  openCommentId = null;
  commentSheet.hidden = true;
  commentThread.innerHTML = '';
  commentReply.value = '';
}

/** Post one comment, then redraw the frame so the new highlight appears. */
async function sendComment() {
  if (!pendingSelection) return;
  const text = commentText.value.trim();
  if (!text) {
    commentError.hidden = false;
    commentError.textContent = 'A comment needs words.';
    return;
  }
  const selection = pendingSelection;
  commentError.hidden = true;
  try {
    const response = await fetch(rel('api/c/' + current + '/comments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file: selection.file,
        ...(selection.line === undefined ? {} : { line: selection.line }),
        ...(selection.endLine === undefined ? {} : { endLine: selection.endLine }),
        ...(selection.charStart === undefined ? {} : { charStart: selection.charStart }),
        ...(selection.charEnd === undefined ? {} : { charEnd: selection.charEnd }),
        ...(selection.quote === undefined ? {} : { quote: selection.quote }),
        ...(selection.occurrence === undefined ? {} : { occurrence: selection.occurrence }),
        text,
      }),
    });
    const result = await response.json().catch(() => ({ ok: false, error: 'unreadable response' }));
    if (!response.ok || result.ok === false) {
      commentError.hidden = false;
      // The host's refusal is the useful message ("artifacts are not version
      // controlled in this deployment"), so it is shown verbatim.
      commentError.textContent = result.error || 'comment failed';
      return;
    }
    closeCommentBar();
    await loadComments();
    reloadFrame();
  } catch (error) {
    commentError.hidden = false;
    commentError.textContent = String(error && error.message ? error.message : error);
  }
}

/** Re-fetch a document so its highlights match the comments that exist now. */
function reloadFrame() {
  const src = artifactsFrame.getAttribute('src');
  if (src && src !== 'about:blank') loadFrame(src);
}

async function loadComments() {
  if (!current) return;
  try {
    const rows = await (await fetch(rel('api/c/' + current + '/comments'))).json();
    commentsById = new Map((Array.isArray(rows) ? rows : []).map((row) => [row.id, row]));
  } catch {
    commentsById = new Map();
  }
}

/** One told exchange in a thread: who said it, and what they said. */
function threadTurn(who, said, kind) {
  const wrap = document.createElement('div');
  wrap.className = 'comment-turn' + (kind ? ' ' + kind : '');
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who;
  const body = document.createElement('p');
  body.className = 'said';
  body.textContent = said;   // textContent, not innerHTML: this is untrusted text
  wrap.append(label, body);
  return wrap;
}

/** Open one comment's thread, loading its answers from the conversation. */
async function openThread(id) {
  const comment = commentsById.get(id);
  if (!comment) return;
  closeCommentBar();
  openCommentId = id;
  commentSheetAddr.textContent = comment.address || id;
  commentSheetQuote.hidden = !comment.quote;
  commentSheetQuote.textContent = comment.quote || '';
  commentThread.innerHTML = '';
  commentThread.append(threadTurn(comment.author || 'you', comment.text, 'question'));
  if (comment.replies > 0) commentThread.append(threadTurn('agent', '…', 'answer-pending'));
  commentSheet.hidden = false;
  document.getElementById('comment-resolve').textContent = comment.resolved ? 'Reopen' : 'Resolve';
  try {
    const replies = await (await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(id) + '/thread'))).json();
    if (openCommentId !== id) return;
    for (const node of commentThread.querySelectorAll('.comment-turn.answer-pending')) node.remove();
    for (const reply of Array.isArray(replies) ? replies : []) {
      // A `note` is the agent replying inside the thread through its tool — kept
      // out of the conversation on purpose, so it is shown plainly and not as a
      // turn. An `answer` is what the turn said in Chat, already worded for it.
      commentThread.append(
        threadTurn(reply.kind === 'note' ? 'agent (thread)' : 'agent', reply.text || '(no answer yet)', reply.kind === 'note' ? 'note' : 'answer'),
      );
    }
  } catch {
    // A thread that cannot be read still shows what was asked.
  }
}

async function replyInThread() {
  if (!openCommentId) return;
  const text = commentReply.value.trim();
  if (!text) return;
  commentReply.value = '';
  try {
    const response = await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/reply'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!response.ok) return;
    await openThread(openCommentId);
  } catch {
    // The reply is lost; the thread is still there to try again.
  }
}

async function resolveComment() {
  if (!openCommentId) return;
  const comment = commentsById.get(openCommentId);
  const next = !(comment && comment.resolved);
  try {
    await fetch(rel('api/c/' + current + '/comments/' + encodeURIComponent(openCommentId) + '/resolve'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolved: next }),
    });
    await loadComments();
    closeThread();
    reloadFrame();
  } catch {
    // Leave the thread open: the button is the whole interaction.
  }
}

/**
 * Bring the review pane up to date without being asked.
 *
 * Three things can change it: a turn that wrote files, a turn that replied in a
 * thread, and a comment made on another device. The first two arrive here when a
 * turn settles (the stream already says so); the third is caught by the focus
 * handler below, because nothing in this page hears about it otherwise.
 *
 * What is *not* refreshed blindly is the framed document: a reload throws away
 * the selection the composer is about. So the frame is only reloaded when no
 * comment is being written, which is also the case where the reader is just
 * looking and a stale file would mislead them.
 */
async function refreshReview() {
  if (!artifactsOpen || !current) return;
  await loadComments();
  if (openCommentId) void openThread(openCommentId);
  await loadArtifacts(true);
  if (!pendingSelection) reloadFrame();
}

window.addEventListener('message', (event) => {
  // Identity, not origin: the frame is sandboxed without `allow-same-origin`, so
  // its origin is "null" and an origin check would have to accept everything.
  if (!artifactsFrame.contentWindow || event.source !== artifactsFrame.contentWindow) return;
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  if (data.t === 'pi-artifact-select' && typeof data.file === 'string') {
    showCommentBar(data);
  } else if (data.t === 'pi-artifact-open' && typeof data.id === 'string') {
    void openThread(data.id);
  } else if (data.t === 'pi-artifact-clear') {
    // The reader dismissed the selection. Close the composer, but never over a
    // draft, and never while the field has focus — tapping the field itself can
    // collapse the document's selection on some browsers, and that tap means
    // "I am typing now", not "forget this".
    if (commentBar.hidden) return;
    if (document.activeElement === commentText) return;
    if (commentText.value.trim() !== '') return;
    closeCommentBar();
  }
});

// A comment made on a phone while this page sat idle is only visible when the
// tab is looked at again. Cheaper and more predictable than a poll.
document.addEventListener('visibilitychange', () => {
  // Back to the tab: a stream that died while we were away is not going to notice by itself, and
  // waiting for a backoff that may already have elapsed is how "inactive then returning" looks
  // broken. Only reconnect when nothing is open, so a healthy stream is left alone.
  if (document.visibilityState === 'visible' && current && (!source || source.readyState !== 1)) {
    connectStream(current);
  }
  if (!document.hidden) void refreshReview();
});

// The bar is the only thing that may focus the field, and only when tapped:
// `pointerdown` on the chrome, never an automatic focus.
commentBar.addEventListener('pointerdown', (event) => {
  const target = event.target;
  if (!target || target === commentText || target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
  // Defer, so the tap does not land inside the newly focused field and move the
  // caret to wherever the finger was.
  setTimeout(() => commentText.focus(), 0);
});

document.getElementById('comment-send').onclick = () => void sendComment();
document.getElementById('comment-cancel').onclick = () => closeCommentBar();
document.getElementById('comment-sheet-close').onclick = () => closeThread();
document.getElementById('comment-reply-send').onclick = () => void replyInThread();
document.getElementById('comment-resolve').onclick = () => void resolveComment();

/* How wide the drawer is: a choice, remembered, in pixels. `min(38rem, 45%)` is
   the starting point until you drag it — a percentage so a narrow window gets a
   proportional slice rather than a panel wider than the conversation. */
const ARTIFACTS_WIDTH_KEY = 'pi-artifacts-width';
const ARTIFACTS_MIN_W = 16 * 16;
const CONVERSATION_MIN_W = 15 * 16;
const artifactsResize = document.getElementById('artifacts-resize');
const workspace = document.getElementById('workspace');

try {
  const saved = Number(localStorage.getItem(ARTIFACTS_WIDTH_KEY));
  if (saved > 0) artifactsPanel.style.width = saved + 'px';
} catch {
  // Private mode: the default width is fine.
}

artifactsResize.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  event.preventDefault();
  artifactsResize.setPointerCapture(event.pointerId);
  artifactsPanel.classList.add('resizing');
  document.body.classList.add('resizing');
  const startX = event.clientX;
  const startWidth = artifactsPanel.getBoundingClientRect().width;
  // Leave the conversation something to live in: on a small window a panel that
  // can eat the whole width is the overlay problem again, by hand.
  const widest = Math.max(ARTIFACTS_MIN_W, workspace.clientWidth - CONVERSATION_MIN_W);
  const move = (moveEvent) => {
    const width = Math.min(widest, Math.max(ARTIFACTS_MIN_W, startWidth - (moveEvent.clientX - startX)));
    artifactsPanel.style.width = width + 'px';
  };
  const end = () => {
    artifactsPanel.classList.remove('resizing');
    document.body.classList.remove('resizing');
    artifactsResize.removeEventListener('pointermove', move);
    artifactsResize.removeEventListener('pointerup', end);
    artifactsResize.removeEventListener('pointercancel', end);
    try {
      localStorage.setItem(ARTIFACTS_WIDTH_KEY, String(Math.round(artifactsPanel.getBoundingClientRect().width)));
    } catch {
      // The width is a convenience; not worth failing over.
    }
  };
  artifactsResize.addEventListener('pointermove', move);
  artifactsResize.addEventListener('pointerup', end);
  artifactsResize.addEventListener('pointercancel', end);
});

artifactsButton.onclick = () => setArtifactsOpen(!artifactsOpen);
document.getElementById('artifacts-close').onclick = () => setArtifactsOpen(false);
artifactsBack.onclick = () => showArtifactList();
artifactsNewTab.onclick = () => {
  const key = artifactsNewTab.dataset.key;
  if (key) window.open(artifactUrl(key, artifactsNewTab.dataset.markdown === '1'), '_blank', 'noopener');
};
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape' || !artifactsOpen) return;
  // Escape steps back one screen: document → list → closed.
  if (artifactsPanel.classList.contains('showing-doc')) showArtifactList();
  else setArtifactsOpen(false);
});

// The panel is pointless without an artifact host to point at, so it stays
// hidden unless the deployment says where that is.
const artifactsReady = (async () => {
  try {
    const environment = await (await fetch(rel('api/environment'))).json();
    artifactsBase = String(environment.artifactsBaseUrl || '').replace(/\/$/, '');
    artifactsButton.hidden = artifactsBase === '';
    pageVersion = String(environment.pageVersion || '');
  } catch {
    artifactsButton.hidden = true;
  }
})();

// --- The index: recent conversations, paged, plus a new chat. ---

const PAGE_SIZE = 30;
let indexOffset = 0;

async function loadIndex(offset) {
  indexOffset = Math.max(0, offset || 0);
  let page = { items: [], more: false };
  try {
    page = await (await fetch(rel('api/conversations?limit=' + PAGE_SIZE + '&offset=' + indexOffset))).json();
  } catch {
    page = { items: [], more: false };
  }
  const list = document.getElementById('index-list');
  list.innerHTML = '';
  if (!Array.isArray(page.items) || page.items.length === 0) {
    const li = document.createElement('li');
    li.textContent = indexOffset === 0 ? 'No conversations yet — start one with ＋.' : 'Nothing older.';
    li.style.cursor = 'default';
    list.append(li);
  }
  for (const row of page.items || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="who"></span><span class="when"></span>';
    li.firstChild.textContent = row.name || row.chatKey;
    const at = row.lastActivityAt || row.createdAt;
    li.lastChild.textContent = formatWhen(at, true);
    li.title = '#' + row.conversationId + ' · ' + row.model + (at ? ' · ' + formatWhen(at) : '');
    li.onclick = () => {
      location.href = mountRoot() + row.conversationId + '/';
    };
    list.append(li);
  }

  const pager = document.getElementById('index-pager');
  const count = (page.items || []).length;
  pager.hidden = !(indexOffset > 0 || page.more);
  document.getElementById('index-newer').disabled = indexOffset === 0;
  document.getElementById('index-older').disabled = !page.more;
  document.getElementById('index-range').textContent =
    count === 0 ? '' : `${indexOffset + 1}–${indexOffset + count}`;
}

document.getElementById('index-newer').onclick = () => void loadIndex(indexOffset - PAGE_SIZE);
document.getElementById('index-older').onclick = () => void loadIndex(indexOffset + PAGE_SIZE);

document.getElementById('new-chat').onclick = async () => {
  try {
    const response = await fetch(rel('api/conversations'), { method: 'POST' });
    const created = await response.json();
    if (created && created.conversationId) location.href = mountRoot() + created.conversationId + '/';
  } catch {
    // Nothing sensible to say in the index; the click simply did not work.
  }
};

// --- Boot ---

const openId = conversationIdFromPath();
if (openId === undefined) {
  // The index is a document: the window scrolls it, so the rows past the fold
  // are reachable with the scrollbar the browser draws for the page.
  document.body.classList.add('indexing');
  document.getElementById('index').hidden = false;
  document.getElementById('app').hidden = true;
  document.getElementById('new-chat').hidden = false;
  void loadIndex(0);
} else {
  document.getElementById('index').hidden = true;
  document.getElementById('app').hidden = false;
  // No floating ＋ on a conversation page: it sat exactly where Send is.
  document.getElementById('new-chat').hidden = true;
  document.getElementById('back').href = mountRoot();
  current = openId;
  void loadTitle();
  open(openId);
  // A reload lands here with the fragment still naming the file that was open.
  void restoreArtifact(artifactKeyFromHash());
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi bridge</title>
<meta name="theme-color" content="#a51f34">
<!--
  Resolve everything against this document's own URL, not the origin root. The
  page may be served at /web/ directly or behind a reverse proxy at /pi/, and a
  hard-coded leading slash would point at the proxy's root instead of ours.
  With <base> and relative URLs the same build works at both, with no config.
-->
<base href="">
<!--
  The tab icon: a slice of cherry pie. After <base>, because a <base href> only
  rebinds the links that follow it — the icon href has to be mount-relative like
  every other URL here, or a page behind /pi/ would ask the proxy for
  /favicon.svg and get its 404 instead of ours. `type=` because Safari ignores an
  SVG icon without it; the apple-touch-icon is the same file, which iOS
  rasterises on its own, so there is no PNG to keep in step with the SVG.
-->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* One place for the type stack. `system-ui` alone resolves to whatever the
     distro ships on Linux/Android (DejaVu, Liberation, Nimbus), which reads as
     dated; naming the modern UI faces first means a machine that has Segoe,
     SF, Roboto or Inter gets it, and only a bare box falls through. */
  :root { --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
    Inter, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code",
    "JetBrains Mono", Menlo, Consolas, monospace; }
  body { margin: 0; font: 15px/1.5 var(--sans);
         display: flex; flex-direction: column; height: 100dvh;
         /* Antialiased so the modern faces don't read as chunky on macOS. */
         -webkit-font-smoothing: antialiased; }
  /* One exception to the fixed-height column: the index is a document, so the
     page itself scrolls. Pinning it to 100dvh with an inner scroller is what hid
     the rows past the fold on a phone, where the browser shows no scrollbar until
     something is already moving. */
  body.indexing { height: auto; min-height: 100dvh; }
  /* One page per conversation: no list beside it. The header carries the way back
     and the conversation's name, which is all the context the pane needs. */
  /* `min-width: 0` because a flex item's automatic minimum is its content: without
     it the conversation refuses to narrow and pushes the drawer off the edge. */
  #app { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #app[hidden] { display: none; }
  /* Header, log and composer share one column so the title sits over the
     conversation rather than off at the edge of a wide window. */
  #conv-header { display: flex; align-items: center; gap: .5rem; flex: none;
    padding: .35rem max(.6rem, calc((100% - var(--content)) / 2));
    border-bottom: 1px solid #8884; }
  #conv-header #back { text-decoration: none; color: inherit; font-size: 1.15rem;
    padding: .3rem .5rem; border-radius: .5rem; line-height: 1; }
  #conv-header #back:hover { background: #8882; }
  #conv-title { flex: 1; min-width: 0; font-size: .92em; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The artifacts toggle lives in the header on this page: a floating button would
     sit on top of the Send button, which is exactly where a thumb lands. */
  #artifacts-toggle { padding: .35rem .55rem; border-radius: .5rem; font-size: 1rem;
    border: 1px solid #8886; background: #8883; cursor: pointer; }
  /* `min-height: 0` on both the pane and the log is what lets the conversation
     give up space when the composer grows. Without it a flex item refuses to
     shrink below its content, so the composer is pushed past the window instead
     of the log shrinking. */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* A conversation reads as one column, not as two people at opposite ends of a
     wide desk. Past `--content` the gutter grows instead of the gap between the
     bubbles, so on a 1920px screen the exchange is still a conversation. */
  #log { flex: 1; overflow: auto; word-break: break-word; margin: 0; min-height: 0;
    padding: 1rem max(1rem, calc((100% - var(--content)) / 2));
    /* Newer browsers keep the visible content still when things are inserted
       above it. Ours does the anchoring by hand as well (see `prependEarlier`),
       because this is the one place a failure is obvious to the reader. */
    overflow-anchor: auto; }
  /* The top of the transcript: a stop for turning the page backwards, and a
     status line while that page is in the air. It is the first child of #log, so
     it scrolls out of sight with the rest of the conversation rather than
     floating over it. */
  #earlier { display: block; margin: 0 auto 1rem; padding: .45rem 1rem; font: inherit;
    font-size: .85em; opacity: .8; color: inherit; background: #8882; border: 1px solid #8884;
    border-radius: 1rem; cursor: pointer; }
  #earlier:hover { filter: brightness(.96); }
  #earlier[hidden] { display: none; }
  #earlier.settled { cursor: default; opacity: .55; }
  #earlier.settled:hover { filter: none; }
  /* Chat-shaped rows: the agent on the left with a name, you on the right with
     just a time. Bubbles cap their width so long answers stay readable, and the
     colours follow the system scheme. */
  :root { --bubble-pi: #f1f2f4; --bubble-me: #d6e4fd; --bubble-code: Canvas;
    --content: 54rem;
    /* The composer's controls, in one place. `--accent` is the send action and
       nothing else, so "the blue button does the blue thing" holds wherever this
       page grows another control. `--control` is the neutral tone the secondary
       buttons share with the message box, so the row reads as one object rather
       than three unrelated pills.
       Radii and heights are tokens for the same reason: the row had four
       different corner treatments and two different heights, which is what made
       it look assembled rather than designed. */
    --accent: #2557d6; --accent-ink: #fff; --accent-hover: #1e4ac2;
    --control: #dfe8fb; --control-ink: #16244a; --control-hover: #cfdcf9;
    --radius-control: 1.5rem;   /* a pill: the composer's shape */
    --radius-inner: .5rem;      /* the notch on the trailing edge */
    /* The row's control height. A starting value only: `matchControlHeight()`
       overwrites it with the box's measured resting height on first paint, so the
       buttons follow the box instead of a number that drifts from it. */
    --control-h: 3.5rem; }
  @media (prefers-color-scheme: dark) { :root {
    --bubble-pi: #2a2b2e; --bubble-me: #24405f;
    --accent: #3d6ee8; --accent-ink: #fff; --accent-hover: #4a7bf5;
    --control: #223350; --control-ink: #dde6fb; --control-hover: #2b3f61;
    --bubble-code: #1b1c1f;
  } }
  #log .msg { display: flex; gap: .55rem; margin: 0 0 .9rem; align-items: flex-start; }
  #log .msg.me { flex-direction: row-reverse; }
  #log .msg > .col { display: flex; flex-direction: column; min-width: 0; max-width: min(46rem, 86%); }
  #log .msg.me > .col { align-items: flex-end; }
  #log .meta { display: flex; gap: .4rem; align-items: baseline; margin: 0 0 .15rem .15rem;
    font-size: .78em; opacity: .65; }
  #log .meta .name { font-weight: 600; }
  #log .msg.me .meta { margin: 0 .15rem .15rem 0; }
  #log .bubble { border-radius: 1rem; padding: .55rem .85rem; overflow-x: auto; }
  #log .msg.pi .bubble { background: var(--bubble-pi); border-top-left-radius: .3rem; }
  #log .msg.me .bubble { background: var(--bubble-me); border-top-right-radius: .3rem; }
  #log .live .bubble { outline: 1px dashed #8884; }
  /* The live turn's status: which tool is running, or "thinking" before any text
     arrives. Chat shows the same thing inside the message it is editing, and so
     does this — inside the bubble, in the bubble's colours, so the reply and what
     it is doing read as one object. */
  #log .bubble .status { font: .82em var(--mono);
    opacity: .75; white-space: pre-wrap; word-break: break-word; }
  #log .bubble .status + * { margin-top: .5rem; }
  /* The live turn, in the order it was said: what the turn has already covered, then
     the message being generated, then the status line. Each is its own block so a
     paragraph the model has moved on from stays where it was read, and a tool run is
     visible under the words that announced it rather than in place of them. */
  #log .bubble .said + .current,
  #log .bubble .said + .status,
  #log .bubble .current + .status { margin-top: .7rem; }
  #log .bubble .status { margin-top: .5rem; }
  #log .images { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  #log .images img { max-width: min(24rem, 100%); max-height: 24rem; border-radius: .6rem; display: block; }
  #log .bubble > .body:not(:empty) + .status { margin-top: .5rem; }
  /* Rendered markdown. The HTML comes from the server's escape-first renderer,
     so every tag here is ours; these rules only make it readable in a pane. */
  /* Code and quotes sit on the page colour, like Chat's own code blocks. */
  #log .bubble pre { background: var(--bubble-code); }
  #log .body > :first-child { margin-top: 0; }
  #log .body > :last-child { margin-bottom: 0; }
  #log .body p, #log .body ul, #log .body ol { margin: .5rem 0; }
  #log .body h1, #log .body h2, #log .body h3, #log .body h4 { margin: .9rem 0 .4rem; line-height: 1.25; }
  #log .body h1 { font-size: 1.25em; } #log .body h2 { font-size: 1.15em; } #log .body h3 { font-size: 1.05em; }
  #log .body code { font-family: var(--mono); font-size: .9em;
    background: #8881; padding: .1em .3em; border-radius: 3px; }
  #log .body pre { background: #8881; padding: .6rem .75rem; border-radius: 6px; overflow-x: auto; margin: .6rem 0; }
  #log .body pre code { background: none; padding: 0; }
  #log .body ul, #log .body ol { padding-left: 1.3rem; }
  #log .body blockquote { margin: .6rem 0; padding-left: .8rem; border-left: 3px solid #8886; opacity: .85; }
  #log .body table { border-collapse: collapse; margin: .6rem 0; display: block; overflow-x: auto; }
  #log .body th, #log .body td { border: 1px solid #8886; padding: .3rem .5rem; text-align: left; vertical-align: top; }
  #log .body th { background: #8882; }
  #log .body hr { border: 0; border-top: 1px solid #8886; margin: 1rem 0; }
  #log .body a { color: inherit; }
  #tool { padding: .25rem 1rem; font: 12px var(--mono); opacity: .7; min-height: 1.6em; }
  /* The button sits on the baseline of the box, not stretched to its full
     height, so a grown textarea does not drag it into a tall slab. */
  form { display: flex; gap: .5rem; border-top: 1px solid #8883; align-items: flex-end;
    padding: .75rem max(.75rem, calc((100% - var(--content)) / 2)); }
  /* Controls sit on the box's baseline at its resting height, and stay there as it
     grows. `--control-h` is measured from the box itself (see `matchControlHeight`)
     rather than guessed: a textarea's height comes from its line-height, padding
     and an inline height set by `fitBox`, so any constant drifts the moment the
     font or the padding changes — which is how the row ended up ragged twice. */
  form > button, #send-group { min-height: var(--control-h); }
  /* The box is shaped like the message it becomes: same colour, radius and
     padding as a `me` bubble, with the tighter corner on the trailing side. The
     send button matches it, so the composer and the sent message read as the
     same object before and after pressing send.
     Starts at one comfortable line and grows with the message (see fitBox).
     Past 40vh it stops and scrolls — a long paste should stay readable
     without pushing the whole conversation off the screen. */
  /* The box is a normal rounded field; its height is whatever one line needs, and
     `fitBox()` grows it from there. The composer's other controls match *it* rather
     than the reverse — deriving the box's padding from a target height went wrong
     because `scrollHeight` already counts padding, so the box doubled it and sat
     20px taller than the buttons beside it. */
  textarea { flex: 1; resize: none; max-height: 40vh; overflow-y: auto;
    font: inherit; color: var(--control-ink); background: var(--control); border: 0;
    border-radius: var(--radius-control); border-top-right-radius: var(--radius-inner);
    line-height: 1.5; padding: .7rem 1rem; }
  textarea::placeholder { color: color-mix(in srgb, var(--control-ink) 45%, transparent); }
  /* Focus is a ring in the accent, not a browser outline: it matches the send
     button, so "this is the thing I am in" is the same colour as "this is the
     thing I press". */
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    outline-offset: 1px; }
  /* `flex: none` because the textarea's flex:1 will otherwise squeeze the button
     until its label overflows the pill — visible as soon as the box is wide. */
  button { flex: none; white-space: nowrap; padding: .6rem 1.1rem; font: inherit;
    color: inherit; background: var(--bubble-me); border: 0; border-radius: 1rem;
    border-top-right-radius: .3rem; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  /* A control in the composer row: the neutral pill, sized and rounded the same
     as the box it sits beside. The attach button is the one that got this wrong
     — a smaller radius and a different height, so it looked borrowed from another
     part of the page. */
  form > button {
    display: flex; align-items: center; justify-content: center;
    background: var(--control); color: var(--control-ink);
    border-radius: var(--radius-control); border-top-right-radius: var(--radius-inner);
    padding: 0; width: var(--control-h); font-size: 1.1rem; line-height: 1;
  }
  form > button:hover { filter: none; background: var(--control-hover); }
  /* Artifacts: a floating toggle and a drawer that is hidden until asked for.
     The pane is an iframe on the artifact origin — a different origin, so it is
     sandboxed there and cannot reach this page's DOM or cookies. */
  /* The index: recent conversations, newest first, paged.
     It scrolls with the page, not inside a box of its own. A fixed-height
     `overflow: auto` pane on a phone hides its scrollbar (mobile browsers draw
     them only while scrolling), so the list and — crucially — the pager below it
     looked like the end of the content. With the document scrolling, the last row
     and the pager are simply the end of the page. */
  #index { padding: 1.5rem 1.25rem 6rem; }
  /* Wide enough for a title at any window: `max-width` alone left the rows' rules
     stopping mid-screen on a desktop. */
  #index > * { max-width: 46rem; margin-inline: auto; }
  #index h1 { font-size: 1.1rem; margin: 0 auto 1rem; font-weight: 600; }
  #index-list { list-style: none; margin: 0 auto; padding: 0; }
  #index-list li { padding: .6rem .75rem; border-bottom: 1px solid #8882; cursor: pointer;
    display: flex; gap: .75rem; align-items: baseline; }
  #index-list li:hover { background: #8881; }
  #index-list li .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A date, not a full timestamp: at phone width "Nov 2, 7:33 AM" is wide enough
     to ellipsise every title to two words. The time is in the row's title. */
  #index-list li .when { flex: none; font-size: .8em; opacity: .6; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  #index-pager { display: flex; gap: .5rem; align-items: center; margin: 1rem auto 0;
    font-size: .85em; opacity: .85; }
  #index-pager span { flex: 1; opacity: .7; }
  #index-pager button:disabled { opacity: .4; cursor: default; }
  #index-pager button:disabled:hover { filter: none; }
  /* A command's answer, above the composer and *outside* the transcript: `paint()` rebuilds the log
     from the transcript on every frame, so anything appended there would vanish on the next one. It
     is also the honest place — this is the application answering a question, not a message in the
     conversation. */
  #command-panel { margin: .5rem .75rem 0; border: 1px solid #8884; border-radius: .6rem;
    background: color-mix(in srgb, CanvasText 4%, Canvas); overflow: hidden; }
  #command-panel[hidden] { display: none; }
  #command-panel .head { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem;
    border-bottom: 1px solid #8883; font-size: .85em; font-weight: 600; }
  #command-panel .head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #command-panel .head button { padding: 0 .35rem; border: 0; background: none; cursor: pointer;
    color: inherit; opacity: .7; font-size: 1em; }
  #command-body { padding: .4rem .6rem .55rem; max-height: 40vh; overflow: auto; }
  #command-body p { margin: .2rem 0; white-space: pre-wrap; font-size: .95em; }
  #command-body ul { list-style: none; margin: 0; padding: 0; }
  #command-body li { margin: .15rem 0; }
  /* A row or an option is a button: anything with a command behind it is something to press. */
  #command-body .row { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem;
    width: 100%; text-align: left; padding: .35rem .45rem; border-radius: .45rem;
    border: 1px solid transparent; background: none; color: inherit; cursor: default; font: inherit; }
  #command-body .row.clickable { cursor: pointer; border-color: #8884; }
  #command-body .row.clickable:hover { background: color-mix(in srgb, CanvasText 8%, Canvas); }
  #command-body .row.current { border-color: color-mix(in srgb, CanvasText 30%, transparent); }
  #command-body .row .detail { font-size: .8em; opacity: .7; }
  #command-body form { display: flex; flex-direction: column; gap: .5rem; margin: .2rem 0 0; }
  #command-body label { display: flex; flex-direction: column; gap: .2rem; font-size: .85em; }
  #command-body select, #command-body input { font: inherit; padding: .3rem .4rem; border-radius: .4rem;
    border: 1px solid #8886; background: Canvas; color: inherit; }
  #command-body .hint { font-size: .78em; opacity: .65; }
  #command-body .actions { display: flex; gap: .5rem; }
  /* Attached images waiting to be sent, above the composer. Same strip whether
     they came from the clipboard, the file picker or a drop: to the person they
     are one thing — what this message carries. */
  #attachments { display: flex; gap: .5rem; padding: .5rem .75rem 0; flex-wrap: wrap; }
  #attachments[hidden] { display: none; }
  #attachments figure { margin: 0; position: relative; }
  #attachments img { height: 4rem; border-radius: .5rem; display: block; }
  #attachments figure > button { position: absolute; top: -.4rem; right: -.4rem; padding: 0;
    width: 1.25rem; height: 1.25rem; font-size: .7rem; line-height: 1; border-radius: 50%;
    border: 1px solid #8886; background: Canvas; cursor: pointer; }
  /* Attach: the file picker's button, shaped like the send button beside it. */
  /* The attach button is a square the height of the box now (see `form > button`),
     so it is sized by `width`, not by padding. Kept as its own rule for the icon
     size, which padding cannot express. */
  #attach { font-size: 1.1rem; }
  /* Send, split: the label sends, the caret opens the format menu.
     One control, not two, because sending is the action and the format is a
     property *of* it — a separate pill beside Send made them look like siblings
     when one is the verb and the other is a setting. The two halves share a
     background and a border so they read as one pill, with a hairline where the
     caret begins, and the composer's tight corner is on the caret's trailing edge
     so the shape closes the way the box does. */
  #send-group { display: flex; flex: none; align-items: stretch;
    border-radius: var(--radius-control); border-top-right-radius: var(--radius-inner);
    overflow: hidden; background: var(--accent); color: var(--accent-ink);
    /* A soft lift, so the one saturated object in the row reads as the action
       rather than as another field. */
    box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  #send-group button { border-radius: 0; background: none; color: inherit;
    padding: 0 1.25rem; font-weight: 550; letter-spacing: .01em; }
  /* The seam between the halves. It is the caret's leading border, so it moves
     with the caret and the two halves never drift apart; drawn in the ink colour
     at low alpha, it reads as a division of one surface rather than a stroke
     between two. */
  #send-group #send-menu { padding: 0 .85rem; display: flex; align-items: center;
    border-left: 1px solid color-mix(in srgb, var(--accent-ink) 30%, transparent); }
  /* A CSS triangle: the caret in the reference is a solid glyph, and a border
     triangle scales with font-size without shipping an image or a font dependency. */
  #send-caret { display: block; width: 0; height: 0; font-size: 1rem;
    border-left: .28em solid transparent; border-right: .28em solid transparent;
    border-top: .34em solid currentColor; }
  /* Open: the caret points at what it opened. Rotating the same triangle rather
     than swapping glyphs keeps one element and one animation. */

  #send-caret { transition: transform .12s ease; }
  @media (prefers-reduced-motion: reduce) { #send-caret { transition: none; } }
  /* Hover and focus apply to the half under the pointer, not the whole group: a
     shared highlight would suggest pressing either half does the same thing. */
  /* Hover is a real colour, not a filter: `brightness()` on a saturated blue
     washes it toward grey, which is why the row looked faded at rest. */
  #send-group button:hover { background: var(--accent-hover); }
  #send-group button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent-ink) 70%, transparent);
    outline-offset: -4px; }
  /* Open: the caret's half stays lit while its menu is showing, so the popup is
     never detached from the button that opened it. */
  #send-group #send-menu[aria-expanded="true"] { background: var(--accent-hover); }
  /* What will answer, said once, under the caret — the menu's header names the
     current format so the popup is never a list of models with no context. */
  #picker .format-now { padding: .6rem .8rem; font-size: .85em; line-height: 1.4;
    background: color-mix(in srgb, CanvasText 3%, Canvas); opacity: .9; }
  #picker .format-now b { font-weight: 600; }
  /* The section labels are the popup's only structure, so they are spaced as
     headings rather than floated as faint text. */
  #picker .section { padding: .7rem .8rem .25rem; font-size: .7em; text-transform: uppercase;
    letter-spacing: .06em; opacity: .5; font-weight: 600; }
  #picker #picker-thinking-heading { border-top: 1px solid #8883; margin-top: .25rem; }
  /* The picker: one element, two presentations. On a wide screen it is a small
     box anchored to the pills; on a phone it takes the screen, because a dropdown
     under a thumb is a pointer game and the list can be forty models long.
     `position: fixed` rather than absolute so the popup is not clipped by the
     composer's `overflow`, and the coordinates come from the button's own rect
     (see placePicker). */
  /* `height` as well as `max-height`: with only a max, the flex children size to
     content and the list never becomes the scroller — it just gets clipped by the
     container. A definite height is what gives `flex: 1` something to divide. */
  #picker { position: fixed; z-index: 30; display: flex; flex-direction: column;
    min-width: 16rem; max-width: min(28rem, calc(100vw - 1.5rem));
    max-height: min(70vh, 34rem); background: Canvas; color: CanvasText;
    border: 1px solid #8884; border-radius: .75rem; overflow: hidden;
    /* Two shadows, not one: a tight edge to sit the popup on the page and a wide
       soft one to lift it. A single mid-blur shadow reads as a grey halo. */
    box-shadow: 0 1px 2px #0002, 0 .75rem 2rem #0000001f; }
  #picker[hidden] { display: none; }
  #picker .search { display: flex; padding: .5rem; border-bottom: 1px solid #8883; }
  #picker .search[hidden] { display: none; }
  #picker .search input { flex: 1; min-width: 0; font: inherit; padding: .4rem .55rem;
    border-radius: .45rem; border: 1px solid #8886; background: Canvas; color: inherit; }
  /* The list scrolls, not the popup: the search box has to stay put while a long
     list is scrolled, or typing buries itself. */
  /* Only the model list scrolls: it is the long one, and it is the one being
     searched. The thinking list sizes to its handful of rows, so it never eats the
     space the models need — two `flex: 1` lists fight for height and neither ends
     up scrolling, which showed as a cl:ipped model row and a popup off-screen. */
  /* Every non-scrolling child is `flex: none`, so the container's max-height is
     spent on the list rather than shared out among headers — without this the
     headings shrank and the list overflowed the popup instead of scrolling. */
  #picker > * { flex: none; }
  #picker ul { list-style: none; margin: 0; padding: .25rem; }
  /* The scroll window. Capped in vh so a deployment with forty models still shows a
     popup that fits on screen, and the text search is the way through the rest. */
  #picker #picker-list { overflow: auto; flex: 1 1 auto; min-height: 0; }
  /* A level list is never long; cap it anyway so a model with many levels cannot
     push the popup past the viewport. */
  #picker #picker-levels { overflow: auto; max-height: 12rem; flex: none; }
  #picker .item { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem;
    width: 100%; text-align: left; padding: .55rem .65rem; border: 1px solid transparent;
    border-radius: .5rem; background: none; color: inherit; cursor: pointer; font: inherit; }
  /* Hover is the composer's own neutral, so the popup and the row it came from
     share a palette instead of the popup having a private set of greys. */
  #picker .item:hover, #picker .item:focus-visible {
    background: color-mix(in srgb, var(--accent) 9%, transparent); }
  #picker .item:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
    outline-offset: -2px; }
  /* The current one is marked twice — a tint and a tick in the accent — because
     colour alone is not a signal somebody can read on a phone in sunlight. */
  #picker .item.current { background: color-mix(in srgb, var(--accent) 7%, transparent);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  #picker .item .name { display: flex; align-items: center; gap: .4rem; width: 100%; }
  #picker .item .name span:first-child { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #picker .item .tick { flex: none; color: var(--accent); font-weight: 700; }
  #picker .item .detail { font-size: .78em; opacity: .65; }
  #picker .empty { padding: .6rem; font-size: .9em; opacity: .7; }
  /* Tapping outside closes, which is what a popup teaches people to expect. It
     covers the page but not the picker, so the picker stays interactive. */
  #picker-scrim { position: fixed; inset: 0; z-index: 29; background: transparent; }
  #picker-scrim[hidden] { display: none; }
  /* Why an attachment did not make it — a file that is not an image, or one too
     big to send. Above the composer, where the thumbnails would have appeared, so
     the message is attached to the thing that was refused rather than to the
     conversation. */
  #attach-notice { padding: .35rem .75rem 0; font-size: .85em; opacity: .85;
    color: color-mix(in srgb, CanvasText 75%, #d33); }
  #attach-notice[hidden] { display: none; }
  /* Drop target: the whole pane lights up, because dropping on a strip two
     centimetres tall is a game, and people drag onto the conversation. */
  #pane.dropping { outline: 2px dashed color-mix(in srgb, CanvasText 35%, transparent);
    outline-offset: -4px; border-radius: .5rem; }
  #new-chat { position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
    width: 2.75rem; height: 2.75rem; padding: 0; border-radius: 50%; font-size: 1.3rem;
    border: 1px solid #8886; background: var(--bubble-me); cursor: pointer; }
  #artifacts-toggle[hidden] { display: none; }
  /* The drawer is a column of the layout, not an overlay: opening it narrows the
     conversation instead of burying it. As an overlay the pane stayed centred on
     the *window*, so on anything less than very wide the middle of every answer
     sat under the panel while empty space remained to the left of it. */
  #workspace { flex: 1; display: flex; min-width: 0; min-height: 0; }
  #artifacts { flex: none; display: flex; flex-direction: column; background: Canvas;
    width: var(--artifacts-width, min(38rem, 45%)); border-left: 1px solid #8886;
    position: relative; }
  #artifacts[hidden] { display: none; }
  /* Drag the left edge to resize. Wide enough to hit with a thumb, invisible
     until you are over it. */
  #artifacts-resize { position: absolute; top: 0; bottom: 0; left: -4px; width: 9px;
    cursor: col-resize; touch-action: none; z-index: 1; }
  #artifacts-resize:hover, #artifacts.resizing #artifacts-resize { background: #8885; }
  /* Mid-drag, the whole page is the handle: no text selecting under the pointer. */
  body.resizing { cursor: col-resize; user-select: none; }
  #artifacts header { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem;
    border-bottom: 1px solid #8884; font-size: .9em; }
  #artifacts header strong { flex: 1; font-weight: 600; }
  #artifacts header button { padding: .15rem .5rem; }
  /* Two screens in one drawer: the list, and the document it opens. The document
     slides in from the right and covers the drawer, so a file gets the whole
     width instead of a strip under a list of names. */
  #artifacts-body { flex: 1; position: relative; min-height: 0; }
  #artifact-list-pane { position: absolute; inset: 0; overflow: auto; }
  #artifact-list { margin: 0; padding: 0; list-style: none; }
  #artifact-list li { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #8882;
    display: flex; gap: .6rem; align-items: baseline; }
  #artifact-list li:hover { background: #8881; }
  #artifact-list li.on { background: #8882; }
  /* The file's name is what you pick by; the directory rides underneath, dimmed,
     for the ones that share a name. */
  #artifact-list .col { flex: 1; min-width: 0; }
  #artifact-list .name { display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #artifact-list .dir { display: block; font-size: .78em; opacity: .55; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #artifact-list .counts { flex: none; font-size: .78em; opacity: .55; }
  #artifact-doc { position: absolute; inset: 0; display: flex;
    transform: translateX(100%); transition: transform 180ms ease; background: Canvas; }
  #artifacts.showing-doc #artifact-doc { transform: translateX(0); }
  #artifact-frame { flex: 1; border: 0; width: 100%; background: #fff0; }
  #artifact-hint { padding: .5rem .75rem; font-size: .85em; opacity: .7; margin: 0; }
  /* Review comments. The bar sits at the foot of the drawer rather than floating
     over the selection: it is one place for all comment chrome, it cannot cover
     the text being commented on, and on a phone the keyboard pushes it up. */
  #comment-bar, #comment-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    background: Canvas; border-top: 1px solid #8886; box-shadow: 0 -6px 24px #0002;
    padding: .6rem .75rem; display: flex; flex-direction: column; gap: .45rem;
    max-height: 70%; overflow: auto; }
  #comment-bar[hidden], #comment-sheet[hidden] { display: none; }
  #comment-bar .addr, #comment-sheet .addr { font: .78em var(--mono, monospace); opacity: .75;
    display: flex; gap: .5rem; align-items: baseline; }
  #comment-bar .addr span, #comment-sheet .addr span { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #comment-bar .quote, #comment-sheet .quote { margin: 0; padding: .3rem .5rem; border-left: 3px solid #8886;
    font: .82em var(--mono, monospace); opacity: .85; max-height: 6em; overflow: auto;
    white-space: pre-wrap; word-break: break-word; }
  #comment-text, #comment-reply { width: 100%; box-sizing: border-box; min-height: 3.2em;
    resize: vertical; font: inherit; padding: .45rem .55rem; border-radius: .5rem;
    border: 1px solid #8886; background: Field; color: FieldText; }
  .comment-actions { display: flex; gap: .5rem; align-items: center; }
  .comment-actions button { padding: .35rem .7rem; border-radius: .5rem; }
  .comment-actions .spacer { flex: 1; }
  #comment-error { color: #c33; font-size: .85em; margin: 0; }
  #comment-thread { display: flex; flex-direction: column; gap: .5rem; }
  .comment-turn { display: flex; flex-direction: column; gap: .2rem; }
  .comment-turn .who { font-size: .75em; opacity: .6; }
  .comment-turn .said { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .comment-turn.answer .said { background: #8881; border-radius: .5rem; padding: .4rem .55rem; }
  .comment-turn.note .said { border-left: 3px solid #8886; padding-left: .5rem; opacity: .9; }
  .comment-open { display: flex; align-items: center; gap: .5rem; font-size: .8em; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { #artifact-doc { transition: none; } }
  /* Phones: the index is the whole width, the pane keeps its padding, and the
     drawer takes the screen rather than a strip of it. */
  @media (max-width: 40rem) {
    body { font-size: 16px; }               /* stops iOS zooming on focus */
    #index { padding: 1rem .75rem 5rem; }
    #index h1 { font-size: 1rem; }
    #index-list li { padding: .7rem .25rem; }
    /* The pager is the only way to see past the first page, so on a phone it is
       a full-width pair of buttons rather than small text at the foot of a list. */
    #index-pager { margin-top: .75rem; }
    #index-pager button { flex: 1; padding: .6rem .5rem; }
    #index-pager span { flex: none; order: -1; opacity: .6; }
    #log { padding: .6rem .75rem; }
    #log .msg > .col { max-width: 92%; }
    #log .msg { gap: .4rem; }
    #pane { min-height: 0; }
    form { padding: .5rem; gap: .4rem; }
    textarea { padding: .6rem .8rem; }
    button { padding: .55rem .85rem; }
    #attachments img { height: 3.2rem; }
    #attach { font-size: 1rem; }
    /* The picker becomes a sheet: full width, up from the bottom edge, tall
       enough to be a list rather than a peek. Anchoring it to a button is
       pointless under a thumb, and a 60vh box floating mid-screen wastes the
       half of the screen it is not using. */
    #picker { left: 0; right: 0; bottom: 0; top: auto; max-width: none; min-width: 0;
      max-height: 78vh; border-radius: .9rem .9rem 0 0; border-bottom: 0; }
    /* Roomier rows: a 2.5rem target is comfortable, a 1.8rem one is a coin toss. */
    #picker .item { padding: .7rem .75rem; }
    #picker ul { padding-bottom: max(.4rem, env(safe-area-inset-bottom)); }
    /* A split button is one control, so it still fits beside the box on a phone
       without a second line: the caret is the only extra width it costs. The box
       takes the remaining space and the send group keeps its natural size. */
    #send-group { flex: none; }
    /* Narrower, not shorter: the height is the shared control height, so the whole
       row still lines up. */
    #send-group button { padding: 0 .9rem; }
    #send-group #send-menu { padding: 0 .65rem; }
    #artifacts { position: fixed; inset: 0; width: 100%; border-left: 0; }
    #artifacts-resize { display: none; }
    #new-chat { right: .75rem; bottom: .75rem; }
  }
</style>
</head>
<body>
<section id="index" hidden>
  <h1>Conversations</h1>
  <ul id="index-list"></ul>
  <nav id="index-pager" hidden>
    <button id="index-newer" type="button">Newer</button>
    <span id="index-range"></span>
    <button id="index-older" type="button">Older</button>
  </nav>
</section>
<div id="workspace">
<div id="app" hidden>
  <header id="conv-header">
    <a id="back" href="./" title="All conversations" aria-label="All conversations">←</a>
    <span id="conv-title"></span>
    <button id="artifacts-toggle" title="Files this conversation wrote" hidden aria-label="Artifacts">🗂</button>
  </header>
  <div id="pane">
  <div id="log"></div>
  <div id="tool"></div>
    <div id="command-panel" hidden>
      <div class="head">
        <span id="command-title"></span>
        <button type="button" id="command-close" title="Close" aria-label="Close">✕</button>
      </div>
      <div id="command-body"></div>
    </div>
    <div id="attachments" hidden></div>
    <p id="attach-notice" hidden role="status" aria-live="polite"></p>
    <form id="send">
      <textarea id="text" placeholder="Message…" aria-label="Message this conversation"></textarea>
      <!-- The file picker behind the attach button: hidden, but still focusable
           via the label-free button that opens it, so the keyboard path is not
           lost. `accept` filters the dialog; the type is checked again on the
           way in, because a picker's filter is a hint, not a guarantee. -->
      <input id="attach-input" type="file" accept="image/*" multiple hidden>
      <button id="attach" type="button" title="Attach an image" aria-label="Attach an image">📎</button>
      <!-- Send, with the format behind a caret on its trailing edge: a split
           button. Sending is what the button is for, so it stays one button and
           keeps its size; what will answer is a property *of* sending, which is
           why it lives under the caret rather than beside it. The trailing corner
           keeps the composer's tighter radius all the way across. -->
      <div id="send-group">
        <button id="send-primary" type="submit">Send</button>
        <button id="send-menu" type="button" aria-haspopup="dialog" aria-expanded="false"
                title="Model and thinking level" aria-label="Choose model and thinking level">
          <span id="send-caret" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>
</div>
<!-- One picker for both buttons. Which list it shows is decided at open time,
     so the two never drift apart and there is one close path to get right. -->
<div id="picker-scrim" hidden></div>
<div id="picker" hidden role="dialog" aria-modal="false" aria-label="Model and thinking level">
  <div class="search" hidden>
    <input id="picker-search" type="search" placeholder="Search models…"
           aria-label="Search models" autocomplete="off">
  </div>
  <!-- Both lists live in one menu, model first: the caret opens "what will answer",
       and the thinking level is part of that answer rather than a second place to
       look. One popup, so there is never two of them open at once. -->
  <p class="format-now" id="picker-now"></p>
  <p class="section" id="picker-model-heading">Model</p>
  <ul id="picker-list" role="listbox" aria-labelledby="picker-model-heading"></ul>
  <p class="section" id="picker-thinking-heading" hidden>Thinking</p>
  <ul id="picker-levels" role="listbox" aria-labelledby="picker-thinking-heading" hidden></ul>
</div>
<button id="new-chat" title="Start a new conversation" aria-label="New chat">＋</button>
<aside id="artifacts" hidden>
  <div id="artifacts-resize" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <header>
    <button id="artifacts-back" type="button" title="Back to the list" aria-label="Back to the list" hidden>←</button>
    <strong id="artifacts-title">Artifacts</strong>
    <button id="artifacts-newtab" type="button" title="Open in a new tab" hidden>↗</button>
    <button id="artifacts-close" type="button" title="Close">✕</button>
  </header>
  <div id="artifacts-body">
    <div id="artifact-list-pane">
      <p id="artifact-hint">Pick a file.</p>
      <ul id="artifact-list"></ul>
    </div>
    <div id="artifact-doc">
      <iframe id="artifact-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
      <!-- Composing a comment on a selection, from inside the framed document.
           The document can only *report* a selection; this is where it becomes
           a message, because this origin is the one allowed to send. -->
      <div id="comment-bar" hidden>
        <div class="addr"><span id="comment-addr"></span></div>
        <p class="quote" id="comment-quote" hidden></p>
        <textarea id="comment-text" placeholder="Comment on this…" rows="2"></textarea>
        <p id="comment-error" hidden></p>
        <div class="comment-actions">
          <button type="button" id="comment-send">Comment</button>
          <button type="button" id="comment-cancel">Cancel</button>
        </div>
      </div>
      <!-- One comment's thread: what was said, what came back, and resolve. -->
      <div id="comment-sheet" hidden>
        <div class="addr"><span id="comment-sheet-addr"></span><button type="button" id="comment-sheet-close" title="Close">✕</button></div>
        <p class="quote" id="comment-sheet-quote" hidden></p>
        <div id="comment-thread"></div>
        <textarea id="comment-reply" placeholder="Reply in this thread…" rows="2"></textarea>
        <div class="comment-actions">
          <button type="button" id="comment-reply-send">Reply</button>
          <span class="spacer"></span>
          <button type="button" id="comment-resolve">Resolve</button>
        </div>
      </div>
    </div>
  </div>
</aside>
</div>
<script>
/**
 * A URL relative to wherever this page was served from.
 *
 * The base tag handles the normal case, but it resolves against the full URL,
 * so at "/pi" (no trailing slash) a relative path becomes "/api/x" -- the
 * proxy's root, not the app's. Appending the slash first makes both "/pi" and
 * "/pi/" work.
 */
/**
 * Resolve an API path against this page's own directory.
 *
 * The page may be served at /web, /pi/web or /pi/web/, depending on the reverse
 * proxy, so no URL here is absolute. 'api/...' from a page at /pi/web resolves
 * to /pi/api/... which is wrong -- hence the explicit base of the directory the
 * page was served *from*, normalised to end in '/'.
 */
/**
 * The mount root: "/" here, "/pi/" behind a proxy that keeps its prefix.
 *
 * A conversation page lives at `/<id>/`, so the document's own directory is one
 * level too deep for API paths — `rel()` has to resolve against the mount, not
 * against where this document happens to sit.
 */
function mountRoot() {
  const path = location.pathname;
  const conversation = /^(.*?)(?:\d+)\/?$/.exec(path);
  if (conversation) return conversation[1];
  const web = /^(.*?)\/web\/?$/.exec(path);
  if (web) return web[1];
  return path.endsWith('/') ? path : path + '/';
}

function rel(path) {
  return mountRoot() + path;
}

/** The conversation id this page is showing, from the URL. */
function conversationIdFromPath() {
  const match = /(\d+)\/?$/.exec(location.pathname);
  return match ? Number(match[1]) : undefined;
}

// State for the single open conversation. Declared here because the functions
// below assign them: without these the first click threw
// "ReferenceError: source is not defined" and the pane stayed blank.
let current;
let source;
/** Pending reconnect for a stream the browser has given up on. */
let reconnectTimer;
/** Consecutive failed attempts, for the backoff. Reset when a stream opens. */
let reconnectAttempts = 0;
/** When the open stream last proved it was alive (a frame, or the server's keepalive). */
let lastFrameAt = 0;
/** Watches for silence on a stream that never errored. */
let livenessTimer;
const log = document.getElementById('log');
const tool = document.getElementById('tool');
const textBox = document.getElementById('text');

// The transcript so far, as the host bounded it, and the answer in flight.
// Both are painted into #log: transcript first, then the live text, so a reload
// mid-turn shows the conversation *and* the half-finished reply.
let transcript = [];
let liveText = '';
/** What this turn has already said, before the message now being generated. */
let turnText = '';
/** Its rendering, done server-side like `liveHtml`, so the page holds no renderer. */
let turnHtml = '';
let liveHtml = '';
let busy = false;
let statusLine = '';
// The page version this document was rendered from; compared on every (re)connect.
let pageVersion = '';
// One reload per page life: if the version somehow keeps changing, reloading in a
// loop would be worse than a stale page.
let reloadedForVersion = false;

/**
 * Draft text, kept per conversation.
 *
 * Saved on every keystroke so a reload — ours, or the browser's, or the device's —
 * does not lose what you were typing. Cleared when the message is actually sent.
 */
function draftKey(id) {
  return 'pi-draft:' + id;
}

function saveDraft() {
  if (!current) return;
  const box = document.getElementById('text');
  const text = box.value;
  try {
    if (text.trim() === '') localStorage.removeItem(draftKey(current));
    else localStorage.setItem(draftKey(current), text);
  } catch {
    // Private mode or a full quota: drafts are a convenience, not a feature to
    // fail over.
  }
}

function restoreDraft(id) {
  const box = document.getElementById('text');
  if (!id) {
    box.value = '';
    return;
  }
  try {
    box.value = localStorage.getItem(draftKey(id)) || '';
  } catch {
    box.value = '';
  }
  fitBox();
}

/** Fallback when a frame arrives without rendered HTML (an older server). */
function escapeText(text) {
  const holder = document.createElement('div');
  holder.textContent = text;
  return holder.innerHTML;
}

/**
 * A time as a chat shows one: the clock for today, "yesterday 3:13pm" before
 * that, and a date once it is older than that. The full timestamp is in the
 * element's title, so nothing is lost by being brief.
 *
 * `short` drops the clock from the date forms, for the index: a phone row has
 * room for "Nov 2" or a title, not both. The time is still in the row's title.
 */
function formatWhen(ms, short) {
  const at = new Date(ms);
  if (Number.isNaN(at.getTime())) return '';
  const now = new Date();
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sameDay = at.toDateString() === now.toDateString();
  if (sameDay) return time;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (at.toDateString() === yesterday.toDateString()) return 'yesterday ' + time;
  const sameYear = at.getFullYear() === now.getFullYear();
  const date = at.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' });
  return short ? date : date + ' ' + time;
}

/** One chat row: a name for pi, just a time for you. */
function messageRow(role, html, at, live, images) {
  const me = role === 'user';
  const block = document.createElement('div');
  block.className = 'msg ' + (me ? 'me' : 'pi') + (live ? ' live' : '');

  const col = document.createElement('div');
  col.className = 'col';

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!me) {
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = 'pi';
    meta.append(name);
  }
  const when = document.createElement('time');
  when.className = 'at';
  when.textContent = at ? formatWhen(at) : '';
  if (at) when.title = new Date(at).toLocaleString();
  meta.append(when);

  const bubble = document.createElement('div');
  bubble.className = 'bubble body';
  // Server-rendered markdown: the renderer escapes source before emitting any
  // tag, so this HTML is ours and cannot carry a script.
  bubble.innerHTML = html;

  // Inline images the renderer allowed (`![alt](api/c/<id>/image/<e>/<i>)`).
  //
  // The server emits the source exactly as the Markdown gave it, relative — it
  // deliberately refuses anything absolute, because a root-absolute path would
  // escape the mount a proxied page lives under. That leaves the path relative
  // to whatever this document's directory is, which on a conversation page
  // (`/web/1/`) is one level too deep, so it has to be rebased onto the mount
  // here, exactly as `rel()` does for every other URL on the page. Done as a
  // rewrite rather than by relaxing the renderer: the source stays relative, so
  // the same markup is still safe to serve from any mount.
  if (html.includes('<img ')) {
    for (const img of bubble.querySelectorAll('img')) {
      const src = img.getAttribute('src');
      if (!src || src.startsWith('data:')) continue;
      img.src = rel(src);
    }
  }

  // Images someone sent: fetched from this origin by entry and index, so the
  // transcript payload stays text.
  if (images && images.length && current) {
    const strip = document.createElement('div');
    strip.className = 'images';
    images.forEach((image, index) => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = image.mimeType || 'image';
      img.src = image.dataUrl || rel('api/c/' + current + '/image/' + image.entryId + '/' + index);
      strip.append(img);
    });
    if (strip.childElementCount > 0) bubble.append(strip);
  }

  col.append(meta, bubble);
  block.append(col);
  return block;
}

/**
 * Whether the conversation is scrolled to its end.
 *
 * Only then should it follow new content: reading transcript further up must not be
 * yanked to the bottom because a frame arrived or the composer grew.
 */
let atBottom = true;
const BOTTOM_SLACK_PX = 24;
/** How close to the top counts as "about to scroll past the beginning". */
const EARLIER_SLACK_PX = 240;
/**
 * Whether the log has been painted since this conversation opened.
 *
 * Before the first paint there is no position to scroll *from*: `scrollTop` is 0
 * while `paint()` is still about to jump to the bottom, so a `scroll` event in that
 * window is the browser settling, not a person asking for older messages. Without
 * this the pane fetched a second page on every open.
 *
 * `painted` rather than "is the box short" is what makes this both testable and
 * correct: a conversation shorter than the pane genuinely is at its bottom, and
 * treats itself as complete anyway because its first page came back short.
 */
let painted = false;

log.addEventListener('scroll', () => {
  atBottom = log.scrollHeight - log.scrollTop - log.clientHeight <= BOTTOM_SLACK_PX;
  // Prefetch by a comfortable margin rather than waiting for the literal top: the
  // page then lands before it is needed, so scrolling up feels continuous instead
  // of stopping at a spinner every fifty messages.
  //
  // The only guard needed is `painted`: before the first paint `scrollTop` is 0
  // while `paint()` is still about to jump to the bottom, and that is the browser
  // settling rather than a person asking for older messages. `loadEarlier` already
  // refuses when the history is complete or a page is in flight, so "is it at the
  // bottom" does not need testing here — and testing it would be wrong anyway,
  // since jsdom reports zero heights and so calls every position the bottom.
  if (painted && log.scrollTop <= EARLIER_SLACK_PX) void loadEarlier();
});

// Growing the composer shrinks the log, and the browser keeps the scroll offset —
// which leaves the newest message cut in half at the boundary. Re-anchor when the
// log's box changes and we were already at the end, so the conversation slides up
// to stay whole instead of being clipped.
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(() => {
    if (atBottom) log.scrollTop = log.scrollHeight;
  }).observe(log);
}

// --- Paging backwards through the transcript ---
//
// The pane opens at the newest messages and pulls older ones in as you scroll
// up, the way a chat app does. A long conversation is a thousand entries; sending
// all of them on open is a megabyte of JSON for a pane you are looking at the
// bottom of.
//
// The awkward part of prepending is that it moves everything down, so the text
// under your eyes jumps the moment a page lands. The fix is to measure
// `scrollHeight` before and after and add the difference to `scrollTop`, which
// keeps the pixel you were looking at exactly where it was.

/** How many messages a page holds. Small enough to feel instant, big enough
 *  that scrolling rarely waits. */
const HISTORY_PAGE = 50;

/** Messages loaded so far, oldest first. `transcript` is the same array. */
let historyComplete = false;
/** A page is in the air: a scroll must not ask for a second copy. */
let loadingEarlier = false;
/** How many messages the server has already given us, counting back from the end. */
/** The oldest entry id held, which every earlier page is anchored on. */
let beforeAnchor = 0;

const earlierButton = document.createElement('button');
earlierButton.type = 'button';
earlierButton.id = 'earlier';
earlierButton.hidden = true;
earlierButton.textContent = 'Earlier messages';
// The button is the accessible path; the scroll is the convenient one. Sending
// the same request from both is fine because `loadingEarlier` gates it.
earlierButton.addEventListener('click', () => void loadEarlier());
log.append(earlierButton);

/**
 * Mark the top of the log: another page to come, or the beginning.
 *
 * Three states, and the difference between them is what the reader can act on:
 *
 *   - **nothing loaded yet** — hidden. There is no conversation to page through.
 *   - **more to come** — a button, and the same request a scroll makes.
 *   - **at the beginning** — "Start of conversation", disabled. A disabled button
 *     rather than no button: a control that vanishes once used leaves the pane
 *     looking like it failed to load anything above.
 */
function paintEarlier() {
  if (transcript.length === 0) {
    earlierButton.hidden = true;
    return;
  }
  earlierButton.hidden = false;
  earlierButton.classList.toggle('settled', historyComplete);
  earlierButton.disabled = historyComplete || loadingEarlier;
  earlierButton.textContent = historyComplete
    ? 'Start of conversation'
    : loadingEarlier
      ? 'Loading earlier…'
      : 'Earlier messages';
}

/**
 * Insert older messages above what is already shown, without moving the reader.
 *
 * `scrollHeight` is read before the insert and again after it; the difference is
 * exactly how much taller the log became, and adding that to `scrollTop` puts the
 * same content back under the same pixel. Reading `scrollHeight` forces the
 * layout, which is why the two reads are on either side of one DOM write rather
 * than in a loop.
 */
function prependEarlier(older) {
  if (older.length === 0) return;
  const anchor = log.scrollHeight - log.scrollTop;
  transcript = [...older, ...transcript];
  // Built into a fragment and inserted after the button, so the header stays the
  // first child and the messages keep their order.
  const fragment = document.createDocumentFragment();
  for (const message of older) {
    fragment.append(
      messageRow(
        message.role,
        message.html || escapeText(message.text || ''),
        message.at,
        false,
        message.images ? message.images.map((image) => ({ ...image, entryId: message.entryId })) : undefined,
      ),
    );
  }
  earlierButton.after(fragment);
  log.scrollTop = log.scrollHeight - anchor;
}

/**
 * Fetch the page before the oldest one shown.
 *
 * Offset counts back from the *newest* message, so it grows by the number of
 * messages already held — not by pages:
 * a page can be short when the host drops entries with no text, and counting
 * pages would then re-request the same window forever.
 */
async function loadEarlier() {
  if (!current || loadingEarlier || historyComplete) return;
  loadingEarlier = true;
  paintEarlier();
  const id = current;
  try {
    const url = rel('api/c/' + id + '/history?limit=' + HISTORY_PAGE + '&before=' + beforeAnchor);
    const page = await (await fetch(url)).json();
    // The user may have switched conversations while this was in flight. Dropping
    // the page is right: its messages belong to a conversation that is no longer
    // on screen, and appending them would mix two transcripts.
    if (id !== current) return;
    const older = Array.isArray(page?.messages) ? page.messages : [];
    // The anchor moves to the oldest id now held, and `atStart` — not a short page — is what says
    // there is nothing older. A page can be short for reasons other than the beginning.
    if (older.length > 0) beforeAnchor = page?.before ?? older[0]?.entryId ?? beforeAnchor;
    historyComplete = page?.atStart === true || older.length === 0;
    prependEarlier(older);
  } catch {
    // Leave `historyComplete` alone so the next scroll tries again: a dropped
    // request should not look like the start of the conversation.
  } finally {
    if (id === current) {
      loadingEarlier = false;
      paintEarlier();
    }
  }
}

function paint() {
  log.innerHTML = '';
  log.append(earlierButton);
  for (const message of transcript) {
    log.append(
      messageRow(
        message.role,
        message.html || escapeText(message.text || ''),
        message.at,
        false,
        message.images ? message.images.map((image) => ({ ...image, entryId: message.entryId })) : undefined,
      ),
    );
  }
  // The live turn: the streaming answer, and the status of whatever is running.
  if (liveText || turnText || busy || statusLine) {
    // A turn is several messages: it says something, calls a tool, says something
    // else. Rendering only the message being generated meant each step *replaced*
    // the last — the paragraph you were reading vanished the instant the model
    // started on its next move, and "thinking…" took its place. So what the turn
    // has already said stays, and the live part is appended beneath it.
    const row = messageRow('assistant', '', undefined, true);
    const bubble = row.querySelector('.bubble');
    if (turnText) {
      const said = document.createElement('div');
      said.className = 'said';
      said.innerHTML = turnHtml || escapeText(turnText);
      bubble.append(said);
    }
    if (liveText) {
      const current = document.createElement('div');
      current.className = 'current';
      current.innerHTML = liveHtml || escapeText(liveText);
      bubble.append(current);
    }
    // The status is its own line *under* the text rather than a replacement for it,
    // so a tool run and the words that announced it are visible together.
    const status = document.createElement('div');
    status.className = 'status';
    // A tool line if one is running; otherwise "thinking…" only when there is
    // nothing being written. Text is arriving on the frames, so the stream itself is
    // the evidence of progress — printing "thinking…" under a message that is
    // actively growing would be noise competing with the answer.
    status.textContent = statusLine || (busy && !liveText ? 'thinking…' : '');
    if (status.textContent) bubble.append(status);
    log.append(row);
  }
  paintEarlier();
  if (atBottom) log.scrollTop = log.scrollHeight;
  else log.scrollTop = Math.min(log.scrollTop, log.scrollHeight);
  // From here on a `scroll` event is a person moving, not the browser settling.
  painted = true;
}

/**
 * The first page: the newest messages, painted at the bottom.
 *
 * `offset` restarts at zero on every open, because a new conversation means a new
 * transcript — carrying the previous one's counter over would ask for a window
 * measured against a different thread.
 */
async function loadHistory() {
  if (!current) return;
  beforeAnchor = 0;
  historyComplete = false;
  loadingEarlier = false;
  painted = false;
  const id = current;
  try {
    // No anchor: the newest page. Every page after this one is anchored on the oldest id held, so a
    // turn that appends while somebody is scrolling cannot shift it.
    const page = await (await fetch(rel('api/c/' + id + '/history?limit=' + HISTORY_PAGE + '&before=0'))).json();
    if (id !== current) return;
    transcript = Array.isArray(page?.messages) ? page.messages : [];
    beforeAnchor = page?.before ?? 0;
    historyComplete = page?.atStart === true || transcript.length === 0;
  } catch {
    if (id !== current) return;
    transcript = [];
  }
  paint();
}

function open(id) {
  if (source) source.close();
  current = id;
  transcript = [];
  liveText = '';
  liveHtml = '';
  busy = false;
  statusLine = '';
  log.innerHTML = '';
  tool.textContent = '';
  restoreDraft(id);
  void loadHistory();
  connectStream(id);
}

/**
 * Open — or reopen — the event stream for a conversation.
 *
 * Not left to the browser's own retry, which gives up permanently in exactly the cases that
 * matter: a tab left in the background, a phone that locked, a server answering 5xx while it
 * restarts. In any of those `readyState` becomes CLOSED and an `EventSource` never tries again —
 * so the pane sat on "reconnecting…" for ever, which is what coming back to a frozen tab looked
 * like.
 *
 * The pane therefore owns the lifecycle: a closed stream is replaced on a short backoff, and
 * returning to the tab forces an attempt rather than waiting for a timer to come round.
 */
function connectStream(id) {
  if (source) {
    source.close();
    source = undefined;
  }
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = undefined;
  }
  if (livenessTimer) {
    clearInterval(livenessTimer);
    livenessTimer = undefined;
  }

  source = new EventSource(rel('api/c/' + id + '/events'));
  // Any frame proves the stream is alive. The server writes a `: keepalive` comment
  // every 15s precisely so a quiet conversation can still prove it; that comment
  // does not surface as a named event, so the watchdog below has its own grace.
  lastFrameAt = Date.now();
  source.addEventListener('text', (e) => {
    lastFrameAt = Date.now();
    const d = JSON.parse(e.data);
    const wasBusy = liveText !== '';
    liveText = d.text;
    // The frame carries the turn so far as well as the message in flight; both are
    // needed to show a long answer while it is being assembled.
    turnText = typeof d.turn === 'string' ? d.turn : '';
    turnHtml = typeof d.turnHtml === 'string' ? d.turnHtml : '';
    liveHtml = d.html || '';
    busy = Boolean(d.busy);
    if (busy) statusLine = '';
    paint();
    // A turn that just finished has become transcript: refetch so the answer is
    // shown as a completed message and the live block goes away.
    if (!d.busy && wasBusy) {
      setTimeout(() => {
        void loadHistory().then(() => {
          liveText = '';
          turnText = '';
          turnHtml = '';
          liveHtml = '';
          paint();
        });
        // The turn may have edited an artifact and replied in a thread; both are
        // this pane's business, and neither is in the transcript frames.
        void refreshReview();
      }, 300);
    }
  });
  // The stream reconnects by itself when the server goes away and comes back.
  // Comparing versions on each open is how an already-open page picks up a
  // rebuilt front end: the draft is already saved, so the reload costs nothing.
  source.addEventListener('open', async () => {
    // A stream that opens is no longer reconnecting, whatever the last error said. Without this
    // the footer keeps the message for ever on an idle conversation, because no frame arrives to
    // overwrite it.
    // Not `=== 'reconnecting…'`: an attempt that showed its delay says
    // "reconnecting… (4s)", and an equality check against the bare string silently
    // stopped clearing the footer the moment the backoff started counting. Match the
    // prefix, which is the part that means "not connected".
    if (tool.textContent.startsWith('reconnecting…')) tool.textContent = '';
    // A stream that opened is a stream that works, so the next failure starts its
    // backoff from the bottom again rather than from wherever a bad patch left it.
    reconnectAttempts = 0;
    lastFrameAt = Date.now();
    startLivenessWatch(id);
    if (!pageVersion || reloadedForVersion) return;
    try {
      const environment = await (await fetch(rel('api/environment'))).json();
      const latest = String(environment.pageVersion || '');
      if (latest && latest !== pageVersion) {
        reloadedForVersion = true;
        saveDraft();
        location.reload();
      }
    } catch {
      // A failed probe means the server is not answering yet; the next open tries
      // again.
    }
  });

  source.addEventListener('tool', (e) => {
    lastFrameAt = Date.now();
    const d = JSON.parse(e.data);
    // The server words this exactly as Chat does; the page just shows it.
    statusLine = d ? String(d.line || '') : '';
    tool.textContent = '';
    paint();
  });
  source.addEventListener('error', () => {
    // Connection state is not conversation content, so it stays in the footer rather than in the
    // pane — but it must also be *true*. The browser stops retrying permanently once a stream
    // closes (a frozen tab, a phone that locked, a restart that answered 5xx), and then "reconnecting…"
    // would report an attempt nobody is making.
    tool.textContent = 'reconnecting…';
    const gone = !source || source.readyState === 2; // EventSource.CLOSED
    if (!gone || reconnectTimer) return;
    scheduleReconnect(id);
  });
}

/**
 * Try again, backing off.
 *
 * A fixed one-second retry is right for a bridge that is restarting and wrong for
 * one that is down for an hour: the pane would issue 3,600 requests and give the
 * restarter no room to breathe. The delay doubles from 1s to 30s, so the first
 * retry is still instant but a long outage settles into something polite.
 *
 * The footer says which it is, because "reconnecting…" that never resolves is
 * indistinguishable from a page that has quietly died.
 */
function scheduleReconnect(id) {
  if (reconnectTimer) return;
  const delay = Math.min(1000 * 2 ** reconnectAttempts, 30_000);
  reconnectAttempts += 1;
  if (reconnectAttempts > 2) {
    const secs = Math.round(delay / 1000);
    tool.textContent = `reconnecting… (${secs}s)`;
  }
  reconnectTimer = setTimeout(() => {
    reconnectTimer = undefined;
    connectStream(id);
  }, delay);
}

/**
 * Notice a stream that has stopped delivering, without ever erroring.
 *
 * The failure this exists for: a half-open connection. A dead NAT entry, a laptop
 * that slept, a proxy that dropped the stream while both ends still believe it is
 * up. Nothing fires — no `error`, no `close`, `readyState` stays OPEN — so the pane
 * sits there looking healthy and simply never updates again. That is precisely what
 * coming back to the tab after a while looked like.
 *
 * The server writes a `: keepalive` comment every 15s, so silence for well over
 * twice that means the connection is dead whatever the socket says. Reconnecting is
 * cheap and safe: the first frame after a reconnect is the whole current state, so
 * nothing is missed by starting over.
 */
function startLivenessWatch(id) {
  if (livenessTimer) clearInterval(livenessTimer);
  // 40s: two missed keepalives and a margin, so an ordinary hiccup or a slow
  // scheduler tick does not churn the connection.
  const SILENCE_MS = 40_000;
  livenessTimer = setInterval(() => {
    if (!source || source.readyState !== 1) {
      // A stream that is not open is the `error` handler's business, not this one's.
      return;
    }
    if (Date.now() - lastFrameAt < SILENCE_MS) return;
    // Deliberately silent in the footer: from the reader's point of view nothing
    // happened, and if the reconnect works nothing will have. Announcing a blip that
    // fixes itself is worse than the blip.
    connectStream(id);
  }, 10_000);
}

/**
 * The conversation's own name, for the header.
 *
 * A title if it has one, else its opening words — the same rule the index uses, so
 * a conversation is called the same thing wherever it appears.
 */
async function loadTitle() {
  const heading = document.getElementById('conv-title');
  heading.textContent = '#' + current;
  try {
    const conversation = await (await fetch(rel('api/c/' + current))).json();
    if (conversation && (conversation.name || conversation.chatKey)) {
      heading.textContent = conversation.name || conversation.chatKey;
    }
    // The same response carries the format, so the model and thinking pills can
    // say what will answer before anything is typed — one fetch, not two.
    adoptFormat(conversation);
  } catch {
    // The id is a fine fallback: the pane below is the thing being read.
  }
}

// Grow the box to fit what has been typed, so the whole message is visible
// instead of scrolling inside a fixed 3.5rem window that hides its first
// lines. `height: auto` first, otherwise scrollHeight still answers with the
// height the box already has and it can only ever grow, never shrink back.
// offsetHeight - clientHeight is the border, which scrollHeight excludes and
// border-box height includes.
function fitBox() {
  textBox.style.height = 'auto';
  const border = textBox.offsetHeight - textBox.clientHeight;
  // Never below the row's control height. `scrollHeight` measures content and
  // padding, so an empty box would otherwise resolve shorter than the buttons
  // beside it and the composer would sit ragged; the CSS `min-height` cannot help
  // once an inline height is set, which is exactly what this function does.
  const floor = parseFloat(getComputedStyle(textBox).minHeight) || 0;
  const wanted = Math.max(textBox.scrollHeight + border, floor);
  textBox.style.height = wanted + 'px';
  // Publish the resting height for the buttons to match. Only the *empty* box sets
  // it: once a message is being typed the box grows, and the buttons should stay a
  // button's height rather than stretching with it.
  if (textBox.value === '') matchControlHeight(wanted);
}

/** Make `--control-h` the box's own height, so the row lines up without guessing. */
function matchControlHeight(height) {
  document.documentElement.style.setProperty('--control-h', Math.round(height) + 'px');
}

textBox.addEventListener('input', fitBox);
// First paint: the box has its resting height once the font has loaded, which is
// when the buttons can be matched to it. `document.fonts` is optional; a browser
// without it gets the same result from the timeout.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitBox()).catch(() => {});
}
setTimeout(fitBox, 0);

// Paste can land a wall of text in one go, which fires `input` before the
// layout has the new content in some browsers; re-fit after it has settled.
textBox.addEventListener('paste', () => setTimeout(fitBox, 0));

const draftBox = document.getElementById('text');
draftBox.addEventListener('input', () => {
  saveDraft();
});

// --- Attached images ---
//
// Three ways in, one place to land: paste a screenshot, pick a file, or drop one
// on the pane. A screenshot on the clipboard is still the common case, so paste
// stays first-class, but "attach this picture from my phone" is the same request
// wearing a different hat — and a phone has no clipboard-to-paste for a photo
// that was never on it.
//
// The bytes stay in this page until send, as data URLs, and go up with the
// message. Nothing is uploaded on arrival: a message is one payload, and a file
// that sits on the server waiting for a message nobody sends is a temp file whose
// lifetime nobody owns.

/** Attached images waiting to be sent: `{dataUrl, mimeType, data}`. */
let pendingImages = [];
const attachmentsBox = document.getElementById('attachments');
const attachInput = document.getElementById('attach-input');
const attachNotice = document.getElementById('attach-notice');
const pane = document.getElementById('pane');

/**
 * The same limits the route enforces, so a file is refused here with a sentence
 * instead of failing the whole message at the server with a status code.
 *
 * They are repeated rather than fetched because the page must be able to answer
 * before it sends anything — a round trip to learn "that photo is too big" is a
 * worse way to find out. If they drift, the server still wins; this only decides
 * what is worth trying.
 */
const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGES = 10;

/**
 * Say why something was refused, in the place the thumbnails would have appeared.
 *
 * Silently ignoring a dropped file is the failure that makes people think the UI
 * is broken: the file is dragged, nothing happens, and there is nothing to read.
 */
let noticeTimer;
function attachNotice_(text) {
  attachNotice.textContent = text;
  attachNotice.hidden = !text;
  clearTimeout(noticeTimer);
  // Transient, but not instant: it has to be readable, and it should not sit
  // there for the rest of the conversation claiming a file was refused.
  if (text) noticeTimer = setTimeout(() => { attachNotice.hidden = true; attachNotice.textContent = ''; }, 6000);
}

/** `1.4 MB`, so a refusal names a size a person can compare with their file. */
function formatBytes(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function renderAttachments() {
  attachmentsBox.innerHTML = '';
  attachmentsBox.hidden = pendingImages.length === 0;
  pendingImages.forEach((image, index) => {
    const figure = document.createElement('figure');
    const img = document.createElement('img');
    img.src = image.dataUrl;
    img.alt = image.name || image.mimeType || 'attached image';
    img.title = image.name || image.mimeType || '';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.title = 'Remove';
    remove.onclick = () => {
      pendingImages.splice(index, 1);
      renderAttachments();
    };
    figure.append(img, remove);
    attachmentsBox.append(figure);
  });
  fitBox();
}

/**
 * Take files from any of the three ways in: keep the ones that are images within
 * the limits, and say what happened to the rest.
 *
 * One function rather than three copies, because the rules — which types, how
 * big, how many — are the part that must agree between paste, picker and drop.
 */
async function addImages(files) {
  const list = Array.from(files || []);
  if (list.length === 0) return;
  const refused = [];
  const accepted = [];
  for (const file of list) {
    if (!file || !String(file.type || '').startsWith('image/')) {
      refused.push('“' + (file && file.name ? file.name : 'that file') + '” is not an image');
    } else if (file.size > MAX_IMAGE_BYTES) {
      refused.push('“' + (file.name || 'that image') + '” is ' + formatBytes(file.size) +
        ', over the ' + formatBytes(MAX_IMAGE_BYTES) + ' limit');
    } else if (pendingImages.length + accepted.length >= MAX_IMAGES) {
      // Needed only for a drop of a whole folder: the route's body cap would
      // otherwise refuse the send itself, with no way to tell which file did it.
      refused.push('only ' + MAX_IMAGES + ' images fit in one message');
    } else {
      accepted.push(file);
    }
  }
  await Promise.all(accepted.map((file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const comma = dataUrl.indexOf(',');
      if (comma < 0) return resolve();
      pendingImages.push({
        dataUrl: dataUrl,
        data: dataUrl.slice(comma + 1),
        mimeType: file.type,
        name: file.name || '',
      });
      renderAttachments();
      resolve();
    };
    // A file that cannot be read is refused like any other: an unreadable image
    // would otherwise vanish between the picker and the strip.
    reader.onerror = () => {
      refused.push('“' + (file.name || 'that image') + '” could not be read');
      resolve();
    };
    reader.readAsDataURL(file);
  })));
  // Deduplicated and joined: dropping five text files should not say the same
  // thing five times, and the first reason is the one to act on.
  if (refused.length) attachNotice_([...new Set(refused)].join('; '));
  else attachNotice_('');
}

// Paste: clipboard files only, so an ordinary text paste is untouched.
draftBox.addEventListener('paste', (event) => {
  const items = event.clipboardData ? Array.from(event.clipboardData.items) : [];
  const files = items
    .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
    .map((item) => item.getAsFile())
    .filter((file) => file);
  if (files.length === 0) return; // ordinary text paste: leave it alone
  event.preventDefault();
  addImages(files);
});

// Picker: the attach button opens it, and the input is cleared afterwards so
// picking the same file twice in a row still fires `change`.
const attachButton = document.getElementById('attach');
attachButton.addEventListener('click', () => attachInput.click());
attachInput.addEventListener('change', () => {
  addImages(attachInput.files);
  attachInput.value = '';
});

// Drop: onto the pane, which includes the composer and the conversation above it.
// Counted rather than toggled, because dragging over a child fires `dragleave` on
// the parent: an unmatched leave would clear the highlight mid-drag and leave it
// stuck off after the drop.
let dragDepth = 0;
function carriesFiles(event) {
  const types = event.dataTransfer ? Array.from(event.dataTransfer.types || []) : [];
  return types.indexOf('Files') >= 0;
}
pane.addEventListener('dragenter', (event) => {
  if (!carriesFiles(event)) return;
  event.preventDefault();
  dragDepth += 1;
  pane.classList.add('dropping');
});
pane.addEventListener('dragover', (event) => {
  if (!carriesFiles(event)) return;
  // Without this the browser navigates to the file and the conversation is gone.
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});
pane.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) pane.classList.remove('dropping');
});
pane.addEventListener('drop', (event) => {
  dragDepth = 0;
  pane.classList.remove('dropping');
  if (!event.dataTransfer) return;
  // Only a file drop is ours: dropping selected text into the box is the
  // browser's own behaviour and must keep working.
  const files = Array.from(event.dataTransfer.files || []);
  if (files.length === 0) return;
  event.preventDefault();
  addImages(files);
  textBox.focus();
});

// Enter sends, because this is a chat box and that is what a chat box does.
// Shift-Enter and Ctrl-Enter (and Cmd-Enter) insert a newline instead, so a
// multi-line message is still possible without reaching for the mouse. IME
// composition is left alone: pressing Enter to commit a candidate must not send
// half a word.
draftBox.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  if (event.shiftKey || event.ctrlKey || event.metaKey) return;
  if (event.isComposing) return;
  event.preventDefault();
  document.getElementById('send').requestSubmit();
});

document.getElementById('send').onsubmit = async (e) => {
  e.preventDefault();
  const box = textBox;
  const text = box.value.trim();

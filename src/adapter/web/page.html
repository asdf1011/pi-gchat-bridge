<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi bridge</title>
<meta name="theme-color" content="#a51f34">
<!--
  Resolve everything against this document's own URL, not the origin root. The
  page may be served at /web/ directly or behind a reverse proxy at /pi/, and a
  hard-coded leading slash would point at the proxy's root instead of ours.
  With <base> and relative URLs the same build works at both, with no config.
-->
<base href="">
<!--
  The tab icon: a slice of cherry pie. After <base>, because a <base href> only
  rebinds the links that follow it — the icon href has to be mount-relative like
  every other URL here, or a page behind /pi/ would ask the proxy for
  /favicon.svg and get its 404 instead of ours. `type=` because Safari ignores an
  SVG icon without it; the apple-touch-icon is the same file, which iOS
  rasterises on its own, so there is no PNG to keep in step with the SVG.
-->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* One place for the type stack. `system-ui` alone resolves to whatever the
     distro ships on Linux/Android (DejaVu, Liberation, Nimbus), which reads as
     dated; naming the modern UI faces first means a machine that has Segoe,
     SF, Roboto or Inter gets it, and only a bare box falls through. */
  :root { --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
    Inter, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code",
    "JetBrains Mono", Menlo, Consolas, monospace; }
  body { margin: 0; font: 15px/1.5 var(--sans);
         display: flex; flex-direction: column; height: 100dvh;
         /* Antialiased so the modern faces don't read as chunky on macOS. */
         -webkit-font-smoothing: antialiased; }
  /* One exception to the fixed-height column: the index is a document, so the
     page itself scrolls. Pinning it to 100dvh with an inner scroller is what hid
     the rows past the fold on a phone, where the browser shows no scrollbar until
     something is already moving. */
  body.indexing { height: auto; min-height: 100dvh; }
  /* One page per conversation: no list beside it. The header carries the way back
     and the conversation's name, which is all the context the pane needs. */
  /* `min-width: 0` because a flex item's automatic minimum is its content: without
     it the conversation refuses to narrow and pushes the drawer off the edge. */
  #app { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #app[hidden] { display: none; }
  /* Header, log and composer share one column so the title sits over the
     conversation rather than off at the edge of a wide window. */
  #conv-header { display: flex; align-items: center; gap: .5rem; flex: none;
    padding: .35rem max(.6rem, calc((100% - var(--content)) / 2));
    border-bottom: 1px solid #8884; }
  #conv-header #back { text-decoration: none; color: inherit; font-size: 1.15rem;
    padding: .3rem .5rem; border-radius: .5rem; line-height: 1; }
  #conv-header #back:hover { background: #8882; }
  #conv-title { flex: 1; min-width: 0; font-size: .92em; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The artifacts toggle lives in the header on this page: a floating button would
     sit on top of the Send button, which is exactly where a thumb lands. */
  #artifacts-toggle { padding: .35rem .55rem; border-radius: .5rem; font-size: 1rem;
    border: 1px solid #8886; background: #8883; cursor: pointer; }
  /* `min-height: 0` on both the pane and the log is what lets the conversation
     give up space when the composer grows. Without it a flex item refuses to
     shrink below its content, so the composer is pushed past the window instead
     of the log shrinking. */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* A conversation reads as one column, not as two people at opposite ends of a
     wide desk. Past `--content` the gutter grows instead of the gap between the
     bubbles, so on a 1920px screen the exchange is still a conversation. */
  #log { flex: 1; overflow: auto; word-break: break-word; margin: 0; min-height: 0;
    padding: 1rem max(1rem, calc((100% - var(--content)) / 2));
    /* Newer browsers keep the visible content still when things are inserted
       above it. Ours does the anchoring by hand as well (see `prependEarlier`),
       because this is the one place a failure is obvious to the reader. */
    overflow-anchor: auto; }
  /* The top of the transcript: a stop for turning the page backwards, and a
     status line while that page is in the air. It is the first child of #log, so
     it scrolls out of sight with the rest of the conversation rather than
     floating over it. */
  #earlier { display: block; margin: 0 auto 1rem; padding: .45rem 1rem; font: inherit;
    font-size: .85em; opacity: .8; color: inherit; background: #8882; border: 1px solid #8884;
    border-radius: 1rem; cursor: pointer; }
  #earlier:hover { filter: brightness(.96); }
  #earlier[hidden] { display: none; }
  #earlier.settled { cursor: default; opacity: .55; }
  #earlier.settled:hover { filter: none; }
  /* Chat-shaped rows: the agent on the left with a name, you on the right with
     just a time. Bubbles cap their width so long answers stay readable, and the
     colours follow the system scheme. */
  :root { --bubble-pi: #f1f2f4; --bubble-me: #d6e4fd; --bubble-code: Canvas;
    --content: 54rem; }
  @media (prefers-color-scheme: dark) { :root { --bubble-pi: #2a2b2e; --bubble-me: #24405f; } }
  #log .msg { display: flex; gap: .55rem; margin: 0 0 .9rem; align-items: flex-start; }
  #log .msg.me { flex-direction: row-reverse; }
  #log .msg > .col { display: flex; flex-direction: column; min-width: 0; max-width: min(46rem, 86%); }
  #log .msg.me > .col { align-items: flex-end; }
  #log .meta { display: flex; gap: .4rem; align-items: baseline; margin: 0 0 .15rem .15rem;
    font-size: .78em; opacity: .65; }
  #log .meta .name { font-weight: 600; }
  #log .msg.me .meta { margin: 0 .15rem .15rem 0; }
  #log .bubble { border-radius: 1rem; padding: .55rem .85rem; overflow-x: auto; }
  #log .msg.pi .bubble { background: var(--bubble-pi); border-top-left-radius: .3rem; }
  #log .msg.me .bubble { background: var(--bubble-me); border-top-right-radius: .3rem; }
  #log .live .bubble { outline: 1px dashed #8884; }
  /* The live turn's status: which tool is running, or "thinking" before any text
     arrives. Chat shows the same thing inside the message it is editing, and so
     does this — inside the bubble, in the bubble's colours, so the reply and what
     it is doing read as one object. */
  #log .bubble .status { font: .82em var(--mono);
    opacity: .75; white-space: pre-wrap; word-break: break-word; }
  #log .bubble .status + * { margin-top: .5rem; }
  #log .images { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  #log .images img { max-width: min(24rem, 100%); max-height: 24rem; border-radius: .6rem; display: block; }
  #log .bubble > .body:not(:empty) + .status { margin-top: .5rem; }
  /* Rendered markdown. The HTML comes from the server's escape-first renderer,
     so every tag here is ours; these rules only make it readable in a pane. */
  /* Code and quotes sit on the page colour, like Chat's own code blocks. */
  #log .bubble pre { background: var(--bubble-code); }
  #log .body > :first-child { margin-top: 0; }
  #log .body > :last-child { margin-bottom: 0; }
  #log .body p, #log .body ul, #log .body ol { margin: .5rem 0; }
  #log .body h1, #log .body h2, #log .body h3, #log .body h4 { margin: .9rem 0 .4rem; line-height: 1.25; }
  #log .body h1 { font-size: 1.25em; } #log .body h2 { font-size: 1.15em; } #log .body h3 { font-size: 1.05em; }
  #log .body code { font-family: var(--mono); font-size: .9em;
    background: #8881; padding: .1em .3em; border-radius: 3px; }
  #log .body pre { background: #8881; padding: .6rem .75rem; border-radius: 6px; overflow-x: auto; margin: .6rem 0; }
  #log .body pre code { background: none; padding: 0; }
  #log .body ul, #log .body ol { padding-left: 1.3rem; }
  #log .body blockquote { margin: .6rem 0; padding-left: .8rem; border-left: 3px solid #8886; opacity: .85; }
  #log .body table { border-collapse: collapse; margin: .6rem 0; display: block; overflow-x: auto; }
  #log .body th, #log .body td { border: 1px solid #8886; padding: .3rem .5rem; text-align: left; vertical-align: top; }
  #log .body th { background: #8882; }
  #log .body hr { border: 0; border-top: 1px solid #8886; margin: 1rem 0; }
  #log .body a { color: inherit; }
  #tool { padding: .25rem 1rem; font: 12px var(--mono); opacity: .7; min-height: 1.6em; }
  /* The button sits on the baseline of the box, not stretched to its full
     height, so a grown textarea does not drag it into a tall slab. */
  form { display: flex; gap: .5rem; border-top: 1px solid #8884; align-items: flex-end;
    padding: .75rem max(.75rem, calc((100% - var(--content)) / 2)); }
  /* The box is shaped like the message it becomes: same colour, radius and
     padding as a `me` bubble, with the tighter corner on the trailing side. The
     send button matches it, so the composer and the sent message read as the
     same object before and after pressing send.
     Starts at one comfortable line and grows with the message (see fitBox).
     Past 40vh it stops and scrolls — a long paste should stay readable
     without pushing the whole conversation off the screen. */
  textarea { flex: 1; resize: none; min-height: 3.5rem; max-height: 40vh; overflow-y: auto;
    font: inherit; color: inherit; background: var(--bubble-me); border: 0;
    border-radius: 1rem; border-top-right-radius: .3rem; padding: .65rem .9rem; }
  textarea::placeholder { color: color-mix(in srgb, CanvasText 55%, transparent); }
  textarea:focus { outline: 2px solid color-mix(in srgb, CanvasText 25%, transparent); outline-offset: 1px; }
  /* `flex: none` because the textarea's flex:1 will otherwise squeeze the button
     until its label overflows the pill — visible as soon as the box is wide. */
  button { flex: none; white-space: nowrap; padding: .6rem 1.1rem; font: inherit;
    color: inherit; background: var(--bubble-me); border: 0; border-radius: 1rem;
    border-top-right-radius: .3rem; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  /* Artifacts: a floating toggle and a drawer that is hidden until asked for.
     The pane is an iframe on the artifact origin — a different origin, so it is
     sandboxed there and cannot reach this page's DOM or cookies. */
  /* The index: recent conversations, newest first, paged.
     It scrolls with the page, not inside a box of its own. A fixed-height
     `overflow: auto` pane on a phone hides its scrollbar (mobile browsers draw
     them only while scrolling), so the list and — crucially — the pager below it
     looked like the end of the content. With the document scrolling, the last row
     and the pager are simply the end of the page. */
  #index { padding: 1.5rem 1.25rem 6rem; }
  /* Wide enough for a title at any window: `max-width` alone left the rows' rules
     stopping mid-screen on a desktop. */
  #index > * { max-width: 46rem; margin-inline: auto; }
  #index h1 { font-size: 1.1rem; margin: 0 auto 1rem; font-weight: 600; }
  #index-list { list-style: none; margin: 0 auto; padding: 0; }
  #index-list li { padding: .6rem .75rem; border-bottom: 1px solid #8882; cursor: pointer;
    display: flex; gap: .75rem; align-items: baseline; }
  #index-list li:hover { background: #8881; }
  #index-list li .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A date, not a full timestamp: at phone width "Nov 2, 7:33 AM" is wide enough
     to ellipsise every title to two words. The time is in the row's title. */
  #index-list li .when { flex: none; font-size: .8em; opacity: .6; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  #index-pager { display: flex; gap: .5rem; align-items: center; margin: 1rem auto 0;
    font-size: .85em; opacity: .85; }
  #index-pager span { flex: 1; opacity: .7; }
  #index-pager button:disabled { opacity: .4; cursor: default; }
  #index-pager button:disabled:hover { filter: none; }
  /* A command's answer, above the composer and *outside* the transcript: `paint()` rebuilds the log
     from the transcript on every frame, so anything appended there would vanish on the next one. It
     is also the honest place — this is the application answering a question, not a message in the
     conversation. */
  #command-panel { margin: .5rem .75rem 0; border: 1px solid #8884; border-radius: .6rem;
    background: color-mix(in srgb, CanvasText 4%, Canvas); overflow: hidden; }
  #command-panel[hidden] { display: none; }
  #command-panel .head { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem;
    border-bottom: 1px solid #8883; font-size: .85em; font-weight: 600; }
  #command-panel .head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #command-panel .head button { padding: 0 .35rem; border: 0; background: none; cursor: pointer;
    color: inherit; opacity: .7; font-size: 1em; }
  #command-body { padding: .4rem .6rem .55rem; max-height: 40vh; overflow: auto; }
  #command-body p { margin: .2rem 0; white-space: pre-wrap; font-size: .95em; }
  #command-body ul { list-style: none; margin: 0; padding: 0; }
  #command-body li { margin: .15rem 0; }
  /* A row or an option is a button: anything with a command behind it is something to press. */
  #command-body .row { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem;
    width: 100%; text-align: left; padding: .35rem .45rem; border-radius: .45rem;
    border: 1px solid transparent; background: none; color: inherit; cursor: default; font: inherit; }
  #command-body .row.clickable { cursor: pointer; border-color: #8884; }
  #command-body .row.clickable:hover { background: color-mix(in srgb, CanvasText 8%, Canvas); }
  #command-body .row.current { border-color: color-mix(in srgb, CanvasText 30%, transparent); }
  #command-body .row .detail { font-size: .8em; opacity: .7; }
  #command-body form { display: flex; flex-direction: column; gap: .5rem; margin: .2rem 0 0; }
  #command-body label { display: flex; flex-direction: column; gap: .2rem; font-size: .85em; }
  #command-body select, #command-body input { font: inherit; padding: .3rem .4rem; border-radius: .4rem;
    border: 1px solid #8886; background: Canvas; color: inherit; }
  #command-body .hint { font-size: .78em; opacity: .65; }
  #command-body .actions { display: flex; gap: .5rem; }
  /* Attached images waiting to be sent, above the composer. Same strip whether
     they came from the clipboard, the file picker or a drop: to the person they
     are one thing — what this message carries. */
  #attachments { display: flex; gap: .5rem; padding: .5rem .75rem 0; flex-wrap: wrap; }
  #attachments[hidden] { display: none; }
  #attachments figure { margin: 0; position: relative; }
  #attachments img { height: 4rem; border-radius: .5rem; display: block; }
  #attachments figure > button { position: absolute; top: -.4rem; right: -.4rem; padding: 0;
    width: 1.25rem; height: 1.25rem; font-size: .7rem; line-height: 1; border-radius: 50%;
    border: 1px solid #8886; background: Canvas; cursor: pointer; }
  /* Attach: the file picker's button, shaped like the send button beside it. */
  #attach { padding: .6rem .8rem; }
  /* Why an attachment did not make it — a file that is not an image, or one too
     big to send. Above the composer, where the thumbnails would have appeared, so
     the message is attached to the thing that was refused rather than to the
     conversation. */
  #attach-notice { padding: .35rem .75rem 0; font-size: .85em; opacity: .85;
    color: color-mix(in srgb, CanvasText 75%, #d33); }
  #attach-notice[hidden] { display: none; }
  /* Drop target: the whole pane lights up, because dropping on a strip two
     centimetres tall is a game, and people drag onto the conversation. */
  #pane.dropping { outline: 2px dashed color-mix(in srgb, CanvasText 35%, transparent);
    outline-offset: -4px; border-radius: .5rem; }
  #new-chat { position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
    width: 2.75rem; height: 2.75rem; padding: 0; border-radius: 50%; font-size: 1.3rem;
    border: 1px solid #8886; background: var(--bubble-me); cursor: pointer; }
  #artifacts-toggle[hidden] { display: none; }
  /* The drawer is a column of the layout, not an overlay: opening it narrows the
     conversation instead of burying it. As an overlay the pane stayed centred on
     the *window*, so on anything less than very wide the middle of every answer
     sat under the panel while empty space remained to the left of it. */
  #workspace { flex: 1; display: flex; min-width: 0; min-height: 0; }
  #artifacts { flex: none; display: flex; flex-direction: column; background: Canvas;
    width: var(--artifacts-width, min(38rem, 45%)); border-left: 1px solid #8886;
    position: relative; }
  #artifacts[hidden] { display: none; }
  /* Drag the left edge to resize. Wide enough to hit with a thumb, invisible
     until you are over it. */
  #artifacts-resize { position: absolute; top: 0; bottom: 0; left: -4px; width: 9px;
    cursor: col-resize; touch-action: none; z-index: 1; }
  #artifacts-resize:hover, #artifacts.resizing #artifacts-resize { background: #8885; }
  /* Mid-drag, the whole page is the handle: no text selecting under the pointer. */
  body.resizing { cursor: col-resize; user-select: none; }
  #artifacts header { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem;
    border-bottom: 1px solid #8884; font-size: .9em; }
  #artifacts header strong { flex: 1; font-weight: 600; }
  #artifacts header button { padding: .15rem .5rem; }
  /* Two screens in one drawer: the list, and the document it opens. The document
     slides in from the right and covers the drawer, so a file gets the whole
     width instead of a strip under a list of names. */
  #artifacts-body { flex: 1; position: relative; min-height: 0; }
  #artifact-list-pane { position: absolute; inset: 0; overflow: auto; }
  #artifact-list { margin: 0; padding: 0; list-style: none; }
  #artifact-list li { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #8882;
    display: flex; gap: .6rem; align-items: baseline; }
  #artifact-list li:hover { background: #8881; }
  #artifact-list li.on { background: #8882; }
  /* The file's name is what you pick by; the directory rides underneath, dimmed,
     for the ones that share a name. */
  #artifact-list .col { flex: 1; min-width: 0; }
  #artifact-list .name { display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #artifact-list .dir { display: block; font-size: .78em; opacity: .55; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #artifact-list .counts { flex: none; font-size: .78em; opacity: .55; }
  #artifact-doc { position: absolute; inset: 0; display: flex;
    transform: translateX(100%); transition: transform 180ms ease; background: Canvas; }
  #artifacts.showing-doc #artifact-doc { transform: translateX(0); }
  #artifact-frame { flex: 1; border: 0; width: 100%; background: #fff0; }
  #artifact-hint { padding: .5rem .75rem; font-size: .85em; opacity: .7; margin: 0; }
  /* Review comments. The bar sits at the foot of the drawer rather than floating
     over the selection: it is one place for all comment chrome, it cannot cover
     the text being commented on, and on a phone the keyboard pushes it up. */
  #comment-bar, #comment-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    background: Canvas; border-top: 1px solid #8886; box-shadow: 0 -6px 24px #0002;
    padding: .6rem .75rem; display: flex; flex-direction: column; gap: .45rem;
    max-height: 70%; overflow: auto; }
  #comment-bar[hidden], #comment-sheet[hidden] { display: none; }
  #comment-bar .addr, #comment-sheet .addr { font: .78em var(--mono, monospace); opacity: .75;
    display: flex; gap: .5rem; align-items: baseline; }
  #comment-bar .addr span, #comment-sheet .addr span { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #comment-bar .quote, #comment-sheet .quote { margin: 0; padding: .3rem .5rem; border-left: 3px solid #8886;
    font: .82em var(--mono, monospace); opacity: .85; max-height: 6em; overflow: auto;
    white-space: pre-wrap; word-break: break-word; }
  #comment-text, #comment-reply { width: 100%; box-sizing: border-box; min-height: 3.2em;
    resize: vertical; font: inherit; padding: .45rem .55rem; border-radius: .5rem;
    border: 1px solid #8886; background: Field; color: FieldText; }
  .comment-actions { display: flex; gap: .5rem; align-items: center; }
  .comment-actions button { padding: .35rem .7rem; border-radius: .5rem; }
  .comment-actions .spacer { flex: 1; }
  #comment-error { color: #c33; font-size: .85em; margin: 0; }
  #comment-thread { display: flex; flex-direction: column; gap: .5rem; }
  .comment-turn { display: flex; flex-direction: column; gap: .2rem; }
  .comment-turn .who { font-size: .75em; opacity: .6; }
  .comment-turn .said { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .comment-turn.answer .said { background: #8881; border-radius: .5rem; padding: .4rem .55rem; }
  .comment-turn.note .said { border-left: 3px solid #8886; padding-left: .5rem; opacity: .9; }
  .comment-open { display: flex; align-items: center; gap: .5rem; font-size: .8em; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { #artifact-doc { transition: none; } }
  /* Phones: the index is the whole width, the pane keeps its padding, and the
     drawer takes the screen rather than a strip of it. */
  @media (max-width: 40rem) {
    body { font-size: 16px; }               /* stops iOS zooming on focus */
    #index { padding: 1rem .75rem 5rem; }
    #index h1 { font-size: 1rem; }
    #index-list li { padding: .7rem .25rem; }
    /* The pager is the only way to see past the first page, so on a phone it is
       a full-width pair of buttons rather than small text at the foot of a list. */
    #index-pager { margin-top: .75rem; }
    #index-pager button { flex: 1; padding: .6rem .5rem; }
    #index-pager span { flex: none; order: -1; opacity: .6; }
    #log { padding: .6rem .75rem; }
    #log .msg > .col { max-width: 92%; }
    #log .msg { gap: .4rem; }
    #pane { min-height: 0; }
    form { padding: .5rem; gap: .4rem; }
    textarea { min-height: 3rem; padding: .55rem .7rem; }
    button { padding: .55rem .85rem; }
    #attachments img { height: 3.2rem; }
    #attach { padding: .55rem .7rem; }
    #artifacts { position: fixed; inset: 0; width: 100%; border-left: 0; }
    #artifacts-resize { display: none; }
    #new-chat { right: .75rem; bottom: .75rem; }
  }
</style>
</head>
<body>
<section id="index" hidden>
  <h1>Conversations</h1>
  <ul id="index-list"></ul>
  <nav id="index-pager" hidden>
    <button id="index-newer" type="button">Newer</button>
    <span id="index-range"></span>
    <button id="index-older" type="button">Older</button>
  </nav>
</section>
<div id="workspace">
<div id="app" hidden>
  <header id="conv-header">
    <a id="back" href="./" title="All conversations" aria-label="All conversations">←</a>
    <span id="conv-title"></span>
    <button id="artifacts-toggle" title="Files this conversation wrote" hidden aria-label="Artifacts">🗂</button>
  </header>
  <div id="pane">
  <div id="log"></div>
  <div id="tool"></div>
    <div id="command-panel" hidden>
      <div class="head">
        <span id="command-title"></span>
        <button type="button" id="command-close" title="Close" aria-label="Close">✕</button>
      </div>
      <div id="command-body"></div>
    </div>
    <div id="attachments" hidden></div>
    <p id="attach-notice" hidden role="status" aria-live="polite"></p>
    <form id="send">
      <textarea id="text" placeholder="Message…" aria-label="Message this conversation"></textarea>
      <!-- The file picker behind the attach button: hidden, but still focusable
           via the label-free button that opens it, so the keyboard path is not
           lost. `accept` filters the dialog; the type is checked again on the
           way in, because a picker's filter is a hint, not a guarantee. -->
      <input id="attach-input" type="file" accept="image/*" multiple hidden>
      <button id="attach" type="button" title="Attach an image" aria-label="Attach an image">📎</button>
      <button>Send</button>
    </form>
  </div>
</div>
<button id="new-chat" title="Start a new conversation" aria-label="New chat">＋</button>
<aside id="artifacts" hidden>
  <div id="artifacts-resize" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <header>
    <button id="artifacts-back" type="button" title="Back to the list" aria-label="Back to the list" hidden>←</button>
    <strong id="artifacts-title">Artifacts</strong>
    <button id="artifacts-newtab" type="button" title="Open in a new tab" hidden>↗</button>
    <button id="artifacts-close" type="button" title="Close">✕</button>
  </header>
  <div id="artifacts-body">
    <div id="artifact-list-pane">
      <p id="artifact-hint">Pick a file.</p>
      <ul id="artifact-list"></ul>
    </div>
    <div id="artifact-doc">
      <iframe id="artifact-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
      <!-- Composing a comment on a selection, from inside the framed document.
           The document can only *report* a selection; this is where it becomes
           a message, because this origin is the one allowed to send. -->
      <div id="comment-bar" hidden>
        <div class="addr"><span id="comment-addr"></span></div>
        <p class="quote" id="comment-quote" hidden></p>
        <textarea id="comment-text" placeholder="Comment on this…" rows="2"></textarea>
        <p id="comment-error" hidden></p>
        <div class="comment-actions">
          <button type="button" id="comment-send">Comment</button>
          <button type="button" id="comment-cancel">Cancel</button>
        </div>
      </div>
      <!-- One comment's thread: what was said, what came back, and resolve. -->
      <div id="comment-sheet" hidden>
        <div class="addr"><span id="comment-sheet-addr"></span><button type="button" id="comment-sheet-close" title="Close">✕</button></div>
        <p class="quote" id="comment-sheet-quote" hidden></p>
        <div id="comment-thread"></div>
        <textarea id="comment-reply" placeholder="Reply in this thread…" rows="2"></textarea>
        <div class="comment-actions">
          <button type="button" id="comment-reply-send">Reply</button>
          <span class="spacer"></span>
          <button type="button" id="comment-resolve">Resolve</button>
        </div>
      </div>
    </div>
  </div>

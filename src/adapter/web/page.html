<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi bridge</title>
<!--
  Resolve everything against this document's own URL, not the origin root. The
  page may be served at /web/ directly or behind a reverse proxy at /pi/, and a
  hard-coded leading slash would point at the proxy's root instead of ours.
  With <base> and relative URLs the same build works at both, with no config.
-->
<base href="">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  /* One page per conversation: no list beside it. The header carries the way back
     and the conversation's name, which is all the context the pane needs. */
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #app[hidden] { display: none; }
  #conv-header { display: flex; align-items: center; gap: .5rem; padding: .35rem .6rem;
    border-bottom: 1px solid #8884; flex: none; }
  #conv-header #back { text-decoration: none; color: inherit; font-size: 1.15rem;
    padding: .3rem .5rem; border-radius: .5rem; line-height: 1; }
  #conv-header #back:hover { background: #8882; }
  #conv-title { flex: 1; min-width: 0; font-size: .92em; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The artifacts toggle lives in the header on this page: a floating button would
     sit on top of the Send button, which is exactly where a thumb lands. */
  #artifacts-toggle { padding: .35rem .55rem; border-radius: .5rem; font-size: 1rem;
    border: 1px solid #8886; background: #8883; cursor: pointer; }
  /* `min-height: 0` on both the pane and the log is what lets the conversation
     give up space when the composer grows. Without it a flex item refuses to
     shrink below its content, so the composer is pushed past the window instead
     of the log shrinking. */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log { flex: 1; overflow: auto; padding: 1rem; word-break: break-word; margin: 0; min-height: 0; }
  /* Chat-shaped rows: the agent on the left with an avatar and a name, you on
     the right with just a time. Bubbles cap their width so long answers stay
     readable, and the colours follow the system scheme. */
  :root { --bubble-pi: #f1f2f4; --bubble-me: #d6e4fd; --bubble-code: Canvas; }
  @media (prefers-color-scheme: dark) { :root { --bubble-pi: #2a2b2e; --bubble-me: #24405f; } }
  #log .msg { display: flex; gap: .55rem; margin: 0 0 .9rem; align-items: flex-start; }
  #log .msg.me { flex-direction: row-reverse; }
  #log .avatar { flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%;
    background: var(--bubble-pi); display: grid; place-items: center; font-size: .95rem; }
  #log .msg.me .avatar { display: none; }
  #log .msg > .col { display: flex; flex-direction: column; min-width: 0; max-width: min(46rem, 86%); }
  #log .msg.me > .col { align-items: flex-end; }
  #log .meta { display: flex; gap: .4rem; align-items: baseline; margin: 0 0 .15rem .15rem;
    font-size: .78em; opacity: .65; }
  #log .meta .name { font-weight: 600; }
  #log .msg.me .meta { margin: 0 .15rem .15rem 0; }
  #log .bubble { border-radius: 1rem; padding: .55rem .85rem; overflow-x: auto; }
  #log .msg.pi .bubble { background: var(--bubble-pi); border-top-left-radius: .3rem; }
  #log .msg.me .bubble { background: var(--bubble-me); border-top-right-radius: .3rem; }
  #log .live .bubble { outline: 1px dashed #8884; }
  /* The live turn's status: which tool is running, or "thinking" before any text
     arrives. Chat shows the same thing inside the message it is editing, and so
     does this — inside the bubble, in the bubble's colours, so the reply and what
     it is doing read as one object. */
  #log .bubble .status { font: .82em ui-monospace, SFMono-Regular, monospace;
    opacity: .75; white-space: pre-wrap; word-break: break-word; }
  #log .bubble .status + * { margin-top: .5rem; }
  #log .images { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  #log .images img { max-width: min(24rem, 100%); max-height: 24rem; border-radius: .6rem; display: block; }
  #log .bubble > .body:not(:empty) + .status { margin-top: .5rem; }
  /* Rendered markdown. The HTML comes from the server's escape-first renderer,
     so every tag here is ours; these rules only make it readable in a pane. */
  /* Code and quotes sit on the page colour, like Chat's own code blocks. */
  #log .bubble pre { background: var(--bubble-code); }
  #log .body > :first-child { margin-top: 0; }
  #log .body > :last-child { margin-bottom: 0; }
  #log .body p, #log .body ul, #log .body ol { margin: .5rem 0; }
  #log .body h1, #log .body h2, #log .body h3, #log .body h4 { margin: .9rem 0 .4rem; line-height: 1.25; }
  #log .body h1 { font-size: 1.25em; } #log .body h2 { font-size: 1.15em; } #log .body h3 { font-size: 1.05em; }
  #log .body code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em;
    background: #8881; padding: .1em .3em; border-radius: 3px; }
  #log .body pre { background: #8881; padding: .6rem .75rem; border-radius: 6px; overflow-x: auto; margin: .6rem 0; }
  #log .body pre code { background: none; padding: 0; }
  #log .body ul, #log .body ol { padding-left: 1.3rem; }
  #log .body blockquote { margin: .6rem 0; padding-left: .8rem; border-left: 3px solid #8886; opacity: .85; }
  #log .body table { border-collapse: collapse; margin: .6rem 0; display: block; overflow-x: auto; }
  #log .body th, #log .body td { border: 1px solid #8886; padding: .3rem .5rem; text-align: left; vertical-align: top; }
  #log .body th { background: #8882; }
  #log .body hr { border: 0; border-top: 1px solid #8886; margin: 1rem 0; }
  #log .body a { color: inherit; }
  #tool { padding: .25rem 1rem; font: 12px ui-monospace, monospace; opacity: .7; min-height: 1.6em; }
  /* The button sits on the baseline of the box, not stretched to its full
     height, so a grown textarea does not drag it into a tall slab. */
  form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #8884; align-items: flex-end; }
  /* The box is shaped like the message it becomes: same colour, radius and
     padding as a `me` bubble, with the tighter corner on the trailing side. The
     send button matches it, so the composer and the sent message read as the
     same object before and after pressing send.
     Starts at one comfortable line and grows with the message (see fitBox).
     Past 40vh it stops and scrolls — a long paste should stay readable
     without pushing the whole conversation off the screen. */
  textarea { flex: 1; resize: none; min-height: 3.5rem; max-height: 40vh; overflow-y: auto;
    font: inherit; color: inherit; background: var(--bubble-me); border: 0;
    border-radius: 1rem; border-top-right-radius: .3rem; padding: .65rem .9rem; }
  textarea::placeholder { color: color-mix(in srgb, CanvasText 55%, transparent); }
  textarea:focus { outline: 2px solid color-mix(in srgb, CanvasText 25%, transparent); outline-offset: 1px; }
  /* `flex: none` because the textarea's flex:1 will otherwise squeeze the button
     until its label overflows the pill — visible as soon as the box is wide. */
  button { flex: none; white-space: nowrap; padding: .6rem 1.1rem; font: inherit;
    color: inherit; background: var(--bubble-me); border: 0; border-radius: 1rem;
    border-top-right-radius: .3rem; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  /* Artifacts: a floating toggle and a drawer that is hidden until asked for.
     The pane is an iframe on the artifact origin — a different origin, so it is
     sandboxed there and cannot reach this page's DOM or cookies. */
  /* The index: recent conversations, newest first, paged. */
  #index { flex: 1; overflow: auto; padding: 1.5rem 1.25rem 6rem; }
  #index h1 { font-size: 1.1rem; margin: 0 0 1rem; font-weight: 600; }
  #index-list { list-style: none; margin: 0; padding: 0; max-width: 46rem; }
  #index-list li { padding: .6rem .75rem; border-bottom: 1px solid #8882; cursor: pointer;
    display: flex; gap: .75rem; align-items: baseline; }
  #index-list li:hover { background: #8881; }
  #index-list li .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #index-list li .when { flex: none; font-size: .8em; opacity: .6; }
  #index-pager { display: flex; gap: .5rem; align-items: center; margin-top: 1rem;
    max-width: 46rem; font-size: .85em; opacity: .85; }
  #index-pager span { flex: 1; opacity: .7; }
  #index-pager button:disabled { opacity: .4; cursor: default; }
  #index-pager button:disabled:hover { filter: none; }
  /* Pasted images waiting to be sent, above the composer. */
  #attachments { display: flex; gap: .5rem; padding: .5rem .75rem 0; flex-wrap: wrap; }
  #attachments[hidden] { display: none; }
  #attachments figure { margin: 0; position: relative; }
  #attachments img { height: 4rem; border-radius: .5rem; display: block; }
  #attachments button { position: absolute; top: -.4rem; right: -.4rem; padding: 0;
    width: 1.25rem; height: 1.25rem; font-size: .7rem; line-height: 1; border-radius: 50%;
    border: 1px solid #8886; background: Canvas; cursor: pointer; }
  #new-chat { position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
    width: 2.75rem; height: 2.75rem; padding: 0; border-radius: 50%; font-size: 1.3rem;
    border: 1px solid #8886; background: var(--bubble-me); cursor: pointer; }
  #artifacts-toggle[hidden] { display: none; }
  #artifacts { position: fixed; top: 0; right: 0; bottom: 0; width: min(38rem, 92vw);
    z-index: 9; display: flex; flex-direction: column; background: Canvas;
    border-left: 1px solid #8886; box-shadow: -4px 0 16px #0002; }
  #artifacts[hidden] { display: none; }
  #artifacts header { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem;
    border-bottom: 1px solid #8884; font-size: .9em; }
  #artifacts header strong { flex: 1; font-weight: 600; }
  #artifacts header button { padding: .15rem .5rem; }
  /* Two screens in one drawer: the list, and the document it opens. The document
     slides in from the right and covers the drawer, so a file gets the whole
     width instead of a strip under a list of names. */
  #artifacts-body { flex: 1; position: relative; min-height: 0; }
  #artifact-list-pane { position: absolute; inset: 0; overflow: auto; }
  #artifact-list { margin: 0; padding: 0; list-style: none; }
  #artifact-list li { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #8882;
    display: flex; gap: .6rem; align-items: baseline; }
  #artifact-list li:hover { background: #8881; }
  #artifact-list li.on { background: #8882; }
  /* The file's name is what you pick by; the directory rides underneath, dimmed,
     for the ones that share a name. */
  #artifact-list .col { flex: 1; min-width: 0; }
  #artifact-list .name { display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #artifact-list .dir { display: block; font-size: .78em; opacity: .55; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #artifact-list .counts { flex: none; font-size: .78em; opacity: .55; }
  #artifact-doc { position: absolute; inset: 0; display: flex;
    transform: translateX(100%); transition: transform 180ms ease; background: Canvas; }
  #artifacts.showing-doc #artifact-doc { transform: translateX(0); }
  #artifact-frame { flex: 1; border: 0; width: 100%; background: #fff0; }
  #artifact-hint { padding: .5rem .75rem; font-size: .85em; opacity: .7; margin: 0; }
  @media (prefers-reduced-motion: reduce) { #artifact-doc { transition: none; } }
  /* Phones: the index is the whole width, the pane keeps its padding, and the
     drawer takes the screen rather than a strip of it. */
  @media (max-width: 40rem) {
    body { font-size: 16px; }               /* stops iOS zooming on focus */
    #index { padding: 1rem .75rem 5rem; }
    #index h1 { font-size: 1rem; }
    #index-list li { padding: .7rem .25rem; }
    #log { padding: .6rem .75rem; }
    #log .msg > .col { max-width: 92%; }
    #log .msg { gap: .4rem; }
    #pane { min-height: 0; }
    form { padding: .5rem; gap: .4rem; }
    textarea { min-height: 3rem; padding: .55rem .7rem; }
    button { padding: .55rem .85rem; }
    #attachments img { height: 3.2rem; }
    #artifacts { width: 100vw; border-left: 0; }
    #new-chat { right: .75rem; bottom: .75rem; }
  }
</style>
</head>
<body>
<section id="index" hidden>
  <h1>Conversations</h1>
  <ul id="index-list"></ul>
  <nav id="index-pager" hidden>
    <button id="index-newer" type="button">Newer</button>
    <span id="index-range"></span>
    <button id="index-older" type="button">Older</button>
  </nav>
</section>
<div id="app" hidden>
  <header id="conv-header">
    <a id="back" href="./" title="All conversations" aria-label="All conversations">←</a>
    <span id="conv-title"></span>
    <button id="artifacts-toggle" title="Files this conversation wrote" hidden aria-label="Artifacts">🗂</button>
  </header>
  <div id="pane">
  <p id="log"></p>
  <div id="tool"></div>
    <div id="attachments" hidden></div>
    <form id="send">
      <textarea id="text" placeholder="Message…" aria-label="Message this conversation"></textarea>
      <button>Send</button>
    </form>
  </div>
</div>
<button id="new-chat" title="Start a new conversation" aria-label="New chat">＋</button>
<aside id="artifacts" hidden>
  <header>
    <button id="artifacts-back" type="button" title="Back to the list" aria-label="Back to the list" hidden>←</button>
    <strong id="artifacts-title">Artifacts</strong>
    <button id="artifacts-newtab" type="button" title="Open in a new tab" hidden>↗</button>
    <button id="artifacts-close" type="button" title="Close">✕</button>
  </header>
  <div id="artifacts-body">
    <div id="artifact-list-pane">
      <p id="artifact-hint">Pick a file.</p>
      <ul id="artifact-list"></ul>
    </div>
    <div id="artifact-doc">
      <iframe id="artifact-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>
</aside>
<script>
/**
 * A URL relative to wherever this page was served from.
 *
 * The base tag handles the normal case, but it resolves against the full URL,
 * so at "/pi" (no trailing slash) a relative path becomes "/api/x" -- the
 * proxy's root, not the app's. Appending the slash first makes both "/pi" and
 * "/pi/" work.
 */
/**
 * Resolve an API path against this page's own directory.
 *
 * The page may be served at /web, /pi/web or /pi/web/, depending on the reverse
 * proxy, so no URL here is absolute. 'api/...' from a page at /pi/web resolves
 * to /pi/api/... which is wrong -- hence the explicit base of the directory the
 * page was served *from*, normalised to end in '/'.
 */
/**
 * The mount root: "/" here, "/pi/" behind a proxy that keeps its prefix.
 *
 * A conversation page lives at `/<id>/`, so the document's own directory is one
 * level too deep for API paths — `rel()` has to resolve against the mount, not
 * against where this document happens to sit.
 */
function mountRoot() {
  const path = location.pathname;
  const conversation = /^(.*?)(?:\d+)\/?$/.exec(path);
  if (conversation) return conversation[1];
  const web = /^(.*?)\/web\/?$/.exec(path);
  if (web) return web[1];
  return path.endsWith('/') ? path : path + '/';
}

function rel(path) {
  return mountRoot() + path;
}

/** The conversation id this page is showing, from the URL. */
function conversationIdFromPath() {
  const match = /(\d+)\/?$/.exec(location.pathname);
  return match ? Number(match[1]) : undefined;
}

// State for the single open conversation. Declared here because the functions
// below assign them: without these the first click threw
// "ReferenceError: source is not defined" and the pane stayed blank.
let current;
let source;
const log = document.getElementById('log');
const tool = document.getElementById('tool');
const textBox = document.getElementById('text');

// The transcript so far, as the host bounded it, and the answer in flight.
// Both are painted into #log: history first, then the live text, so a reload
// mid-turn shows the conversation *and* the half-finished reply.
let history = [];
let liveText = '';
let liveHtml = '';
let busy = false;
let statusLine = '';
// The page version this document was rendered from; compared on every (re)connect.
let pageVersion = '';
// One reload per page life: if the version somehow keeps changing, reloading in a
// loop would be worse than a stale page.
let reloadedForVersion = false;

/**
 * Draft text, kept per conversation.
 *
 * Saved on every keystroke so a reload — ours, or the browser's, or the device's —
 * does not lose what you were typing. Cleared when the message is actually sent.
 */
function draftKey(id) {
  return 'pi-draft:' + id;
}

function saveDraft() {
  if (!current) return;
  const box = document.getElementById('text');
  const text = box.value;
  try {
    if (text.trim() === '') localStorage.removeItem(draftKey(current));
    else localStorage.setItem(draftKey(current), text);
  } catch {
    // Private mode or a full quota: drafts are a convenience, not a feature to
    // fail over.
  }
}

function restoreDraft(id) {
  const box = document.getElementById('text');
  if (!id) {
    box.value = '';
    return;
  }
  try {
    box.value = localStorage.getItem(draftKey(id)) || '';
  } catch {
    box.value = '';
  }
  fitBox();
}

/** Fallback when a frame arrives without rendered HTML (an older server). */
function escapeText(text) {
  const holder = document.createElement('div');
  holder.textContent = text;
  return holder.innerHTML;
}

/**
 * A time as a chat shows one: the clock for today, "yesterday 3:13pm" before
 * that, and a date once it is older than that. The full timestamp is in the
 * element's title, so nothing is lost by being brief.
 */
function formatWhen(ms) {
  const at = new Date(ms);
  if (Number.isNaN(at.getTime())) return '';
  const now = new Date();
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sameDay = at.toDateString() === now.toDateString();
  if (sameDay) return time;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (at.toDateString() === yesterday.toDateString()) return 'yesterday ' + time;
  const sameYear = at.getFullYear() === now.getFullYear();
  const date = at.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' });
  return date + ' ' + time;
}

/** One chat row: avatar and name for pi, just a time for you. */
function messageRow(role, html, at, live, images) {
  const me = role === 'user';
  const block = document.createElement('div');
  block.className = 'msg ' + (me ? 'me' : 'pi') + (live ? ' live' : '');

  if (!me) {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'π';
    block.append(avatar);
  }

  const col = document.createElement('div');
  col.className = 'col';

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!me) {
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = 'pi';
    meta.append(name);
  }
  const when = document.createElement('time');
  when.className = 'at';
  when.textContent = at ? formatWhen(at) : '';
  if (at) when.title = new Date(at).toLocaleString();
  meta.append(when);

  const bubble = document.createElement('div');
  bubble.className = 'bubble body';
  // Server-rendered markdown: the renderer escapes source before emitting any
  // tag, so this HTML is ours and cannot carry a script.
  bubble.innerHTML = html;

  // Images someone sent: fetched from this origin by entry and index, so the
  // transcript payload stays text.
  if (images && images.length && current) {
    const strip = document.createElement('div');
    strip.className = 'images';
    images.forEach((image, index) => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = image.mimeType || 'image';
      img.src = image.dataUrl || rel('api/c/' + current + '/image/' + image.entryId + '/' + index);
      strip.append(img);
    });
    if (strip.childElementCount > 0) bubble.append(strip);
  }

  col.append(meta, bubble);
  block.append(col);
  return block;
}

/**
 * Whether the conversation is scrolled to its end.
 *
 * Only then should it follow new content: reading history further up must not be
 * yanked to the bottom because a frame arrived or the composer grew.
 */
let atBottom = true;
const BOTTOM_SLACK_PX = 24;

log.addEventListener('scroll', () => {
  atBottom = log.scrollHeight - log.scrollTop - log.clientHeight <= BOTTOM_SLACK_PX;
});

// Growing the composer shrinks the log, and the browser keeps the scroll offset —
// which leaves the newest message cut in half at the boundary. Re-anchor when the
// log's box changes and we were already at the end, so the conversation slides up
// to stay whole instead of being clipped.
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(() => {
    if (atBottom) log.scrollTop = log.scrollHeight;
  }).observe(log);
}

function paint() {
  log.innerHTML = '';
  for (const message of history) {
    log.append(
      messageRow(
        message.role,
        message.html || escapeText(message.text || ''),
        message.at,
        false,
        message.images ? message.images.map((image) => ({ ...image, entryId: message.entryId })) : undefined,
      ),
    );
  }
  // The live turn: the streaming answer, and the status of whatever is running.
  if (liveText || busy || statusLine) {
    const row = messageRow('assistant', liveText ? (liveHtml || escapeText(liveText)) : '', undefined, true);
    // The bubble exists from the moment the turn starts, so the reply has a home
    // before it has any text — and the tool line goes *inside* it, the way Chat
    // paints a status into the message it is editing.
    const bubble = row.querySelector('.bubble');
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = statusLine || (busy && !liveText ? 'thinking…' : '');
    if (status.textContent) bubble.append(status);
    log.append(row);
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
  else log.scrollTop = Math.min(log.scrollTop, log.scrollHeight);
}

async function loadHistory() {
  if (!current) return;
  try {
    const rows = await (await fetch(rel('api/c/' + current + '/history'))).json();
    history = Array.isArray(rows) ? rows : [];
  } catch {
    history = [];
  }
  paint();
}

function open(id) {
  if (source) source.close();
  current = id;
  history = [];
  liveText = '';
  liveHtml = '';
  busy = false;
  statusLine = '';
  log.innerHTML = '';
  tool.textContent = '';
  restoreDraft(id);
  void loadHistory();
  source = new EventSource(rel('api/c/' + id + '/events'));
  source.addEventListener('text', (e) => {
    const d = JSON.parse(e.data);
    const wasBusy = liveText !== '';
    liveText = d.text;
    liveHtml = d.html || '';
    busy = Boolean(d.busy);
    if (busy) statusLine = '';
    paint();
    // A turn that just finished has become history: refetch so the answer is
    // shown as a completed message and the live block goes away.
    if (!d.busy && wasBusy) {
      setTimeout(() => {
        void loadHistory().then(() => {
          liveText = '';
          liveHtml = '';
          paint();
        });
      }, 300);
    }
  });
  // The stream reconnects by itself when the server goes away and comes back.
  // Comparing versions on each open is how an already-open page picks up a
  // rebuilt front end: the draft is already saved, so the reload costs nothing.
  source.addEventListener('open', async () => {
    if (!pageVersion || reloadedForVersion) return;
    try {
      const environment = await (await fetch(rel('api/environment'))).json();
      const latest = String(environment.pageVersion || '');
      if (latest && latest !== pageVersion) {
        reloadedForVersion = true;
        saveDraft();
        location.reload();
      }
    } catch {
      // A failed probe means the server is not answering yet; the next open tries
      // again.
    }
  });

  source.addEventListener('tool', (e) => {
    const d = JSON.parse(e.data);
    // The server words this exactly as Chat does; the page just shows it.
    statusLine = d ? String(d.line || '') : '';
    tool.textContent = '';
    paint();
  });
  source.addEventListener('error', () => {
    // EventSource reconnects by itself; show it so a restart is visible not
    // mysterious. Connection state is not conversation content, so it stays in
    // the footer rather than in the pane.
    tool.textContent = 'reconnecting…';
  });
}

/**
 * The conversation's own name, for the header.
 *
 * A title if it has one, else its opening words — the same rule the index uses, so
 * a conversation is called the same thing wherever it appears.
 */
async function loadTitle() {
  const heading = document.getElementById('conv-title');
  heading.textContent = '#' + current;
  try {
    const conversation = await (await fetch(rel('api/c/' + current))).json();
    if (conversation && (conversation.name || conversation.chatKey)) {
      heading.textContent = conversation.name || conversation.chatKey;
    }
  } catch {
    // The id is a fine fallback: the pane below is the thing being read.
  }
}

// Grow the box to fit what has been typed, so the whole message is visible
// instead of scrolling inside a fixed 3.5rem window that hides its first
// lines. `height: auto` first, otherwise scrollHeight still answers with the
// height the box already has and it can only ever grow, never shrink back.
// offsetHeight - clientHeight is the border, which scrollHeight excludes and
// border-box height includes.
function fitBox() {
  textBox.style.height = 'auto';
  const border = textBox.offsetHeight - textBox.clientHeight;
  textBox.style.height = textBox.scrollHeight + border + 'px';
}

textBox.addEventListener('input', fitBox);

// Paste can land a wall of text in one go, which fires `input` before the
// layout has the new content in some browsers; re-fit after it has settled.
textBox.addEventListener('paste', () => setTimeout(fitBox, 0));

const draftBox = document.getElementById('text');
draftBox.addEventListener('input', () => {
  saveDraft();
});

// --- Pasted images ---
//
// A screenshot on the clipboard is the most common thing anyone attaches to a
// message, so paste is the way in: no file picker, no upload button. The bytes
// stay in this page until send, as data URLs, and go up with the message.

/** Pasted images waiting to be sent: `{dataUrl, mimeType, data}`. */
let pendingImages = [];
const attachmentsBox = document.getElementById('attachments');

function renderAttachments() {
  attachmentsBox.innerHTML = '';
  attachmentsBox.hidden = pendingImages.length === 0;
  pendingImages.forEach((image, index) => {
    const figure = document.createElement('figure');
    const img = document.createElement('img');
    img.src = image.dataUrl;
    img.alt = image.mimeType || 'pasted image';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.title = 'Remove';
    remove.onclick = () => {
      pendingImages.splice(index, 1);
      renderAttachments();
    };
    figure.append(img, remove);
    attachmentsBox.append(figure);
  });
  fitBox();
}

draftBox.addEventListener('paste', (event) => {
  const items = event.clipboardData ? Array.from(event.clipboardData.items) : [];
  const files = items
    .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
    .map((item) => item.getAsFile())
    .filter((file) => file);
  if (files.length === 0) return; // ordinary text paste: leave it alone
  event.preventDefault();
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const comma = dataUrl.indexOf(',');
      if (comma < 0) return;
      pendingImages.push({ dataUrl: dataUrl, data: dataUrl.slice(comma + 1), mimeType: file.type });
      renderAttachments();
    };
    reader.readAsDataURL(file);
  }
});

// Enter sends, because this is a chat box and that is what a chat box does.
// Shift-Enter and Ctrl-Enter (and Cmd-Enter) insert a newline instead, so a
// multi-line message is still possible without reaching for the mouse. IME
// composition is left alone: pressing Enter to commit a candidate must not send
// half a word.
draftBox.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  if (event.shiftKey || event.ctrlKey || event.metaKey) return;
  if (event.isComposing) return;
  event.preventDefault();
  document.getElementById('send').requestSubmit();
});

document.getElementById('send').onsubmit = async (e) => {
  e.preventDefault();
  const box = textBox;
  const text = box.value.trim();
  if ((!text && pendingImages.length === 0) || !current) return;
  const sending = pendingImages;
  pendingImages = [];
  renderAttachments();
  box.value = '';
  fitBox();
  const response = await fetch(rel('api/c/' + current + '/message'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      images: sending.map((image) => ({ data: image.data, mimeType: image.mimeType })),
    }),
  });
  // Show it immediately, the way Chat echoes your message: waiting for the
  // history refetch at the end of the turn made it look lost.
  try {
    const result = await response.json();
    if (result && result.ok) {
      history.push({
        role: 'user',
        text: text,
        html: result.html,
        at: Date.now(),
        // The pasted image is shown from its data URL: it has no entry id until
        // the transcript comes back, and re-reading it from disk mid-send would
        // be slower than the copy already in hand.
        images: sending.map((image) => ({ mimeType: image.mimeType, dataUrl: image.dataUrl })),
      });
      paint();
    }
  } catch {
    // A failed submit is already visible as a missing message; the turn's own
    // error, if any, arrives on the stream.
  }
};

// --- Artifacts: a drawer over the conversation, hidden until asked for. ---
//
// The list comes from this origin (`api/c/<id>/artifacts`), so no CORS. The file
// itself is framed from the artifact host, which is a *different* origin: it is
// sandboxed there and cannot read this page's DOM, cookies or storage.

let artifactsBase = '';
let artifactsOpen = false;

const artifactsButton = document.getElementById('artifacts-toggle');
const artifactsPanel = document.getElementById('artifacts');
const artifactsList = document.getElementById('artifact-list');
const artifactsFrame = document.getElementById('artifact-frame');
const artifactsHint = document.getElementById('artifact-hint');
const artifactsNewTab = document.getElementById('artifacts-newtab');
const artifactsBack = document.getElementById('artifacts-back');
const artifactsTitle = document.getElementById('artifacts-title');

function artifactUrl(key, render) {
  return artifactsBase + '/c/' + current + '/' + key.split('/').map(encodeURIComponent).join('/') + (render ? '?render' : '');
}

/** The last path segment: what the file is actually called. */
function baseName(key) {
  const parts = key.split('/');
  return parts[parts.length - 1] || key;
}

/** The directory part, which may be empty at the root. */
function dirName(key) {
  const parts = key.split('/');
  parts.pop();
  return parts.join('/');
}

function showArtifact(key, markdown) {
  for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === key);
  // The document slides over the list and takes the drawer's full width, so a
  // name-heavy list stops competing with the thing being read.
  artifactsPanel.classList.add('showing-doc');
  artifactsTitle.textContent = baseName(key);
  artifactsTitle.title = key;
  artifactsBack.hidden = false;
  artifactsNewTab.hidden = false;
  // Markdown is rendered by the artifact host inside its sandboxed document;
  // everything else is shown as plain text, never as HTML.
  artifactsFrame.src = artifactUrl(key, markdown);
  artifactsNewTab.dataset.key = key;
  artifactsNewTab.dataset.markdown = markdown ? '1' : '';
}

/** Back to the list: the document is dropped, not kept loaded behind it. */
function showArtifactList() {
  artifactsPanel.classList.remove('showing-doc');
  artifactsTitle.textContent = 'Artifacts';
  artifactsTitle.removeAttribute('title');
  artifactsBack.hidden = true;
  artifactsNewTab.hidden = true;
  artifactsFrame.src = 'about:blank';
}

async function loadArtifacts() {
  artifactsList.innerHTML = '';
  if (!current) return;
  let rows;
  try {
    rows = await (await fetch(rel('api/c/' + current + '/artifacts'))).json();
  } catch {
    rows = [];
  }
  if (!Array.isArray(rows) || rows.length === 0) {
    artifactsHint.hidden = false;
    artifactsHint.textContent = 'No files were written or edited in this conversation.';
    return;
  }
  artifactsHint.hidden = rows.length > 0;
  for (const row of rows) {
    const li = document.createElement('li');
    li.dataset.key = row.key;
    li.innerHTML = '<span class="col"><span class="name"></span><span class="dir"></span></span><span class="counts"></span>';
    // The name first and the directory underneath: a list of full paths is mostly
    // directory, and the drawer only needs enough to tell two files apart.
    li.querySelector('.name').textContent = baseName(row.key);
    li.querySelector('.dir').textContent = dirName(row.key);
    const counts = [];
    if (row.wrote) counts.push(row.wrote + (row.wrote === 1 ? ' write' : ' writes'));
    if (row.edited) counts.push(row.edited + (row.edited === 1 ? ' edit' : ' edits'));
    li.querySelector('.counts').textContent = counts.join(', ');
    li.title = row.key;
    li.onclick = () => showArtifact(row.key, Boolean(row.markdown));
    artifactsList.append(li);
  }
  // Open on the list: choosing is the first act, and the document takes the screen
  // once chosen.
  showArtifactList();
}

function setArtifactsOpen(open) {
  artifactsOpen = open;
  artifactsPanel.hidden = !open;
  if (open) void loadArtifacts();
  else showArtifactList();
}

artifactsButton.onclick = () => setArtifactsOpen(!artifactsOpen);
document.getElementById('artifacts-close').onclick = () => setArtifactsOpen(false);
artifactsBack.onclick = () => showArtifactList();
artifactsNewTab.onclick = () => {
  const key = artifactsNewTab.dataset.key;
  if (key) window.open(artifactUrl(key, artifactsNewTab.dataset.markdown === '1'), '_blank', 'noopener');
};
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape' || !artifactsOpen) return;
  // Escape steps back one screen: document → list → closed.
  if (artifactsPanel.classList.contains('showing-doc')) showArtifactList();
  else setArtifactsOpen(false);
});

// The panel is pointless without an artifact host to point at, so it stays
// hidden unless the deployment says where that is.
void (async () => {
  try {
    const environment = await (await fetch(rel('api/environment'))).json();
    artifactsBase = String(environment.artifactsBaseUrl || '').replace(/\/$/, '');
    artifactsButton.hidden = artifactsBase === '';
    pageVersion = String(environment.pageVersion || '');
  } catch {
    artifactsButton.hidden = true;
  }
})();

// --- The index: recent conversations, paged, plus a new chat. ---

const PAGE_SIZE = 30;
let indexOffset = 0;

async function loadIndex(offset) {
  indexOffset = Math.max(0, offset || 0);
  let page = { items: [], more: false };
  try {
    page = await (await fetch(rel('api/conversations?limit=' + PAGE_SIZE + '&offset=' + indexOffset))).json();
  } catch {
    page = { items: [], more: false };
  }
  const list = document.getElementById('index-list');
  list.innerHTML = '';
  if (!Array.isArray(page.items) || page.items.length === 0) {
    const li = document.createElement('li');
    li.textContent = indexOffset === 0 ? 'No conversations yet — start one with ＋.' : 'Nothing older.';
    li.style.cursor = 'default';
    list.append(li);
  }
  for (const row of page.items || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="who"></span><span class="when"></span>';
    li.firstChild.textContent = row.name || row.chatKey;
    li.lastChild.textContent = formatWhen(row.lastActivityAt || row.createdAt);
    li.title = '#' + row.conversationId + ' · ' + row.model;
    li.onclick = () => {
      location.href = mountRoot() + row.conversationId + '/';
    };
    list.append(li);
  }

  const pager = document.getElementById('index-pager');
  const count = (page.items || []).length;
  pager.hidden = !(indexOffset > 0 || page.more);
  document.getElementById('index-newer').disabled = indexOffset === 0;
  document.getElementById('index-older').disabled = !page.more;
  document.getElementById('index-range').textContent =
    count === 0 ? '' : `${indexOffset + 1}–${indexOffset + count}`;
}

document.getElementById('index-newer').onclick = () => void loadIndex(indexOffset - PAGE_SIZE);
document.getElementById('index-older').onclick = () => void loadIndex(indexOffset + PAGE_SIZE);

document.getElementById('new-chat').onclick = async () => {
  try {
    const response = await fetch(rel('api/conversations'), { method: 'POST' });
    const created = await response.json();
    if (created && created.conversationId) location.href = mountRoot() + created.conversationId + '/';
  } catch {
    // Nothing sensible to say in the index; the click simply did not work.
  }
};

// --- Boot ---

const openId = conversationIdFromPath();
if (openId === undefined) {
  document.getElementById('index').hidden = false;
  document.getElementById('app').hidden = true;
  document.getElementById('new-chat').hidden = false;
  void loadIndex(0);
} else {
  document.getElementById('index').hidden = true;
  document.getElementById('app').hidden = false;
  // No floating ＋ on a conversation page: it sat exactly where Send is.
  document.getElementById('new-chat').hidden = true;
  document.getElementById('back').href = mountRoot();
  current = openId;
  void loadTitle();
  open(openId);
}
</script>
</body>
</html>

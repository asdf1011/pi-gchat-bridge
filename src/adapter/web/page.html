<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi bridge</title>
<!--
  Resolve everything against this document's own URL, not the origin root. The
  page may be served at /web/ directly or behind a reverse proxy at /pi/, and a
  hard-coded leading slash would point at the proxy's root instead of ours.
  With <base> and relative URLs the same build works at both, with no config.
-->
<base href="">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; display: flex; height: 100vh; }
  #list { width: 18rem; overflow: auto; border-right: 1px solid #8884; margin: 0; padding: 0; list-style: none; }
  #list li { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #8882; }
  #list li.on { background: #8882; }
  #list small { display: block; opacity: .6; font-size: .78em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* `min-height: 0` on both the pane and the log is what lets the conversation
     give up space when the composer grows. Without it a flex item refuses to
     shrink below its content, so the composer is pushed past the window instead
     of the log shrinking. */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log { flex: 1; overflow: auto; padding: 1rem; word-break: break-word; margin: 0; min-height: 0; }
  /* Chat-shaped rows: the agent on the left with an avatar and a name, you on
     the right with just a time. Bubbles cap their width so long answers stay
     readable, and the colours follow the system scheme. */
  :root { --bubble-pi: #f1f2f4; --bubble-me: #d6e4fd; --bubble-code: Canvas; }
  @media (prefers-color-scheme: dark) { :root { --bubble-pi: #2a2b2e; --bubble-me: #24405f; } }
  #log .msg { display: flex; gap: .55rem; margin: 0 0 .9rem; align-items: flex-start; }
  #log .msg.me { flex-direction: row-reverse; }
  #log .avatar { flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%;
    background: var(--bubble-pi); display: grid; place-items: center; font-size: .95rem; }
  #log .msg.me .avatar { display: none; }
  #log .msg > .col { display: flex; flex-direction: column; min-width: 0; max-width: min(46rem, 86%); }
  #log .msg.me > .col { align-items: flex-end; }
  #log .meta { display: flex; gap: .4rem; align-items: baseline; margin: 0 0 .15rem .15rem;
    font-size: .78em; opacity: .65; }
  #log .meta .name { font-weight: 600; }
  #log .msg.me .meta { margin: 0 .15rem .15rem 0; }
  #log .bubble { border-radius: 1rem; padding: .55rem .85rem; overflow-x: auto; }
  #log .msg.pi .bubble { background: var(--bubble-pi); border-top-left-radius: .3rem; }
  #log .msg.me .bubble { background: var(--bubble-me); border-top-right-radius: .3rem; }
  #log .live .bubble { outline: 1px dashed #8884; }
  /* The live turn's status: which tool is running, or "thinking" before any text
     arrives. Chat shows the same thing inside the message it is editing, and so
     does this — inside the bubble, in the bubble's colours, so the reply and what
     it is doing read as one object. */
  #log .bubble .status { font: .82em ui-monospace, SFMono-Regular, monospace;
    opacity: .75; white-space: pre-wrap; word-break: break-word; }
  #log .bubble .status + * { margin-top: .5rem; }
  #log .bubble > .body:not(:empty) + .status { margin-top: .5rem; }
  /* Rendered markdown. The HTML comes from the server's escape-first renderer,
     so every tag here is ours; these rules only make it readable in a pane. */
  /* Code and quotes sit on the page colour, like Chat's own code blocks. */
  #log .bubble pre { background: var(--bubble-code); }
  #log .body > :first-child { margin-top: 0; }
  #log .body > :last-child { margin-bottom: 0; }
  #log .body p, #log .body ul, #log .body ol { margin: .5rem 0; }
  #log .body h1, #log .body h2, #log .body h3, #log .body h4 { margin: .9rem 0 .4rem; line-height: 1.25; }
  #log .body h1 { font-size: 1.25em; } #log .body h2 { font-size: 1.15em; } #log .body h3 { font-size: 1.05em; }
  #log .body code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em;
    background: #8881; padding: .1em .3em; border-radius: 3px; }
  #log .body pre { background: #8881; padding: .6rem .75rem; border-radius: 6px; overflow-x: auto; margin: .6rem 0; }
  #log .body pre code { background: none; padding: 0; }
  #log .body ul, #log .body ol { padding-left: 1.3rem; }
  #log .body blockquote { margin: .6rem 0; padding-left: .8rem; border-left: 3px solid #8886; opacity: .85; }
  #log .body table { border-collapse: collapse; margin: .6rem 0; display: block; overflow-x: auto; }
  #log .body th, #log .body td { border: 1px solid #8886; padding: .3rem .5rem; text-align: left; vertical-align: top; }
  #log .body th { background: #8882; }
  #log .body hr { border: 0; border-top: 1px solid #8886; margin: 1rem 0; }
  #log .body a { color: inherit; }
  #tool { padding: .25rem 1rem; font: 12px ui-monospace, monospace; opacity: .7; min-height: 1.6em; }
  /* The button sits on the baseline of the box, not stretched to its full
     height, so a grown textarea does not drag it into a tall slab. */
  form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #8884; align-items: flex-end; }
  /* The box is shaped like the message it becomes: same colour, radius and
     padding as a `me` bubble, with the tighter corner on the trailing side. The
     send button matches it, so the composer and the sent message read as the
     same object before and after pressing send.
     Starts at one comfortable line and grows with the message (see fitBox).
     Past 40vh it stops and scrolls — a long paste should stay readable
     without pushing the whole conversation off the screen. */
  textarea { flex: 1; resize: none; min-height: 3.5rem; max-height: 40vh; overflow-y: auto;
    font: inherit; color: inherit; background: var(--bubble-me); border: 0;
    border-radius: 1rem; border-top-right-radius: .3rem; padding: .65rem .9rem; }
  textarea::placeholder { color: color-mix(in srgb, CanvasText 55%, transparent); }
  textarea:focus { outline: 2px solid color-mix(in srgb, CanvasText 25%, transparent); outline-offset: 1px; }
  /* `flex: none` because the textarea's flex:1 will otherwise squeeze the button
     until its label overflows the pill — visible as soon as the box is wide. */
  button { flex: none; white-space: nowrap; padding: .6rem 1.1rem; font: inherit;
    color: inherit; background: var(--bubble-me); border: 0; border-radius: 1rem;
    border-top-right-radius: .3rem; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  /* Artifacts: a floating toggle and a drawer that is hidden until asked for.
     The pane is an iframe on the artifact origin — a different origin, so it is
     sandboxed there and cannot reach this page's DOM or cookies. */
  #artifacts-toggle { position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
    width: 2.75rem; height: 2.75rem; padding: 0; border-radius: 50%;
    border: 1px solid #8886; background: #8883; font-size: 1.1rem; cursor: pointer; }
  #artifacts-toggle[hidden] { display: none; }
  #artifacts { position: fixed; top: 0; right: 0; bottom: 0; width: min(38rem, 92vw);
    z-index: 9; display: flex; flex-direction: column; background: Canvas;
    border-left: 1px solid #8886; box-shadow: -4px 0 16px #0002; }
  #artifacts[hidden] { display: none; }
  #artifacts header { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem;
    border-bottom: 1px solid #8884; font-size: .9em; }
  #artifacts header strong { flex: 1; font-weight: 600; }
  #artifacts header button { padding: .15rem .5rem; }
  #artifact-list { overflow: auto; margin: 0; padding: 0; list-style: none; max-height: 40%; }
  #artifact-list li { padding: .4rem .75rem; cursor: pointer; border-bottom: 1px solid #8882; font-size: .9em; }
  #artifact-list li.on { background: #8882; }
  #artifact-list small { display: block; opacity: .6; font-size: .8em; }
  #artifact-frame { flex: 1; border: 0; width: 100%; background: #fff0; }
  #artifact-hint { padding: .5rem .75rem; font-size: .85em; opacity: .7; margin: 0; }
</style>
</head>
<body>
<ul id="list"></ul>
<div id="pane">
  <p id="log"></p>
  <div id="tool"></div>
  <form id="send">
    <textarea id="text" placeholder="Message this conversation — same one Chat is in"></textarea>
    <button>Send</button>
  </form>
</div>
<button id="artifacts-toggle" title="Files this conversation wrote" hidden aria-label="Artifacts">🗂</button>
<aside id="artifacts" hidden>
  <header>
    <strong>Artifacts</strong>
    <button id="artifacts-newtab" type="button" title="Open in a new tab">↗</button>
    <button id="artifacts-close" type="button" title="Close">✕</button>
  </header>
  <p id="artifact-hint">Pick a file.</p>
  <ul id="artifact-list"></ul>
  <iframe id="artifact-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
</aside>
<script>
/**
 * A URL relative to wherever this page was served from.
 *
 * The base tag handles the normal case, but it resolves against the full URL,
 * so at "/pi" (no trailing slash) a relative path becomes "/api/x" -- the
 * proxy's root, not the app's. Appending the slash first makes both "/pi" and
 * "/pi/" work.
 */
/**
 * Resolve an API path against this page's own directory.
 *
 * The page may be served at /web, /pi/web or /pi/web/, depending on the reverse
 * proxy, so no URL here is absolute. 'api/...' from a page at /pi/web resolves
 * to /pi/api/... which is wrong -- hence the explicit base of the directory the
 * page was served *from*, normalised to end in '/'.
 */
function rel(path) {
  const here = location.pathname.replace(/[^/]*$/, '');
  return here + path;
}

// State for the single open conversation. Declared here because the functions
// below assign them: without these the first click threw
// "ReferenceError: source is not defined" and the pane stayed blank.
let current;
let source;
const log = document.getElementById('log');
const tool = document.getElementById('tool');
const textBox = document.getElementById('text');

// The transcript so far, as the host bounded it, and the answer in flight.
// Both are painted into #log: history first, then the live text, so a reload
// mid-turn shows the conversation *and* the half-finished reply.
let history = [];
let liveText = '';
let liveHtml = '';
let busy = false;
let statusLine = '';
// The page version this document was rendered from; compared on every (re)connect.
let pageVersion = '';
// One reload per page life: if the version somehow keeps changing, reloading in a
// loop would be worse than a stale page.
let reloadedForVersion = false;

/**
 * Draft text, kept per conversation.
 *
 * Saved on every keystroke so a reload — ours, or the browser's, or the device's —
 * does not lose what you were typing. Cleared when the message is actually sent.
 */
function draftKey(id) {
  return 'pi-draft:' + id;
}

function saveDraft() {
  if (!current) return;
  const box = document.getElementById('text');
  const text = box.value;
  try {
    if (text.trim() === '') localStorage.removeItem(draftKey(current));
    else localStorage.setItem(draftKey(current), text);
  } catch {
    // Private mode or a full quota: drafts are a convenience, not a feature to
    // fail over.
  }
}

function restoreDraft(id) {
  const box = document.getElementById('text');
  if (!id) {
    box.value = '';
    return;
  }
  try {
    box.value = localStorage.getItem(draftKey(id)) || '';
  } catch {
    box.value = '';
  }
  fitBox();
}

/** Fallback when a frame arrives without rendered HTML (an older server). */
function escapeText(text) {
  const holder = document.createElement('div');
  holder.textContent = text;
  return holder.innerHTML;
}

/**
 * A time as a chat shows one: the clock for today, "yesterday 3:13pm" before
 * that, and a date once it is older than that. The full timestamp is in the
 * element's title, so nothing is lost by being brief.
 */
function formatWhen(ms) {
  const at = new Date(ms);
  if (Number.isNaN(at.getTime())) return '';
  const now = new Date();
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sameDay = at.toDateString() === now.toDateString();
  if (sameDay) return time;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (at.toDateString() === yesterday.toDateString()) return 'yesterday ' + time;
  const sameYear = at.getFullYear() === now.getFullYear();
  const date = at.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' });
  return date + ' ' + time;
}

/** One chat row: avatar and name for pi, just a time for you. */
function messageRow(role, html, at, live) {
  const me = role === 'user';
  const block = document.createElement('div');
  block.className = 'msg ' + (me ? 'me' : 'pi') + (live ? ' live' : '');

  if (!me) {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'π';
    block.append(avatar);
  }

  const col = document.createElement('div');
  col.className = 'col';

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!me) {
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = 'pi';
    meta.append(name);
  }
  const when = document.createElement('time');
  when.className = 'at';
  when.textContent = at ? formatWhen(at) : '';
  if (at) when.title = new Date(at).toLocaleString();
  meta.append(when);

  const bubble = document.createElement('div');
  bubble.className = 'bubble body';
  // Server-rendered markdown: the renderer escapes source before emitting any
  // tag, so this HTML is ours and cannot carry a script.
  bubble.innerHTML = html;

  col.append(meta, bubble);
  block.append(col);
  return block;
}

/**
 * Whether the conversation is scrolled to its end.
 *
 * Only then should it follow new content: reading history further up must not be
 * yanked to the bottom because a frame arrived or the composer grew.
 */
let atBottom = true;
const BOTTOM_SLACK_PX = 24;

log.addEventListener('scroll', () => {
  atBottom = log.scrollHeight - log.scrollTop - log.clientHeight <= BOTTOM_SLACK_PX;
});

// Growing the composer shrinks the log, and the browser keeps the scroll offset —
// which leaves the newest message cut in half at the boundary. Re-anchor when the
// log's box changes and we were already at the end, so the conversation slides up
// to stay whole instead of being clipped.
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(() => {
    if (atBottom) log.scrollTop = log.scrollHeight;
  }).observe(log);
}

function paint() {
  log.innerHTML = '';
  for (const message of history) {
    log.append(messageRow(message.role, message.html || escapeText(message.text || ''), message.at, false));
  }
  // The live turn: the streaming answer, and the status of whatever is running.
  if (liveText || busy || statusLine) {
    const row = messageRow('assistant', liveText ? (liveHtml || escapeText(liveText)) : '', undefined, true);
    // The bubble exists from the moment the turn starts, so the reply has a home
    // before it has any text — and the tool line goes *inside* it, the way Chat
    // paints a status into the message it is editing.
    const bubble = row.querySelector('.bubble');
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = statusLine || (busy && !liveText ? 'thinking…' : '');
    if (status.textContent) bubble.append(status);
    log.append(row);
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
  else log.scrollTop = Math.min(log.scrollTop, log.scrollHeight);
}

async function loadHistory() {
  if (!current) return;
  try {
    const rows = await (await fetch(rel('api/c/' + current + '/history'))).json();
    history = Array.isArray(rows) ? rows : [];
  } catch {
    history = [];
  }
  paint();
}

function open(id) {
  if (source) source.close();
  current = id;
  history = [];
  liveText = '';
  liveHtml = '';
  busy = false;
  statusLine = '';
  log.innerHTML = '';
  tool.textContent = '';
  restoreDraft(id);
  void loadHistory();
  source = new EventSource(rel('api/c/' + id + '/events'));
  source.addEventListener('text', (e) => {
    const d = JSON.parse(e.data);
    const wasBusy = liveText !== '';
    liveText = d.text;
    liveHtml = d.html || '';
    busy = Boolean(d.busy);
    if (busy) statusLine = '';
    paint();
    // A turn that just finished has become history: refetch so the answer is
    // shown as a completed message and the live block goes away.
    if (!d.busy && wasBusy) {
      setTimeout(() => {
        void loadHistory().then(() => {
          liveText = '';
          liveHtml = '';
          paint();
        });
      }, 300);
    }
  });
  // The stream reconnects by itself when the server goes away and comes back.
  // Comparing versions on each open is how an already-open page picks up a
  // rebuilt front end: the draft is already saved, so the reload costs nothing.
  source.addEventListener('open', async () => {
    if (!pageVersion || reloadedForVersion) return;
    try {
      const environment = await (await fetch(rel('api/environment'))).json();
      const latest = String(environment.pageVersion || '');
      if (latest && latest !== pageVersion) {
        reloadedForVersion = true;
        saveDraft();
        location.reload();
      }
    } catch {
      // A failed probe means the server is not answering yet; the next open tries
      // again.
    }
  });

  source.addEventListener('tool', (e) => {
    const d = JSON.parse(e.data);
    // The server words this exactly as Chat does; the page just shows it.
    statusLine = d ? String(d.line || '') : '';
    tool.textContent = '';
    paint();
  });
  source.addEventListener('error', () => {
    // EventSource reconnects by itself; show it so a restart is visible not
    // mysterious. Connection state is not conversation content, so it stays in
    // the footer rather than in the pane.
    tool.textContent = 'reconnecting…';
  });
}

async function load() {
  const rows = await (await fetch(rel('api/conversations'))).json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const row of rows) {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><small></small>';
    li.firstChild.textContent = row.name || row.chatKey;
    li.lastChild.textContent = '#' + row.conversationId + ' · ' + row.model;
    li.onclick = () => {
      [...list.children].forEach((c) => c.classList.remove('on'));
      li.classList.add('on');
      open(row.conversationId);
    };
    list.append(li);
  }
  if (rows.length && !current) list.firstChild.click();
}

// Grow the box to fit what has been typed, so the whole message is visible
// instead of scrolling inside a fixed 3.5rem window that hides its first
// lines. `height: auto` first, otherwise scrollHeight still answers with the
// height the box already has and it can only ever grow, never shrink back.
// offsetHeight - clientHeight is the border, which scrollHeight excludes and
// border-box height includes.
function fitBox() {
  textBox.style.height = 'auto';
  const border = textBox.offsetHeight - textBox.clientHeight;
  textBox.style.height = textBox.scrollHeight + border + 'px';
}

textBox.addEventListener('input', fitBox);

// Paste can land a wall of text in one go, which fires `input` before the
// layout has the new content in some browsers; re-fit after it has settled.
textBox.addEventListener('paste', () => setTimeout(fitBox, 0));

const draftBox = document.getElementById('text');
draftBox.addEventListener('input', () => {
  saveDraft();
});

document.getElementById('send').onsubmit = async (e) => {
  e.preventDefault();
  const box = textBox;
  const text = box.value.trim();
  if (!text || !current) return;
  box.value = '';
  fitBox();
  const response = await fetch(rel('api/c/' + current + '/message'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  // Show it immediately, the way Chat echoes your message: waiting for the
  // history refetch at the end of the turn made it look lost.
  try {
    const result = await response.json();
    if (result && result.ok) {
      history.push({ role: 'user', text: text, html: result.html, at: Date.now() });
      paint();
    }
  } catch {
    // A failed submit is already visible as a missing message; the turn's own
    // error, if any, arrives on the stream.
  }
};

// --- Artifacts: a drawer over the conversation, hidden until asked for. ---
//
// The list comes from this origin (`api/c/<id>/artifacts`), so no CORS. The file
// itself is framed from the artifact host, which is a *different* origin: it is
// sandboxed there and cannot read this page's DOM, cookies or storage.

let artifactsBase = '';
let artifactsOpen = false;

const artifactsButton = document.getElementById('artifacts-toggle');
const artifactsPanel = document.getElementById('artifacts');
const artifactsList = document.getElementById('artifact-list');
const artifactsFrame = document.getElementById('artifact-frame');
const artifactsHint = document.getElementById('artifact-hint');
const artifactsNewTab = document.getElementById('artifacts-newtab');

function artifactUrl(key, render) {
  return artifactsBase + '/c/' + current + '/' + key.split('/').map(encodeURIComponent).join('/') + (render ? '?render' : '');
}

function showArtifact(key, markdown) {
  for (const li of artifactsList.children) li.classList.toggle('on', li.dataset.key === key);
  artifactsHint.hidden = true;
  artifactsFrame.hidden = false;
  // Markdown is rendered by the artifact host inside its sandboxed document;
  // everything else is shown as plain text, never as HTML.
  artifactsFrame.src = artifactUrl(key, markdown);
  artifactsNewTab.dataset.key = key;
  artifactsNewTab.dataset.markdown = markdown ? '1' : '';
}

async function loadArtifacts() {
  artifactsList.innerHTML = '';
  if (!current) return;
  let rows;
  try {
    rows = await (await fetch(rel('api/c/' + current + '/artifacts'))).json();
  } catch {
    rows = [];
  }
  if (!Array.isArray(rows) || rows.length === 0) {
    artifactsHint.hidden = false;
    artifactsHint.textContent = 'No files were written or edited in this conversation.';
    return;
  }
  for (const row of rows) {
    const li = document.createElement('li');
    li.dataset.key = row.key;
    li.innerHTML = '<span></span><small></small>';
    li.firstChild.textContent = row.key;
    const counts = [];
    if (row.wrote) counts.push(row.wrote + (row.wrote === 1 ? ' write' : ' writes'));
    if (row.edited) counts.push(row.edited + (row.edited === 1 ? ' edit' : ' edits'));
    li.lastChild.textContent = counts.join(', ');
    li.onclick = () => showArtifact(row.key, Boolean(row.markdown));
    artifactsList.append(li);
  }
  showArtifact(rows[0].key, Boolean(rows[0].markdown));
}

function setArtifactsOpen(open) {
  artifactsOpen = open;
  artifactsPanel.hidden = !open;
  if (open) void loadArtifacts();
  else artifactsFrame.src = 'about:blank';
}

artifactsButton.onclick = () => setArtifactsOpen(!artifactsOpen);
document.getElementById('artifacts-close').onclick = () => setArtifactsOpen(false);
artifactsNewTab.onclick = () => {
  const key = artifactsNewTab.dataset.key;
  if (key) window.open(artifactUrl(key, artifactsNewTab.dataset.markdown === '1'), '_blank', 'noopener');
};
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && artifactsOpen) setArtifactsOpen(false);
});

// The panel is pointless without an artifact host to point at, so it stays
// hidden unless the deployment says where that is.
void (async () => {
  try {
    const environment = await (await fetch(rel('api/environment'))).json();
    artifactsBase = String(environment.artifactsBaseUrl || '').replace(/\/$/, '');
    artifactsButton.hidden = artifactsBase === '';
    pageVersion = String(environment.pageVersion || '');
  } catch {
    artifactsButton.hidden = true;
  }
})();

// A page served at ".../web" (no trailing slash) resolves relative paths one
// level too high. Normalise once, preserving any query string.
if (!location.pathname.endsWith('/')) {
  location.replace(location.pathname + '/' + location.search);
} else {
  load();
  setInterval(load, 30000);
}
</script>
</body>
</html>

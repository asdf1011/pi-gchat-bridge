# cloudflared configuration for the pi bridge web UI.
#
# Install alongside the bridge (same container is fine — cloudflared is a single
# static binary). It opens OUTBOUND connections to Cloudflare's edge, so there is
# no port forward, no public IP and no inbound firewall rule: inbound requests
# are delivered down the connections it already holds.
#
#   cloudflared tunnel login
#   cloudflared tunnel create pi-bridge      # writes <tunnel-id>.json
#   cloudflared tunnel route dns pi-bridge pi.hl.id.au
#   cloudflared tunnel --config cloudflared.yml run
#
# Then in Cloudflare Zero Trust → Access → Applications, add a self-hosted
# application for pi.hl.id.au with a policy allowing only your email. Access
# enforces it at the EDGE: unauthenticated requests never enter the tunnel, so
# they never reach this machine. Nothing in the bridge implements auth.
#
# The bridge must bind loopback only (BRIDGE_BIND=127.0.0.1, the default), or
# the tunnel is decorative — anything else that can reach the port could submit
# as the bot, and could send the identity header itself.
#
# Every key below is from cloudflared's own config/configuration.go, not from
# memory: `disableChunkedEncoding` in particular disables chunked transfer
# encoding, which is the setting that matters for a long-lived event stream.
# `noHappyEyeballs` exists but is about dual-stack dialling, not buffering — it
# would have been cargo cult.

tunnel: pi-bridge
# Credentials: the tunnel token, held in the bridge's secret store as
# CLOUDFLARE_TUNNEL_TOKEN (set with `/secret set CLOUDFLARE_TUNNEL_TOKEN` in Chat)
# and passed here with --token by start-bridge.sh. The credentials-file line is
# kept commented so the alternative is documented without becoming an error:
#
#credentials-file: /etc/cloudflared/<tunnel-id>.json
#
# NOTE: whichever is used, this ingress block must stay. A token-only run
# (`cloudflared tunnel run --token ...` with no --config) pulls ingress from the
# Cloudflare dashboard, and `disableChunkedEncoding` below is NOT exposed there —
# without it the edge buffers the event stream and /web sits blank while the
# model replies.

ingress:
  # With BRIDGE_WEB_ENGINE=link the web front end is its own process on
  # BRIDGE_WEB_PORT, and that is what this hostname must reach: restarting it is
  # then a per-process affair and cannot interrupt a running turn. The session
  # host keeps 8081 for /healthz and /notify, which nothing outside this machine
  # needs.
  - hostname: pi.hl.id.au
    service: http://127.0.0.1:8083
    originRequest:
      # SSE carries the live answer. Without this, chunked encoding lets the
      # edge hold frames until the response ends — and an event stream never
      # ends, so the page would sit blank while the model streamed.
      disableChunkedEncoding: true
      # Must exceed the bridge's 15s keepalive comment, or the edge closes an
      # otherwise-healthy idle stream between turns.
      keepAliveTimeout: 90s
      keepAliveConnections: 8
      connectTimeout: 30s
      tlsTimeout: 10s
      # The bridge serves one hostname; send it the one the browser used.
      httpHostHeader: pi.hl.id.au

  # The artifact origin: a second listener in the same process, GET-only, with
  # no route to the mutating API. Its own hostname is what makes the isolation
  # real — a request here cannot reach `/web/api/.../message` however it is
  # crafted. Both hostnames are one level below the zone, so Universal SSL
  # covers them; both are gated by their own Access application.
  #
  # No SSE tuning: nothing here streams. `connectTimeout` is copied from the
  # main host for consistency rather than because it was needed.
  - hostname: artifacts.hl.id.au
    service: http://127.0.0.1:8082
    originRequest:
      connectTimeout: 30s
      httpHostHeader: artifacts.hl.id.au

  # Anything not matched above 404s at the edge rather than reaching the bridge.
  - service: http_status:404
